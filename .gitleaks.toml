# .gitleaks.toml — secret-scan policy for this PUBLIC repo.
#
# Extends the stock ruleset; every allowlist below is scoped by rule + path +
# line shape (condition = AND) so it suppresses exactly one false-positive
# class and nothing broader. NEVER add a path-only allowlist on k8s/ or
# terraform/ — that hides a real leak in the places most likely to have one.
# Scan git (`gitleaks git`), not the working tree: --no-git also walks
# gitignored files (tfstate, worktrees, vendored collections).

title = "homelab"

[extend]
useDefault = true

# SealedSecret ciphertext: bitnami sealed values always start with "Ag" and
# are 700+ chars (encrypted to the cluster public key — public-safe by design).
[[allowlists]]
description = "SealedSecret encryptedData ciphertext"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^k8s/.*\.ya?ml$''']
regexTarget = "line"
regexes = ['''^\s*[A-Za-z0-9_.-]+:\s*Ag[A-Za-z0-9+/=]{200,}\s*$''']

# ExternalSecret remoteRef Vault KV *paths* (identifiers, not values), e.g.
# `key: k8s/netbox/app`. Shape-locked to the secret/k8s|ansible path form.
[[allowlists]]
description = "ExternalSecret Vault KV path references"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^k8s/.*/externalsecret\.ya?ml$''']
regexTarget = "line"
regexes = ['''^\s*key:\s*(k8s|ansible)/[A-Za-z0-9_./-]+\s*$''']

# 1Password item IDs in the homelab shim (26-char lowercase alnum identifiers;
# accepted public recon surface per CLAUDE.md, not secret values).
[[allowlists]]
description = "1Password item UUIDs in homelab shim"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^\.config/scripts/homelab\.(sh|fish)$''']
regexTarget = "line"
regexes = ['''^\s*(set\s+)?_{0,2}op_[a-z0-9_]+[= ]\s*'?"?[a-z0-9]{26}"?'?\s*(#.*)?$''']
