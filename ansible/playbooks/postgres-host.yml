# ansible/playbooks/postgres-host.yml
---
- name: Configure PostgreSQL host (Patroni-managed HA cluster)
  hosts: postgres_hosts
  become: true
  # serial: 1 so each node finishes (Patroni up + role correct) before the
  # next starts. Critical for the adoption + replica-join ordering — Fulla
  # must claim DCS leadership before Vor/Idunn try to basebackup from it.
  # Override with `-e 'patroni_serial=0'` (full parallel) only when the
  # cluster is already in steady state and you want a config-only re-render.
  serial: "{{ patroni_serial | default(1) }}"

  roles:
    - role: baseline
      tags: [baseline]

    # Phase 1: PG packages + TLS cert + (adoption-primary-only) pre-Patroni
    # management user creation. In Patroni-managed mode this skips
    # cluster.yml / config.yml / hba.yml — Patroni owns those.
    - role: postgres
      tasks_from: prepare
      tags: [postgres, postgres-prepare]

    # Phase 2: Install Patroni, render config, stop+disable Debian PG service
    # on the adoption primary, start Patroni, wait for cluster-readiness.
    # Sets the `is_patroni_leader` fact consumed by the bootstrap pass.
    - role: patroni
      tags: [patroni]

    # Phase 3: Idempotent re-creation of management users + per-service DBs
    # against the Patroni leader (skipped on replicas — read-only). On Fulla
    # post-cutover this is a no-op; on a future leader election it's where
    # new per-service DBs get provisioned.
    - role: postgres
      tasks_from: bootstrap
      tags: [postgres, postgres-bootstrap]

    - role: hardening
      tags: [hardening]
