# ansible/playbooks/asgard-zabbix.yml
---
# Bootstrap host groups first (imported) so the agent role's
# register-host task can attach hugin's host record to "Asgard/LXCs/
# Zabbix" + "Linux servers" without the call failing on missing
# groups. Idempotent + no-op if groups already exist.
- import_playbook: zabbix-host-groups.yml

- name: Configure Zabbix server host
  hosts: zabbix
  become: true

  roles:
    - role: baseline
      tags: [baseline]

    # zabbix-server is the heavy lifter — installs server + frontend
    # + nginx + php-fpm + sql-scripts + bootstraps schema against
    # the existing zabbix DB on Patroni.
    - role: zabbix-server
      tags: [zabbix-server]

    # The Zabbix LXC also runs the agent locally — gives the dashboard
    # visibility into its own host as a sanity check.
    - role: zabbix-agent
      tags: [zabbix-agent]

    - role: hardening
      tags: [hardening]
