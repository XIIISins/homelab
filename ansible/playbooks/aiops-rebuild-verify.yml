# ansible/playbooks/aiops-rebuild-verify.yml
---
# Phase 10g step 7 `rebuild-verify` (T0, read-only) - canary class post-conditions from
# docs/operations/10g-rebuild-loop.md ("Class post-conditions"). Registry action `rebuild-verify`.
#
# Checks, each reported as its own boolean field of the result line:
#   ssh_as_ansible          the guest answers SSH as `ansible` (root is locked out by hardening)
#   vlagent_active          vlagent.service active
#   zabbix_agent2_active    zabbix-agent2.service active
#   zabbix_group_canary     the Zabbix host exists and is in group Asgard/LXCs/Canary
#   canary_template_linked  the "Canary smoke test" template is linked to that host
#   alert_cleared           the Zabbix host has no open High or Disaster problem (the originating alert recovered);
#                           retried for ~5 min because the agent heartbeat needs a few intervals after a rebuild
# `ok` is the AND of all of them. The run FAILS (assert) when ok is false so Semaphore reports `error`.
#
# Read-only: no `state:` on systemd, GET-style Zabbix JSON-RPC (host.get, problem.get) from the control plane with the
# same API token the host-group bootstrap uses; everything runs with check_mode false so it also reads under --check.
# Guard: canary registry host (name, VMID 1190-1192, urd), not on rebuild.deny. Run without --limit, or with a
# --limit equal to the target.
#
# Extra-vars: target (one canary name).

- name: AIOps rebuild-verify - guard
  hosts: "{{ target | default('aiops-no-target') }}" # default only keeps --syntax-check/ansible-lint parseable
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    _registry: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../aiops/actions.yml') | from_yaml }}"
    _canaries: "{{ _registry.rebuild.classes.canary.hosts }}"
    _deny: "{{ _registry.rebuild.deny }}"
  tasks:
    - name: Assert the target is a registered canary and any --limit equals it
      ansible.builtin.assert:
        that:
          - target is defined
          - target is match('^canary-[123]$')
          - ansible_limit is not defined or ansible_limit == target
          - target in _canaries
          - target in groups['canary']
          - target not in _deny.names
          - _canaries[target].vmid not in _deny.vmids
          - _canaries[target].vmid | int == 1189 + (target[-1] | int)
          - _canaries[target].node == 'urd'
        fail_msg: "rebuild-verify refused: {{ target | default('<unset>') }} is not a registered canary (canary-1..3, VMID 1190-1192 on urd)."
        quiet: true

- name: AIOps rebuild-verify - read the post-conditions
  hosts: "{{ target | default('aiops-no-target') }}"
  gather_facts: false
  become: false
  vars:
    _zbx_host: "{{ hostvars[zabbix_agent_api_delegate].ansible_host }}"
    _zbx_url: "http://{{ _zbx_host }}:{{ zabbix_agent_api_port }}/api_jsonrpc.php"
  tasks:
    - name: Probe SSH as ansible (ping module, never fails the play)
      ansible.builtin.ping:
      register: _aiops_ping
      ignore_unreachable: true
      failed_when: false
      check_mode: false
      retries: 6
      delay: 10
      until: _aiops_ping is not unreachable and (_aiops_ping.ping | default('')) == 'pong'

    - name: Read vlagent and zabbix-agent2 unit state (no state => read-only)
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop: [vlagent.service, zabbix-agent2.service]
      register: _aiops_units
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      when: _aiops_ping is not unreachable and (_aiops_ping.ping | default('')) == 'pong'

    - name: Read the Zabbix host record (groups and linked templates)
      ansible.builtin.uri:
        url: "{{ _zbx_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('community.hashi_vault.vault_kv2_get', zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 1
          method: host.get
          params:
            filter: {host: ["{{ target }}"]}
            output: [hostid, host]
            selectHostGroups: [name]
            selectParentTemplates: [name]
        status_code: 200
      delegate_to: localhost
      register: _aiops_zbx_host
      failed_when: false
      check_mode: false
      no_log: true # bearer token in the request

    - name: Read open High or Disaster problems of that host (retried while the agent heartbeat recovers)
      ansible.builtin.uri:
        url: "{{ _zbx_url }}"
        method: POST
        headers:
          Authorization: "Bearer {{ lookup('community.hashi_vault.vault_kv2_get', zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          id: 2
          method: problem.get
          params:
            hostids: "{{ _aiops_zbx_host.json.result[0].hostid | default('0') }}"
            severities: [4, 5]
            suppressed: false
            output: [eventid, name, severity]
        status_code: 200
      delegate_to: localhost
      register: _aiops_zbx_problems
      until: _aiops_zbx_problems.json.result | default([1]) | length == 0
      retries: 20
      delay: 15
      failed_when: false
      check_mode: false
      no_log: true
      when: _aiops_zbx_host.json.result | default([]) | length == 1

    - name: Compute the post-condition fields
      ansible.builtin.set_fact:
        _aiops_fields:
          ssh_as_ansible: "{{ _aiops_ping is not unreachable and (_aiops_ping.ping | default('')) == 'pong' }}"
          vlagent_active: "{{ (_aiops_units.results | default([]) | selectattr('item', 'equalto', 'vlagent.service') | map(attribute='status.ActiveState') | first | default('')) == 'active' }}"
          zabbix_agent2_active: "{{ (_aiops_units.results | default([]) | selectattr('item', 'equalto', 'zabbix-agent2.service') | map(attribute='status.ActiveState') | first | default('')) == 'active' }}"
          zabbix_group_canary: "{{ 'Asgard/LXCs/Canary' in (_zhost.hostgroups | default([]) | map(attribute='name') | list) }}"
          canary_template_linked: "{{ 'Canary smoke test' in (_zhost.parentTemplates | default([]) | map(attribute='name') | list) }}"
          alert_cleared: "{{ (_aiops_zbx_host.json.result | default([]) | length == 1) and (_aiops_zbx_problems.json.result | default([1]) | length == 0) }}"
      vars:
        _zhost: "{{ (_aiops_zbx_host.json.result | default([{}]))[0] | default({}) }}"

    - name: Emit machine-readable result
      ansible.builtin.debug:
        msg: "AIOPS_RESULT {{ _aiops_result | to_json }}"
      vars:
        _aiops_result: "{{ {'action': 'rebuild-verify', 'ok': _aiops_fields.values() | map('bool') | min, 'target': target} | combine(_aiops_fields) }}"

    - name: Fail the run if any post-condition is not met
      ansible.builtin.assert:
        that: _aiops_fields.values() | map('bool') | min
        fail_msg: "rebuild-verify: {{ target }} failed post-conditions: {{ _aiops_fields }}"
        quiet: true
