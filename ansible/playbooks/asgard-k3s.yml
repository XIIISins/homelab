---
- name: Configure asgard K3s nodes
  hosts: k3s
  become: true
  # One node at a time across the whole cluster. A config change that notifies
  # `restart-k3s` must never fire simultaneously on all 6 nodes — staggering
  # keeps etcd quorum (3 CPs: lose 1, keep 2/3) and avoids a cluster-wide
  # control-plane bounce. Slower converge is the deliberate tradeoff.
  # (CLAUDE.md "Default Ansible playbook execution is parallel" gotcha.)
  serial: 1

  roles:
    - { role: baseline, tags: baseline }
    - { role: k3s, tags: k3s }

    # Dedicated node-local data disk (/data) + SELinux prep for
    # local-path-provisioner. Workers only — CPs are tainted, no local-path
    # PVCs land there. Run serial:1 + reboot-test on first apply (Vault keeps
    # 2/3 quorum through a single-worker bounce).
    - role: local-path-disk
      tags: local-path-disk
      when: "'k3s_worker' in group_names"

    # Agents live in the per-host-group playbook so drift-check covers
    # them in this group's converge without re-iterating via the
    # cluster-wide standalones. K3s VMs ship host journald/syslog only —
    # pod logs go via the K8s-side victoria-logs-collector DaemonSet.
    - { role: vlagent, tags: vlagent }
    - { role: zabbix-agent, tags: zabbix-agent }

    - { role: hardening, tags: hardening }
