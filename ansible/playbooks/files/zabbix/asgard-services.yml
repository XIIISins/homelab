          name: 'HAProxy-etcd: vlan10-policy-routing.service state'
          key: 'systemd.unit.info[vlan10-policy-routing.service,ActiveState]'
          delay: 1m
          history: 7d
          trends: '0'
          value_type: CHAR
          description: systemd ActiveState of vlan10-policy-routing.service.
          triggers:
