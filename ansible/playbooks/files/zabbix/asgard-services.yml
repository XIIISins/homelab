                with one fewer standby. `systemctl status patroni` and `journalctl -u patroni -n 100` on the node,
                then `patronictl list`.
              tags:
                - tag: scope
                  value: patroni
        - uuid: 59e07964a1164c42ae062ad963df40f7
          name: 'Patroni: REST port 8008 refuses connections (TCP check)'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,8008]'
          delay: 30s
          history: 14d
          trends: 90d
          value_type: UNSIGNED
          description: '1 when the Zabbix server can open a TCP connection, 0 when it cannot.'
          triggers:
            - uuid: 51695b5eea8f45afba5075310edf5ddf
              expression: 'max(/Patroni service/net.tcp.service[tcp,,8008],5m)=0 and count(/Patroni service/net.tcp.service[tcp,,8008],5m)>=8'
              name: 'Patroni: REST port 8008 refuses connections'
              priority: AVERAGE
              description: >-
