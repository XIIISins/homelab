      template: K3s node service
      name: K3s node service
      description: 'The k3s unit (server on the control planes, agent on the workers).'
      groups:
        - name: Templates
      items:
        - uuid: 12d15317021443a48d4dfc3e7e06d60d
          name: 'K3s: k3s.service state'
          key: 'systemd.unit.info[k3s.service,ActiveState]'
          delay: 1m
          history: 7d
          trends: '0'
          value_type: CHAR
          description: systemd ActiveState of k3s.service.
          triggers:
            - uuid: f3ff80aa4f6f4bbebda962d27fd957ec
              expression: 'find(/K3s node service/systemd.unit.info[k3s.service,ActiveState],#5,"eq","active")=0'
              name: 'K3s: k3s.service is not active'
              priority: AVERAGE
              description: >-
                k3s is not active on this node for 5 minutes. A lone control plane or worker down degrades capacity
                but the cluster keeps serving; two control planes down loses etcd quorum and the API. Pods on a worker
                are rescheduled by Kubernetes after the eviction timeout. `systemctl status k3s` and `journalctl -u
                k3s -n 100` on the node.
              tags:
                - tag: scope
                  value: k3s
