          delay: 1m
          history: 7d
          trends: '0'
          value_type: CHAR
          description: systemd ActiveState of keepalived.service.
          triggers:
            - uuid: 3bab86c103a34ddd9d2ba8935148d9a4
              expression: 'find(/HAProxy-etcd services/systemd.unit.info[keepalived.service,ActiveState],#5,"eq","active")=0'
              name: 'HAProxy-etcd: keepalived.service is not active'
              priority: AVERAGE
              description: >-
                keepalived is not active, so this node can no longer hold the PostgreSQL VIP 10.0.10.210. With the
                other two nodes healthy nothing breaks, but failover capacity is down by one. `systemctl status
                keepalived` and `journalctl -u keepalived` on the node.
              tags:
