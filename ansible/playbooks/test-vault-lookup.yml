---
# ansible/playbooks/test-vault-lookup.yml
#
# Throwaway play to verify the HashiCorp Vault AppRole lookup pattern works
# end-to-end (collection installed, AppRole creds in env, policy permits read).
#
# Prerequisites:
#   1. terraform/vault/ applied — AppRole, ansible policy, ansible-local role exist.
#   2. SecretID generated; ~/.config/ansible/vault-approle.env populated.
#   3. ansible-vault-env sourced (fish function — see homelab-design.md).
#   4. Test secret written:
#      vault kv put secret/ansible/test/hello value=world
#
# Usage:
#   ansible-vault-env
#   ansible-playbook -i inventory/hosts.yml playbooks/test-vault-lookup.yml
#
# Expected: prints "Got value from Vault: world".
# Delete this file once the pattern is verified.

- name: Verify HashiCorp Vault AppRole lookup
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Read test secret from Vault
      ansible.builtin.debug:
        msg: "Got value from Vault: {{ lookup('community.hashi_vault.vault_kv2_get', 'ansible/test/hello').secret.value }}"
