# ansible/playbooks/zabbix-host-groups.yml
---
# Declarative bootstrap of Zabbix host groups from inventory. Each
# inventory group's `zabbix_agent_host_groups` list contributes its
# named groups; we aggregate across `all` and ensure each one exists
# in Zabbix via community.zabbix.zabbix_hostgroup (state=present,
# idempotent).
#
# This play is imported as a prerequisite by asgard-zabbix.yml (server
# deploy, including hugin's own host record) and zabbix-agent.yml
# (cluster-wide agent rollout). Either playbook can run first; the
# bootstrap ensures groups exist before any host record is created.
#
# Throttle 1 because Zabbix's hostgroup.create API doesn't handle
# the default 5 parallel ansible forks cleanly — same class as
# host.create. Run_once because the aggregation result is play-
# global, not per-host.

- name: Bootstrap Zabbix host groups (declarative, from inventory)
  hosts: all:!offsite # do1 is not zabbix-monitored via this loop
  become: false
  gather_facts: false

  tasks:
    - name: Aggregate referenced host groups across inventory
      ansible.builtin.set_fact:
        _zabbix_all_host_groups: >-
          {{ ansible_play_hosts_all
             | map('extract', hostvars)
             | map(attribute='zabbix_agent_host_groups', default=[])
             | flatten | unique | sort }}
      run_once: true
      delegate_to: localhost
      tags: [zabbix-agent, zabbix-agent:register, zabbix-agent:bootstrap]

    - name: Ensure host groups exist in Zabbix
      when: not ansible_check_mode  # mutating Zabbix API; httpapi+check_mode unreliable, not drift-check scope
      community.zabbix.zabbix_group:
        host_groups: "{{ _zabbix_all_host_groups }}"
        state: present
      delegate_to: "{{ zabbix_agent_api_delegate }}"
      run_once: true
      throttle: 1
      vars:
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_httpapi_port: "{{ zabbix_agent_api_port }}"
        ansible_httpapi_use_ssl: "{{ zabbix_agent_api_use_ssl }}"
        ansible_httpapi_validate_certs: false
        ansible_user: "{{ zabbix_agent_api_user }}"
        ansible_zabbix_auth_key: >-
          {{ lookup('community.hashi_vault.vault_kv2_get',
                    zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}
        ansible_zabbix_url_path: ""
      no_log: true # token in vars
      tags: [zabbix-agent, zabbix-agent:register, zabbix-agent:bootstrap]

    # Wave S4 — fleet-wide disk-usage (and inode) thresholds as explicit
    # global macros, so triggers don't depend on per-version stock
    # defaults. Per-host-class overrides live in each group's
    # zabbix_agent_host_macros (e.g. tighter on postgres).
    - name: Ensure fleet-wide Zabbix global macros
      when: not ansible_check_mode  # mutating Zabbix API; same scope note as host groups above
      community.zabbix.zabbix_globalmacro:
        macro_name: "{{ item.name }}"
        macro_value: "{{ item.value }}"
        macro_type: text  # community.zabbix 4.x wants the string, NOT the int 0
        state: present
      loop: "{{ zabbix_global_macros | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: "{{ zabbix_agent_api_delegate }}"
      run_once: true
      throttle: 1
      vars:
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_httpapi_port: "{{ zabbix_agent_api_port }}"
        ansible_httpapi_use_ssl: "{{ zabbix_agent_api_use_ssl }}"
        ansible_httpapi_validate_certs: false
        ansible_user: "{{ zabbix_agent_api_user }}"
        ansible_zabbix_auth_key: >-
          {{ lookup('community.hashi_vault.vault_kv2_get',
                    zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}
        ansible_zabbix_url_path: ""
      no_log: true # token in vars
      tags: [zabbix-agent, zabbix-agent:register, zabbix-agent:bootstrap, zabbix-agent:macros]

    # Phase 10f - the canary pool's own smoke-test template (High/Disaster triggers the AIOps loop can act on; the stock
    # agent-unavailable trigger is Average, which Gna never receives). Linked only via group_vars/canary.yml, and it must
    # exist BEFORE register-host links it, hence it lives in this bootstrap play. Template source:
    # playbooks/files/zabbix/canary-smoke-test.yml (item keys avoid the stock template's keys on purpose).
    - name: Ensure the canary smoke-test template exists in Zabbix
      when:
        - not ansible_check_mode  # mutating Zabbix API; same scope note as host groups above
        - "'canary' in groups"
      community.zabbix.zabbix_template:
        template_yaml: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/zabbix/canary-smoke-test.yml') }}"
        state: present
      delegate_to: "{{ zabbix_agent_api_delegate }}"
      run_once: true
      throttle: 1
      vars:
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_httpapi_port: "{{ zabbix_agent_api_port }}"
        ansible_httpapi_use_ssl: "{{ zabbix_agent_api_use_ssl }}"
        ansible_httpapi_validate_certs: false
        ansible_user: "{{ zabbix_agent_api_user }}"
        ansible_zabbix_auth_key: >-
          {{ lookup('community.hashi_vault.vault_kv2_get',
                    zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}
        ansible_zabbix_url_path: ""
      no_log: true # token in vars
      tags: [zabbix-agent, zabbix-agent:register, zabbix-agent:bootstrap, zabbix-agent:canary-template]

    # Phase 5h - the Jellyfin template (QSV smoke test, media mount, /health) and the Proxmox iGPU-hang template. Each is
    # imported only when its inventory group exists, and must exist BEFORE register-host links it (group_vars/media_server.yml,
    # group_vars/proxmox.yml). Sources: playbooks/files/zabbix/{jellyfin,proxmox-igpu}.yml.
    # Patroni replication (lag + not-streaming triggers for the PG nodes, group_vars/postgres.yml) rides the same loop:
    # playbooks/files/zabbix/patroni-replication.yml.
    - name: Ensure the Jellyfin, Proxmox iGPU and Patroni replication templates exist in Zabbix
      when:
        - not ansible_check_mode  # mutating Zabbix API; same scope note as host groups above
        - item.group in groups
      community.zabbix.zabbix_template:
        template_yaml: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/zabbix/' ~ item.file) }}"
        state: present
      loop:
        - {file: jellyfin.yml, group: media_server}
        - {file: proxmox-igpu.yml, group: proxmox}
        - {file: patroni-replication.yml, group: postgres}
      loop_control:
        label: "{{ item.file }}"
      delegate_to: "{{ zabbix_agent_api_delegate }}"
      run_once: true
      throttle: 1
      vars:
        ansible_connection: httpapi
        ansible_network_os: community.zabbix.zabbix
        ansible_httpapi_port: "{{ zabbix_agent_api_port }}"
        ansible_httpapi_use_ssl: "{{ zabbix_agent_api_use_ssl }}"
        ansible_httpapi_validate_certs: false
        ansible_user: "{{ zabbix_agent_api_user }}"
        ansible_zabbix_auth_key: >-
          {{ lookup('community.hashi_vault.vault_kv2_get',
                    zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}
        ansible_zabbix_url_path: ""
      no_log: true # token in vars
      tags: [zabbix-agent, zabbix-agent:register, zabbix-agent:bootstrap, zabbix-agent:jellyfin-template, zabbix-agent:patroni-template]
