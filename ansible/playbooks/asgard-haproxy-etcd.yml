# ansible/playbooks/asgard-haproxy-etcd.yml
---
- name: Configure HAProxy/etcd host
  hosts: haproxy_etcd
  become: true

  roles:
    - role: baseline
      tags: [baseline]
    - role: etcd
      tags: [etcd]
    - role: haproxy
      tags: [haproxy]
    - role: keepalived
      tags: [keepalived]

    # Agents live in the per-host-group playbook so drift-check covers
    # them in this group's converge without re-iterating via the
    # cluster-wide standalones.
    - role: vlagent
      tags: [vlagent]
    - role: zabbix-agent
      tags: [zabbix-agent]

    - role: hardening
      tags: [hardening]
