---
# ansible/playbooks/asgard-factorio.yml
#
# Provisions the Factorio LXC (host `factorio` in group `factorio`,
# 10.0.11.220 on VLAN 11).
#
# End state:
#   - Debian 13 LXC, fully patched
#   - `ansible` runtime user (NOPASSWD sudo, SSH-key auth)
#   - `recovery` break-glass user (NOPASSWD sudo, SSH-key auth)
#   - Factorio headless server (UDP 34197) running as the `factorio` user
#   - SFTPGo (TCP 22022) running, providing operator self-service via SFTP
#   - Hardened SSH posture: AllowUsers = ansible + recovery only,
#     PermitRootLogin prohibit-password (root SSH blocked by AllowUsers)
#
# Bootstrap (first run — LXC has only root SSH, no ansible user yet):
#     ansible-playbook -u root playbooks/asgard-factorio.yml
#
# Subsequent runs (use ansible_user: ansible from group_vars/all/vars.yml):
#     ansible-playbook playbooks/asgard-factorio.yml
#
# Tags (run any subset during development):
#     --tags baseline,factorio,sftpgo,hardening
#
# Required vars in group_vars/all/vault.yml:
#     ansible_user_ssh_public_key         baseline → ansible user
#     breakglass_ssh_public_key           baseline → recovery user
#     rhel_activation_key, rhel_org_id    baseline (RHEL only, unused here)
#     sftpgo_admin_password               sftpgo (auto-generated if blank)
#     vault_factorio_operator_password    sftpgo (operator SFTP password)
#
# Required UCG-Ultra port forwards (manual — UCG is not in IaC):
#     UDP 34197 → 10.0.11.220:34197    Factorio game protocol
#     TCP 22022 → 10.0.11.220:22022    SFTPGo SFTP
#
# DNS records to add via AdGuard (manual, until DNS-as-code):
#     factorio.niflheim.xiiisins.com   → 10.0.11.220   (internal)
#     factorio.xiiisins.com            → WAN IP        (external, public)

- name: Configure Factorio LXC
  hosts: gameserver
  gather_facts: true
  become: true

  roles:
    - role: baseline
      tags: [baseline]
    - role: factorio
      tags: [factorio]
    - role: sftpgo
      tags: [sftpgo]
    - role: hardening
      tags: [hardening]
