# ansible/playbooks/asgard-hermod.yml
---
- name: Configure Hermod (notifications hub)
  hosts: apprise
  become: true

  # Single host today (LXC 1103 on Verd). No serialization concern — kept
  # explicit so future scale-out (if Hermod ever becomes HA) defaults to
  # one-at-a-time to avoid notifying-during-deploy races.
  serial: 1

  roles:
    - role: baseline
      tags: [baseline]

    # Generic Caddy reverse-proxy. Renders a single site block (per
    # group_vars/hermod.yml caddy_sites) gating :80 → 127.0.0.1:8000
    # by the producer allowlist. Has to land before hermod-api so the
    # public listener is gated from the moment AppriseAPI is started.
    - role: caddy-reverse-proxy
      tags: [caddy]

    # AppriseAPI itself. pip+venv+gunicorn+systemd, binds 127.0.0.1:8000.
    # Renders /etc/apprise/config/<config-key>.yml from Vault.
    - role: hermod-api
      tags: [hermod-api]

    # Ship journald + /var/log/caddy/hermod.log to VictoriaLogs.
    # Caddy's JSON access log is the authoritative
    # "who-tried-to-alert-us" trail; producer-bug forensics live there.
    - role: vlagent
      tags: [vlagent]

    # Local agent for self-monitoring (Apprise process up, Caddy up,
    # disk usage). Producer-side, not Hermod-internal — Zabbix triggers
    # POST to Hermod via the webhook media-type (5h.2.i).
    - role: zabbix-agent
      tags: [zabbix-agent]

    - role: hardening
      tags: [hardening]
