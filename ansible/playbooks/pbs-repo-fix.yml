# ansible/playbooks/pbs-repo-fix.yml
---
# Disable PBS's apt enterprise repo. The PBS installer drops
# /etc/apt/sources.list.d/pbs-enterprise.sources pointing at
# https://enterprise.proxmox.com/... which 401s without a paid
# subscription, breaking every apt update.
#
# The no-subscription stream is already configured in
# /etc/apt/sources.list (Proxmox installer puts it there), so this
# playbook ONLY removes the enterprise file — that's the entire
# remediation. Cleanup of older filenames + an accidental
# pbs-no-subscription.list (created by a prior version of this
# playbook before we learned about the deb822 .sources format)
# folded into the same loop, all state=absent + idempotent.
#
# Run once after PBS install, or any time the enterprise file
# reappears (e.g. after a Proxmox package upgrade that re-drops it):
#   ansible-playbook ansible/playbooks/pbs-repo-fix.yml

- name: Remove PBS enterprise apt repo (no subscription → 401)
  hosts: pbs
  become: true
  gather_facts: false

  tasks:
    - name: Remove enterprise apt source(s) + legacy cruft
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/pbs-enterprise.sources # deb822 — current PBS installer drop
        - /etc/apt/sources.list.d/pbs-enterprise.list # legacy single-line format, if present
        - /etc/apt/sources.list.d/pbs-no-subscription.list # cleanup: redundant; pbs-no-sub already in /etc/apt/sources.list
      notify: apt update

  handlers:
    - name: apt update
      ansible.builtin.apt:
        update_cache: true
