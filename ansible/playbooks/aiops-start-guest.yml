# ansible/playbooks/aiops-start-guest.yml
---
# Phase 10g rung 0 action `start-guest` (T1, mutating) - registry entry in aiops/actions.yml (semaphore.planned until
# the template is applied). Starts ONE stopped canary LXC through its PVE host with `pct`. It never creates, destroys,
# stops or reconfigures anything: starting a running guest is a no-op.
#
# Scope today is the canary class only (LXCs 1190-1192, Urd). The guard reads aiops/actions.yml itself, so a caller
# cannot widen it with different extra-vars: the target must be a canary host in rebuild.classes.canary, not on
# rebuild.deny, name `canary-[123]` AND VMID 1189+N, and its registry node must be the PVE host this play runs on.
# Other classes (replicas) are refused here until a reviewed PR extends the playbook.
#
# Extra-vars: target (one canary name, never a group or pattern). Run it WITHOUT --limit: the mutating play targets
# the PVE host, and a --limit naming the (dead) guest would skip it, which fails safe (no result line, the executor
# reports failure).
# Result line: AIOPS_RESULT {"action": "start-guest", "ok": ..., "running": ..., "was": ...}
#
# pct rather than community.general.proxmox: the repo has no PVE API credential on the Semaphore side by design, and
# the proxmox inventory group already carries root SSH for host-level playbooks.

- name: AIOps start-guest - guard
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    _registry: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../aiops/actions.yml') | from_yaml }}"
    _canaries: "{{ _registry.rebuild.classes.canary.hosts }}"
    _deny: "{{ _registry.rebuild.deny }}"
  tasks:
    - name: Assert the target is well-formed and a registered canary (name, VMID, node, deny list)
      ansible.builtin.assert:
        that:
          - target is defined
          - target is match('^canary-[123]$')
          - target in _canaries
          - target in groups['canary']
          - target not in _deny.names
          - _canaries[target].vmid not in _deny.vmids
          - _canaries[target].vmid | int == 1189 + (target[-1] | int)
          - _canaries[target].vmid | int >= 1190
          - _canaries[target].vmid | int <= 1192
          - _canaries[target].node == 'urd'
        fail_msg: >-
          start-guest refused: {{ target | default('<unset>') }} is not a registered canary
          (name canary-1..3, VMID 1190-1192 on urd, not on rebuild.deny; see aiops/actions.yml rebuild.classes.canary).
        quiet: true

- name: AIOps start-guest - start the container on its PVE host
  hosts: urd # canary VMIDs live on Urd only (asserted above and in the registry lint)
  gather_facts: false
  become: false # root over SSH (group_vars/proxmox.yml)
  vars:
    _registry: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../aiops/actions.yml') | from_yaml }}"
    _vmid: "{{ _registry.rebuild.classes.canary.hosts[target].vmid | int }}"
  tasks:
    - name: Assert the container with this VMID carries the expected hostname
      ansible.builtin.command: "pct config {{ _vmid }}"
      register: _aiops_cfg
      changed_when: false
      check_mode: false
      failed_when: >-
        _aiops_cfg.rc != 0 or ('hostname: ' ~ target) not in _aiops_cfg.stdout_lines

    - name: Read the container status
      ansible.builtin.command: "pct status {{ _vmid }}"
      register: _aiops_status_before
      changed_when: false
      check_mode: false

    - name: Start the container when it is stopped
      ansible.builtin.command: "pct start {{ _vmid }}"
      when: "'status: stopped' in _aiops_status_before.stdout and not ansible_check_mode"
      changed_when: true

    - name: Wait until the container reports running
      ansible.builtin.command: "pct status {{ _vmid }}"
      register: _aiops_status_after
      until: "'status: running' in _aiops_status_after.stdout"
      retries: 10
      delay: 3
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Wait for SSH on the guest (a started container is not yet a reachable one)
      ansible.builtin.wait_for:
        host: "{{ hostvars[target].ansible_host }}"
        port: 22
        timeout: 120
      delegate_to: localhost
      register: _aiops_ssh
      failed_when: false
      check_mode: false
      when: "'status: running' in _aiops_status_after.stdout"

    - name: Emit machine-readable result
      ansible.builtin.debug:
        msg: "AIOPS_RESULT {{ _aiops_result | to_json }}"
      vars:
        _running: "{{ 'status: running' in _aiops_status_after.stdout }}"
        _aiops_result:
          action: start-guest
          ok: "{{ _running }}"
          target: "{{ target }}"
          vmid: "{{ _vmid | int }}"
          was: "{{ _aiops_status_before.stdout | regex_replace('^status:\\s*', '') | trim }}"
          running: "{{ _running }}"
          ssh_up: "{{ _aiops_ssh.state | default('') == 'started' }}"

    - name: Fail the run if the container is not running
      ansible.builtin.assert:
        that: "'status: running' in _aiops_status_after.stdout"
        fail_msg: "{{ target }} (VMID {{ _vmid }}) is not running after pct start; escalate (rung 1: rebuild)."
        quiet: true
