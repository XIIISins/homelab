# ansible/roles/docker/handlers/main.yml
---
- name: Restart docker
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: not ansible_check_mode

- name: Restart docker-user-drop
  ansible.builtin.systemd:
    name: docker-user-drop.service
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode
