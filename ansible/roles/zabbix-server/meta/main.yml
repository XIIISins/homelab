# ansible/roles/zabbix-server/meta/main.yml
---
galaxy_info:
  role_name: zabbix-server
  author: ghost
  description: Install + configure Zabbix server + frontend (nginx + php-fpm) + local agent. Backend on external Patroni PG via HAProxy VIP. See README for the DB-side bootstrap that must happen on the Patroni leader first.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
dependencies: []
collections:
  - community.hashi_vault # Vault lookups (admin password, SAML SP keypair, IdP info, API token)
  - community.zabbix # zabbix_mediatype + zabbix_user (hermod), zabbix_user_directory + zabbix_authentication (saml)
