# ansible/roles/zabbix-server/defaults/main.yml
---
# Zabbix release line — 7.0 LTS is current as of Phase 5h draft.
# 7.x is the modern major; 6.0 LTS was deprecated in 2025. Bump
# carefully — schema migrations happen between majors (Zabbix runs
# them automatically on first start, but downgrade isn't supported).
zabbix_major: "7.0"

# Repo URL pattern — Zabbix ships an apt repo .deb that registers
# their package signing key + repo lines. Pin the repo version to
# match `zabbix_major`. Debian-major (12 bookworm / 13 trixie) is
# templated from ansible_distribution_major_version at task time.
# Path is `/zabbix/<major>/debian/pool/...` — note there is NO
# `release/` segment (the `.../release/debian/...` variant 404s;
# verified against repo.zabbix.com directory listing 2026-05-25).
zabbix_repo_deb_url: "https://repo.zabbix.com/zabbix/{{ zabbix_major }}/debian/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_major }}+debian{{ ansible_distribution_major_version }}_all.deb"

# PHP-FPM service name + version pin. Zabbix 7.0 LTS officially
# supports PHP 8.0.0 - 8.5.X (with PHP 8.4 supported since 7.0.10).
# Zabbix's own apt repo for Debian 13 trixie declares only generic
# `php-*` virtuals on zabbix-frontend-php (and notably NO `php-fpm`
# dep at all — the FPM runtime is operator-supplied). Debian 13
# trixie resolves `php-*` virtuals to PHP 8.4, so we pin to 8.4 here:
# inside Zabbix's officially-supported window AND matches what trixie
# ships natively. Bump in lockstep with the Debian base when trixie
# defaults move. Used for both the package install + systemd unit name.
zabbix_php_version: "8.4"
zabbix_php_fpm_service: "php{{ zabbix_php_version }}-fpm"
zabbix_php_fpm_package: "php{{ zabbix_php_version }}-fpm"

# Apt packages — server-pgsql + the frontend + agent2. Nginx is
# preferred over Apache (lighter, simpler config). The sql-scripts
# package ships /usr/share/zabbix-sql-scripts/postgresql/*.sql.gz
# which is what we use to bootstrap the schema on first deploy.
# php-fpm is explicit here (Zabbix's frontend-php declares only PHP
# module deps, not the FPM runtime); pinned by zabbix_php_fpm_package.
zabbix_server_packages:
  - zabbix-server-pgsql
  - zabbix-frontend-php
  - zabbix-nginx-conf
  - zabbix-sql-scripts
  - zabbix-agent2
  - postgresql-client # for psql + the schema-load step
  - php-pgsql
  - "{{ zabbix_php_fpm_package }}"

# PG connection — points at the Patroni HAProxy VIP. The VIP routes
# writes to the current leader; if the leader fails over, Zabbix
# reconnects within the HAProxy idle timeout (default 30s).
zabbix_db_host: "10.0.10.210" # Patroni HAProxy VIP
zabbix_db_port: 5432
zabbix_db_name: zabbix
zabbix_db_user: zabbix
zabbix_db_password_vault_path: "ansible/postgres/zabbix-password"
zabbix_db_password_vault_field: value # TF-minted secrets store under `value` field (matches netbox/teamspeak convention)
zabbix_db_sslmode: require # libpq enforces TLS to the VIP

# Server config — most defaults are fine for homelab scale.
# CacheSize tuned for ~50 hosts × 30 metrics each ≈ 1500 series;
# upstream recommends 32MB minimum, doubling for headroom.
zabbix_server_listen_port: 10051
zabbix_server_cache_size: 64M
zabbix_server_history_cache_size: 32M
zabbix_server_trend_cache_size: 16M
zabbix_server_value_cache_size: 32M
zabbix_server_log_file: /var/log/zabbix/zabbix_server.log

# Web UI / nginx — port 80. server_name accepts every Host header
# Traefik may forward upstream:
#   - zabbix-direct.niflheim.xiiisins.com  → direct LXC backdoor (AGH rewrite)
#   - zabbix.midgard.xiiisins.com          → LAN, via Traefik (Phase 7c.5)
#   - zabbix.xiiisins.com                  → WAN, via Cloudflared+Traefik
# nginx default-server rejects unknown Hosts with 404; listing all
# accepted FQDNs keeps that rule strict while not relying on Host-
# rewrite middleware. Rendered space-separated by the template.
zabbix_web_server_names:
  - hugin-direct.niflheim.xiiisins.com
  - hugin.midgard.xiiisins.com
  - hugin.xiiisins.com
zabbix_web_listen_port: 80
zabbix_php_timezone: "Europe/Amsterdam" # local timezone

# Frontend display name — shown in the top-left of the Zabbix web UI
# + in the browser tab title. Cosmetic; pick whatever identifies the
# instance. Matches the Proxmox cluster name (niflheim) by default.
zabbix_frontend_server_name: "hugin"

# Admin user — Zabbix creates a default `Admin` user during schema
# load (with password `zabbix`). This role does NOT auto-rotate to
# the Vault-stored value — the operator logs in once with the factory
# default and changes via UI to the value at this Vault path, which
# keeps the IaC-tracked value and reality in sync. API-driven auto-
# rotation is the 7c.7 plan; until then the path serves as the
# canonical post-rotation value.
#
# If Admin gets locked out (5 failed attempts), unlock via:
#   UPDATE users SET attempt_failed=0, attempt_clock=0, attempt_ip=''
#   WHERE username='Admin';
# from a workstation psql session against the Patroni VIP. See the
# Phase 7c.2 incident retro.
zabbix_admin_user: Admin
zabbix_admin_password_vault_path: "ansible/zabbix/admin-password"
zabbix_admin_password_vault_field: value # TF-minted secrets store under `value` field

# Whether to bootstrap the DB schema on first run. Default true —
# the task is idempotent (skips if schema is already loaded). Set
# false on a re-run if you're certain schema is loaded and want
# to skip the slow grep-check.
zabbix_bootstrap_schema: true
