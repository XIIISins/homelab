# ansible/roles/zabbix-server/defaults/main.yml
---
# Zabbix release line — 7.0 LTS is current as of Phase 5h draft.
# 7.x is the modern major; 6.0 LTS was deprecated in 2025. Bump
# carefully — schema migrations happen between majors (Zabbix runs
# them automatically on first start, but downgrade isn't supported).
zabbix_major: "7.0"

# Repo URL pattern — Zabbix ships an apt repo .deb that registers
# their package signing key + repo lines. Pin the repo version to
# match `zabbix_major`. Debian-major (12 bookworm / 13 trixie) is
# templated from ansible_distribution_major_version at task time.
# Path is `/zabbix/<major>/debian/pool/...` — note there is NO
# `release/` segment (the `.../release/debian/...` variant 404s;
# verified against repo.zabbix.com directory listing 2026-05-25).
zabbix_repo_deb_url: "https://repo.zabbix.com/zabbix/{{ zabbix_major }}/debian/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_major }}+debian{{ ansible_distribution_major_version }}_all.deb"

# PHP-FPM service name + version pin. Zabbix 7.0 LTS officially
# supports PHP 8.0.0 - 8.5.X (with PHP 8.4 supported since 7.0.10).
# Zabbix's own apt repo for Debian 13 trixie declares only generic
# `php-*` virtuals on zabbix-frontend-php (and notably NO `php-fpm`
# dep at all — the FPM runtime is operator-supplied). Debian 13
# trixie resolves `php-*` virtuals to PHP 8.4, so we pin to 8.4 here:
# inside Zabbix's officially-supported window AND matches what trixie
# ships natively. Bump in lockstep with the Debian base when trixie
# defaults move. Used for both the package install + systemd unit name.
zabbix_php_version: "8.4"
zabbix_php_fpm_service: "php{{ zabbix_php_version }}-fpm"
zabbix_php_fpm_package: "php{{ zabbix_php_version }}-fpm"

# Apt packages — server-pgsql + the frontend + agent2. Nginx is
# preferred over Apache (lighter, simpler config). The sql-scripts
# package ships /usr/share/zabbix-sql-scripts/postgresql/*.sql.gz
# which is what we use to bootstrap the schema on first deploy.
# php-fpm is explicit here (Zabbix's frontend-php declares only PHP
# module deps, not the FPM runtime); pinned by zabbix_php_fpm_package.
zabbix_server_packages:
  - zabbix-server-pgsql
  - zabbix-frontend-php
  - zabbix-nginx-conf
  - zabbix-sql-scripts
  - zabbix-agent2
  - postgresql-client # for psql + the schema-load step
  - php-pgsql
  - "{{ zabbix_php_fpm_package }}"

# PG connection — points at the Patroni HAProxy VIP. The VIP routes
# writes to the current leader; if the leader fails over, Zabbix
# reconnects within the HAProxy idle timeout (default 30s).
zabbix_db_host: "10.0.10.210" # Patroni HAProxy VIP
zabbix_db_port: 5432
zabbix_db_name: zabbix
zabbix_db_user: zabbix
zabbix_db_password_vault_path: "ansible/postgres/zabbix-password"
zabbix_db_password_vault_field: value # TF-minted secrets store under `value` field (matches netbox/teamspeak convention)
zabbix_db_sslmode: require # libpq enforces TLS to the VIP

# Server config — most defaults are fine for homelab scale.
# CacheSize tuned for ~50 hosts × 30 metrics each ≈ 1500 series;
# upstream recommends 32MB minimum, doubling for headroom.
zabbix_server_listen_port: 10051
zabbix_server_cache_size: 64M
zabbix_server_history_cache_size: 32M
zabbix_server_trend_cache_size: 16M
zabbix_server_value_cache_size: 32M
zabbix_server_log_file: /var/log/zabbix/zabbix_server.log

# Web UI / nginx — port 80. server_name accepts every Host header
# Traefik may forward upstream. All FQDNs are identity-themed
# (hugin = the LXC's Norse identity), not service-themed:
#   - hugin-direct.niflheim.xiiisins.com  → direct LXC backdoor (AGH rewrite, bypasses Traefik)
#   - hugin.midgard.xiiisins.com          → LAN, via Traefik (Phase 8c.5)
#   - hugin.xiiisins.com                  → WAN, via Cloudflared+Traefik
# Rendered space-separated by the template into a single
# `server_name` directive; first match wins.
zabbix_web_server_names:
  - hugin-direct.niflheim.xiiisins.com
  - hugin.midgard.xiiisins.com
  - hugin.xiiisins.com
zabbix_web_listen_port: 80
zabbix_php_timezone: "Europe/Amsterdam" # local timezone

# Frontend display name — shown in the top-left of the Zabbix web UI
# + in the browser tab title. Cosmetic; pick whatever identifies the
# instance. Matches the Proxmox cluster name (niflheim) by default.
zabbix_frontend_server_name: "hugin"

# Admin user — Zabbix creates a default `Admin` user during schema
# load (with password `zabbix`). This role does NOT auto-rotate to
# the Vault-stored value — the operator logs in once with the factory
# default and changes via UI to the value at this Vault path, which
# keeps the IaC-tracked value and reality in sync. API-driven auto-
# rotation is the 8c.7 plan; until then the path serves as the
# canonical post-rotation value.
#
# If Admin gets locked out (5 failed attempts), unlock via:
#   UPDATE users SET attempt_failed=0, attempt_clock=0, attempt_ip=''
#   WHERE username='Admin';
# from a workstation psql session against the Patroni VIP. See the
# Phase 8c.2 incident retro.
zabbix_admin_user: Admin
zabbix_admin_password_vault_path: "ansible/zabbix/admin-password"
zabbix_admin_password_vault_field: value # TF-minted secrets store under `value` field

# Whether to bootstrap the DB schema on first run. Default true —
# the task is idempotent (skips if schema is already loaded). Set
# false on a re-run if you're certain schema is loaded and want
# to skip the slow grep-check.
zabbix_bootstrap_schema: true

# ============================================================================
# Hermod (notifications hub) integration — Phase 5h.2.i
# ============================================================================
# Declarative Zabbix → Hermod webhook. Maps Zabbix trigger severity to
# Apprise tag (Hermod's routing key) and event_value to Apprise type
# (Discord embed colour). Severity → tag mapping is in the JS template
# (templates/hermod-webhook.js) — must stay in sync with the table in
# docs/services/notifications.md "Source-side severity mapping".
#
# Set hermod_enabled: false to skip the media-type + user-media wiring
# (useful for staging environments without Hermod, or if migrating
# notification providers).
zabbix_hermod_enabled: true

# Hermod endpoint. URL path includes the soft-auth config-key resolved
# from Vault at task time — see hermod-mediatype.yml. Hostname is the
# AGH rewrite for the Hermod LXC.
zabbix_hermod_host: hermod.niflheim.xiiisins.com
zabbix_hermod_scheme: http
zabbix_hermod_config_key_vault_path: "ansible/hermod/config-key"
zabbix_hermod_config_key_vault_field: value

# Webhook timeout — Zabbix media-type default is 30s. Hermod's
# Discord delivery is sub-second steady-state; bump only if Discord
# rate-limits cluster of bursts.
zabbix_hermod_webhook_timeout: "10s"

# Media type name + user attachment. Attached to the Admin user (in
# Zabbix administrators group), which the default trigger action
# already targets — so the wiring is end-to-end without touching the
# Action config itself.
zabbix_hermod_mediatype_name: Hermod
zabbix_hermod_attach_to_user: Admin
# Vestigial — for webhook media types, sendto is free-text since the
# real URL lives in webhook_params. Keep it semantic.
zabbix_hermod_user_media_sendto: hermod

# ============================================================================
# SAML authentication — Phase 8c.3-8c.6 (Authentik native SAML 2.0)
# ============================================================================
# Native SAML, NOT Traefik ForwardAuth — Zabbix 7.0 has built-in SAML
# and the K3s-down emergency observability rationale rules out making
# the auth path K3s-dependent (Authentik IS in K3s, but the local-
# Admin backdoor at hugin-direct.niflheim.xiiisins.com survives K3s
# outages independently). Full design + decision rows: docs/services/
# zabbix.md "Why native SAML over Traefik ForwardAuth".
#
# Two-source Vault config:
#   * ansible/zabbix/saml-sp-keypair  — operator-minted ONCE via
#     openssl, fields `key` + `cert`. Zabbix signs AuthnRequests with
#     the private key; Authentik verifies via the public cert that TF
#     registers on the IdP side (terraform/authentik/zabbix.tf reads
#     the cert from this same Vault path). Long-lived (10y self-
#     signed); rotation is operator-driven.
#   * ansible/zabbix/saml-idp         — TF-minted by
#     terraform/authentik/zabbix.tf outputs, fields `entity_id`,
#     `sso_url`, `slo_url`, `signing_cert`. Re-rendered on every TF
#     apply that changes the SAML provider config.
#
# Flip to false to skip the entire SAML pass (useful for staging
# environments, or to validate the backdoor still works after major
# changes). The file-level $SSO[...] block in zabbix.conf.php.j2 keys
# off this same flag.
zabbix_saml_enabled: true

# Vault paths (consumer-domain prefix `ansible/` since the Ansible
# role is the consumer; the IdP-info path is the TF→Vault hand-off
# pattern used by Tailscale / Hermod / etc.).
zabbix_saml_sp_keypair_vault_path: "ansible/zabbix/saml-sp-keypair"
zabbix_saml_idp_vault_path: "ansible/zabbix/saml-idp"

# Cert storage on the LXC. Zabbix's $SSO settings expect PEMs at a
# known path; the frontend's PHP-FPM worker (group www-data) reads
# them on every SAML handshake.
zabbix_saml_cert_dir: /usr/share/zabbix/conf/certs
zabbix_saml_sp_key_path: "{{ zabbix_saml_cert_dir }}/sp.key"
zabbix_saml_sp_cert_path: "{{ zabbix_saml_cert_dir }}/sp.crt"
zabbix_saml_idp_cert_path: "{{ zabbix_saml_cert_dir }}/idp.crt"

# SP entityID — the audience claim the IdP asserts in the SAML
# Response. Must match the `audience` field on the
# authentik_provider_saml resource exactly (string-equal). Using the
# apex hostname keeps a single canonical SP identity across the multi-
# FQDN setup; the actual hostname the user typed (midgard vs apex) is
# carried separately via the ACS URL match.
zabbix_saml_sp_entity_id: "https://hugin.xiiisins.com"

# User directory display name. Surfaced in the Zabbix UI under
# Users → Authentication → User directories. Cosmetic; pick whatever
# distinguishes the entry if more directories land later (LDAP, etc.).
zabbix_saml_userdirectory_name: "Authentik SAML"

# Group → usergroup JIT provisioning mapping. Each entry binds an
# Authentik group name (as it appears in the SAML `groups` attribute)
# to a Zabbix role + usergroup(s). Day-1 mapping is single-entry:
# zabbix-admins (Authentik) → Zabbix administrators (built-in
# usergroup) with Super admin role. Add zabbix-viewers + a Viewer
# role mapping when read-only access becomes a real need.
zabbix_saml_provision_groups:
  - name: "zabbix-admins"
    role: "Super admin role"
    user_groups:
      - "Zabbix administrators"

# SAML attribute names — must match what Authentik puts in the
# assertion (driven by the property mappings on the SAML provider).
#
# Authentik's default property mappings (attached in terraform/authentik/
# zabbix.tf) emit these saml_name attributes:
#   email   → http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
#   name    → http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name
#   upn     → http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn
#   groups  → http://schemas.xmlsoap.org/claims/Group
#
# Verify with the property-mappings API:
#   curl https://authentik.midgard.xiiisins.com/api/v3/propertymappings/provider/saml/?managed=goauthentik.io%2Fproviders%2Fsaml%2Fupn \
#     -H "Authorization: Bearer $AUTHENTIK_TOKEN" | jq '.results[].saml_name'
#
# UPN's Authentik expression is `request.user.attributes.get('upn', request.user.email)`
# — returns the user's UPN attribute if set, else falls back to email.
# For homelab users without a distinct UPN, this gives stable
# email-rooted Zabbix usernames consistent with the NameID = email
# config in terraform/authentik/zabbix.tf.
zabbix_saml_username_attribute: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/upn"
zabbix_saml_groups_attribute: "http://schemas.xmlsoap.org/claims/Group"
