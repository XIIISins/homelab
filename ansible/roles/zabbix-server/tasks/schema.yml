# ansible/roles/zabbix-server/tasks/schema.yml
---
# Zabbix server schema bootstrap. Loaded from /usr/share/zabbix-sql-
# scripts/postgresql/server.sql.gz against the (already-existing)
# `zabbix` DB. The DB + user are created by the postgres-common role
# on the Patroni leader (see postgres_databases entry in
# group_vars/postgres.yml).
#
# Idempotency: check for the existence of the `users` table (one of
# the first tables created by the schema). If present, schema is
# loaded — skip the slow load.
#
# zabbix_db_password is resolved by vault-lookup.yml (imported first
# in main.yml).

- name: Check whether zabbix schema is already loaded
  ansible.builtin.command:
    cmd: >-
      psql "host={{ zabbix_db_host }} port={{ zabbix_db_port }}
           dbname={{ zabbix_db_name }} user={{ zabbix_db_user }}
           sslmode={{ zabbix_db_sslmode }}"
      -tAc "SELECT to_regclass('public.users');"
  environment:
    PGPASSWORD: "{{ zabbix_db_password }}"
  register: zabbix_schema_check
  changed_when: false
  no_log: true
  check_mode: false  # read-only SELECT probe; must run in --check or zabbix_schema_loaded misfires

- name: Set schema-loaded fact
  ansible.builtin.set_fact:
    zabbix_schema_loaded: "{{ zabbix_schema_check.stdout | trim == 'users' }}"

- name: Load zabbix schema (first deploy)
  # pipefail required — zcat | psql without it swallows psql errors
  # (shell's default behavior is to return the LAST command's rc, so
  # a malformed SQL file silently "succeeds" if zcat itself worked).
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz |
      psql -v ON_ERROR_STOP=1
           "host={{ zabbix_db_host }} port={{ zabbix_db_port }}
           dbname={{ zabbix_db_name }} user={{ zabbix_db_user }}
           sslmode={{ zabbix_db_sslmode }}"
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ zabbix_db_password }}"
  when: not zabbix_schema_loaded
  no_log: true
  register: zabbix_schema_load
  changed_when: zabbix_schema_load.rc == 0
