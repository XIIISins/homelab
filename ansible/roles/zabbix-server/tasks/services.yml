# ansible/roles/zabbix-server/tasks/services.yml
---
- name: Flush pending handlers
  ansible.builtin.meta: flush_handlers

- name: Enable + start zabbix-server, nginx, php-fpm, zabbix-agent2
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - zabbix-server
    - nginx
    - "{{ zabbix_php_fpm_service }}" # pinned via zabbix_php_version (see defaults/main.yml)
    - zabbix-agent2
