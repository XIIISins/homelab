# ansible/roles/zabbix-server/tasks/web-config.yml
---
# Debian's nginx ships /etc/nginx/sites-enabled/default — a server
# block marked `default_server` on port 80 serving the welcome page.
# zabbix-nginx-conf wires our server block via /etc/nginx/conf.d/
# but does NOT touch sites-enabled/, so for any Host header that
# doesn't match our server_name (hugin-direct.* / zabbix.midgard.* /
# zabbix.*), nginx falls through to the default_server and serves
# the welcome page. Surfaced in 7c.2 deploy — see incidents/
# 2026-05-25-zabbix-server-deploy.md. Remove unconditionally:
# state=absent is idempotent and sites-available/ is left intact,
# so re-enabling is a one-symlink revert.
- name: Disable Debian's nginx default site (welcome page)
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Render /etc/zabbix/nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/zabbix/nginx.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart nginx
  # Tagged with zabbix:saml so the X-Forwarded-Proto → HTTPS reflection
  # picks up when the SAML pass enables proxy auth (same class as the
  # zabbix.conf.php render below).
  tags: [zabbix, zabbix:web-config, zabbix:saml, zabbix:saml-nginx]

- name: Render /etc/zabbix/web/zabbix.conf.php
  ansible.builtin.template:
    src: zabbix.conf.php.j2
    dest: /etc/zabbix/web/zabbix.conf.php
    owner: www-data
    group: www-data
    mode: "0640"
  no_log: true # DB password inside
  notify: restart nginx
  # Tagged with zabbix:saml so the file-level $SSO[...] paths re-render
  # when the SAML pass toggles zabbix_saml_enabled — the certs task in
  # saml.yml depends on this file being current. Also tagged
  # zabbix:web-config for explicit invocations.
  tags: [zabbix, zabbix:web-config, zabbix:saml, zabbix:saml-conf]

- name: Set PHP timezone for the Zabbix frontend
  ansible.builtin.lineinfile:
    path: /etc/zabbix/php-fpm.conf
    regexp: '^;?php_value\[date\.timezone\]\s*='
    line: "php_value[date.timezone] = {{ zabbix_php_timezone }}"
    owner: root
    group: root
    mode: "0644"
  notify: restart php-fpm

# PHP-FPM status + ping endpoints — fed to the `PHP-FPM by Zabbix
# agent` template via nginx-proxied HTTP. The pool config sets the
# FPM-side path; nginx.conf.j2 proxies HTTP /status and /ping into
# the FastCGI socket (localhost-only via allow/deny).
- name: Enable PHP-FPM status endpoint
  ansible.builtin.lineinfile:
    path: /etc/zabbix/php-fpm.conf
    regexp: '^;?pm\.status_path\s*='
    line: "pm.status_path = /status"
    insertafter: '^\[zabbix\]'
    owner: root
    group: root
    mode: "0644"
  notify: restart php-fpm

- name: Enable PHP-FPM ping endpoint
  ansible.builtin.lineinfile:
    path: /etc/zabbix/php-fpm.conf
    regexp: '^;?ping\.path\s*='
    line: "ping.path = /ping"
    insertafter: '^\[zabbix\]'
    owner: root
    group: root
    mode: "0644"
  notify: restart php-fpm
