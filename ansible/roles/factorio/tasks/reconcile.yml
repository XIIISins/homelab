---
- name: Install factorio-reconcile script
  ansible.builtin.copy:
    src: factorio-reconcile
    dest: /usr/local/bin/factorio-reconcile
    owner: root
    group: root
    mode: "0755"

- name: Install factorio-reconcile.service
  ansible.builtin.copy:
    src: factorio-reconcile.service
    dest: /etc/systemd/system/factorio-reconcile.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Install factorio-reconcile.timer
  ansible.builtin.copy:
    src: factorio-reconcile.timer
    dest: /etc/systemd/system/factorio-reconcile.timer
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Flush handlers (apply daemon-reload before enabling timer)
  ansible.builtin.meta: flush_handlers

- name: Enable factorio-reconcile.timer
  ansible.builtin.systemd:
    name: factorio-reconcile.timer
    enabled: true
