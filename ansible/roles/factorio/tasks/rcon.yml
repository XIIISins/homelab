---
# Runs after initial-install.yml, so factorio.service is never started early
# on a fresh host (see known-issues/sftpgo-factorio.md on the .lock race).
#
# The RCON password is generated by factorio-launch at service START and the
# binary only reads it then, so a changed wrapper/shim — or an opt-in rotation —
# only takes effect after a restart.

- name: Check whether factorio.service is running
  ansible.builtin.systemd:
    name: factorio.service
  register: factorio_unit
  check_mode: false

# A fresh install already started with the new wrapper (initial-install.yml),
# and an operator-stopped server (control state=stopped) must stay stopped.
- name: Restart factorio so the launch wrapper / RCON rotation takes effect
  ansible.builtin.systemd:
    name: factorio.service
    state: restarted
  when:
    - factorio_install_check.stat.exists | default(true)
    - factorio_unit.status.ActiveState | default('') == 'active'
    - >-
      (factorio_launch_wrapper.changed | default(false))
      or (factorio_shim_build.changed | default(false))
      or (factorio_rcon_rotate_on_apply | bool)

# Fail loudly if the password is visible in the process list (e.g. a future
# static factorio build where LD_PRELOAD can't interpose). Compared inside the
# shell so the value never reaches Ansible output.
- name: Verify the RCON password is not in the factorio process arguments
  ansible.builtin.shell: |
    set -eu
    systemctl is-active --quiet factorio.service || exit 0
    pid=""
    for _ in $(seq 20); do
      pid="$(pgrep -u {{ factorio_user }} -x factorio | head -n1 || true)"
      [ -n "$pid" ] && break
      sleep 0.5
    done
    [ -n "$pid" ] || { echo "factorio.service active but no factorio process found" >&2; exit 1; }
    pw="$(cat {{ factorio_rconpw_path }})"
    [ -n "$pw" ] || exit 0   # no RCON configured (shim missing) — nothing to leak
    if tr '\0' '\n' < "/proc/$pid/cmdline" | grep -qxF -- "$pw"; then
      echo "RCON password is visible in /proc/$pid/cmdline" >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: not ansible_check_mode
