---
# argv-scrub shim: keeps the RCON password out of /proc/<pid>/cmdline.
# Built on the host so no binary lives in the (public) repo.
- name: Create shim source and library directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ factorio_argv_scrub_src | dirname }}"
    - "{{ factorio_argv_scrub_dir }}"

- name: Install argv-scrub shim source
  ansible.builtin.copy:
    src: argv-scrub.c
    dest: "{{ factorio_argv_scrub_src }}"
    owner: root
    group: root
    mode: "0644"
  register: factorio_shim_src

- name: Check whether the argv-scrub shim is built
  ansible.builtin.stat:
    path: "{{ factorio_argv_scrub_lib }}"
  register: factorio_shim_stat

- name: Build argv-scrub shim
  ansible.builtin.command:
    cmd: >-
      gcc -shared -fPIC -O2 -Wall
      -o {{ factorio_argv_scrub_lib }} {{ factorio_argv_scrub_src }} -ldl
  when: factorio_shim_src.changed or not factorio_shim_stat.stat.exists
  register: factorio_shim_build
  changed_when: true

- name: Install factorio-launch wrapper
  ansible.builtin.template:
    src: factorio-launch.j2
    dest: /usr/local/bin/factorio-launch
    owner: root
    group: root
    mode: "0755"
  register: factorio_launch_wrapper

- name: Install factorio.service
  ansible.builtin.copy:
    src: factorio.service
    dest: /etc/systemd/system/factorio.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable factorio.service (but do not start yet — bootstrap handles that)
  ansible.builtin.systemd:
    name: factorio.service
    enabled: true
