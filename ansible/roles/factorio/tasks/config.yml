---
- name: Place operator README at /factorio root
  ansible.builtin.copy:
    src: README.txt
    dest: "{{ factorio_home }}/README.txt"
    owner: "{{ factorio_user }}"
    group: "{{ factorio_group }}"
    mode: "0644"

# The RCON password itself is generated by factorio-launch on every start.
# Ansible only guarantees the file exists with the right owner/mode, because
# the factorio user can truncate-write it but cannot create files in the
# root-owned 0750 secrets dir. force: false never touches existing content.
- name: Ensure RCON password file exists (content is written by factorio-launch)
  ansible.builtin.copy:
    content: ""
    dest: "{{ factorio_rconpw_path }}"
    owner: "{{ factorio_user }}"
    group: "{{ factorio_group }}"
    mode: "0640"
    force: false

- name: Place server-settings.json (first time, or when force-overwrite)
  ansible.builtin.template:
    src: server-settings.json.j2
    dest: "{{ factorio_home }}/config/server-settings.json"
    owner: "{{ factorio_user }}"
    group: "{{ factorio_group }}"
    mode: "0664"
    force: "{{ factorio_force_overwrite_server_settings }}"

- name: Place factorio-control.json (first time only — never overwrite operator state)
  ansible.builtin.template:
    src: factorio-control.json.j2
    dest: "{{ factorio_home }}/control/factorio-control.json"
    owner: "{{ factorio_user }}"
    group: "{{ factorio_group }}"
    mode: "0664"
    force: false

- name: Place server-adminlist.json (first time only)
  ansible.builtin.template:
    src: server-adminlist.json.j2
    dest: "{{ factorio_home }}/config/server-adminlist.json"
    owner: "{{ factorio_user }}"
    group: "{{ factorio_group }}"
    mode: "0664"
    force: false
