# ansible/roles/caddy-reverse-proxy/defaults/main.yml
---
# ============================================================================
# caddy-reverse-proxy role defaults
# ============================================================================
# Installs Caddy from the pinned upstream GitHub release .deb and renders a single
# Caddyfile composed of N site blocks, one per entry in `caddy_sites`. Each
# site is independently:
#   - bound to a listener (port + optional hostname)
#   - source-IP allowlisted via Caddy's `remote_ip` matcher
#   - reverse-proxied to a single upstream
#   - logged in JSON to its own log file
#
# Genericness: caller supplies `caddy_sites` as a list-of-dicts. The role
# itself has no per-service knowledge — it's pure Caddy wiring.
#
# Built for Phase 5h.2 (Hermod, gating AppriseAPI) but reusable for any
# future LXC needing a thin reverse proxy with IP allowlisting.
# ============================================================================

# ---- Package source ----
# Caddy's Cloudsmith apt repo (dl.cloudsmith.io/public/caddy/stable) started
# answering `402 Payment Required` ("Access to the repository has been
# restricted") on 2026-10-09, which fails `apt update` on every host that
# has it configured. The role now installs the pinned .deb from the
# upstream GitHub release, verified against the sha512 published in the
# release's caddy_<ver>_checksums.txt. The .deb is only fetched when the
# installed version differs from the pin, so routine runs need no egress
# (Gna's UCG policy blocks github.com outside its deploy window).
caddy_deb_url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_amd64.deb"
caddy_deb_path: "/var/cache/caddy_{{ caddy_version }}_linux_amd64.deb"
# sha512 of the .deb for `caddy_version` (amd64 only; every caddy host is amd64).
# When bumping caddy_version, take it from the release's checksums.txt:
#   curl -sL https://github.com/caddyserver/caddy/releases/download/v<ver>/caddy_<ver>_checksums.txt | grep linux_amd64.deb
caddy_deb_sha512: "1c6f5404f3622e46d401d81f4af59677d46b886229c6694d60fd936b87c72d3bb5d1fcf42b55c8d555769fa75acf434ab618fc7e0df2c79cf8512ee580d38d06"

# ---- Package version pin ----
# Must be a published GitHub release (https://github.com/caddyserver/caddy/releases)
# and caddy_deb_sha512 must be updated with it. With the Cloudsmith repo gone,
# nothing apt-side moves the package past the pin any more.
# History: 2.11.4 since 2026-09-17 (unattended-upgrades had pulled hermod past
# the earlier pin via Cloudsmith).
caddy_version: "2.11.4"

# ---- Sites ----
# List-of-dicts. Each entry renders one Caddyfile block. Required fields:
#   name           — friendly identifier (used in log file path + comments)
#   listen         — Caddy address: ":80", ":443", "hostname:80", etc.
#   upstream       — reverse_proxy target ("127.0.0.1:8000", "10.0.x.y:NNNN")
#   allowed_cidrs  — list of CIDRs/IPs permitted (Caddy `remote_ip` matcher)
#
# Optional fields:
#   log_path       — JSON access log destination (default: /var/log/caddy/<name>.log)
#   forbidden_body — body returned on 403 (default: "forbidden")
#   extra_directives — list of raw Caddy directives appended inside the site
#                      block (e.g. headers, rewrites). Used sparingly — keep
#                      the role declarative for the common case.
#
# Empty list = no Caddyfile rendered + caddy service stays stopped (the role
# is a no-op).
caddy_sites: []

# ---- Config-change handler ----
# The rendered Caddyfile sets `admin off`, and `systemctl reload caddy`
# (`caddy reload`) talks to the admin API — so once admin is off a reload
# cannot work. `reloaded` is kept as the default so existing hosts (Hermod)
# behave exactly as before; hosts that must apply config changes reliably
# (do1) set `restarted` (a sub-second restart; certs persist on disk).
caddy_reload_method: reloaded

# ---- Log directory ----
# All site access logs live under this directory. Owned by the caddy
# system user (created by the apt package).
caddy_log_dir: "/var/log/caddy"
caddy_log_owner: "caddy"
caddy_log_group: "caddy"
caddy_log_mode: "0755"

# Log rotation — Caddy's built-in JSON file output supports size-based
# rotation. roll_size in MB, roll_keep is the count of historical files
# to retain. Cheap defaults; bump for noisy sites.
caddy_log_roll_size_mb: 10
caddy_log_roll_keep: 5
