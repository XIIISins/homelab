# ansible/roles/tailscale/defaults/main.yml
---
# Tailscale apt repo (official) — Debian 13 trixie codename.
# Reference: https://pkgs.tailscale.com/stable/debian/
tailscale_repo_codename: trixie
tailscale_repo_base: https://pkgs.tailscale.com/stable/debian
tailscale_keyring_path: /usr/share/keyrings/tailscale-archive-keyring.gpg
tailscale_sources_path: /etc/apt/sources.list.d/tailscale.list

# Vault path for the per-host authkey, under default `secret` mount.
# Auth is handled by community.hashi_vault's native env-var fallback —
# source ~/.config/ansible/vault-approle.env (via ansible-vault-env)
# before running so VAULT_ADDR + AppRole creds are in the environment.
# The proven pattern is exercised by the tailscale role itself —
# see tasks/main.yml's `community.hashi_vault.vault_kv2_get` lookup.
tailscale_authkey_vault_path: "ansible/tailscale/authkeys/{{ inventory_hostname }}"

# Per-host vars — required (override in inventory):
#   tailscale_tag                  e.g. "subnet-router" or "exit-node"
# Per-host vars — optional:
#   tailscale_advertise_routes     CSV of CIDRs, e.g. "10.0.0.0/16"
#   tailscale_advertise_exit_node  boolean
#   tailscale_ssh                  boolean — pass --ssh to `tailscale up`,
#                                  enabling Tailscale SSH (tailnet-ACL-gated
#                                  inbound SSH that bypasses the host sshd).
#                                  Backward-compatible: unset → not passed.

# Pass --reset on every `tailscale up` invocation so any flag not
# explicitly passed reverts to default. Keeps state in sync with
# inventory; makes re-runs deterministic.
tailscale_up_reset: true

# Whether to accept the tailnet's pushed DNS config (MagicDNS). Default
# true = upstream/tailscale default (no behaviour change for the existing
# tailnet LXCs, which intentionally live on MagicDNS with
# baseline_manage_resolv_conf=false).
#
# Set FALSE on LAN servers that must keep baseline-owned /etc/resolv.conf
# (AdGuard VIP direct). On a control node like Frigg this is load-bearing:
# accept-dns=true lets tailscaled overwrite resolv.conf with MagicDNS, and
# if the tailnet split-DNS path to AdGuard hiccups (observed "server
# misbehaving" after a reboot) the box can no longer resolve
# vault.niflheim.xiiisins.com → homelab-env dies → the whole IaC toolchain
# is down. accept-dns=false keeps resolution on the direct LAN AdGuard path,
# independent of tailscaled health.
tailscale_accept_dns: true
