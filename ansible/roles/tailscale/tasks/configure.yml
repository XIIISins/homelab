# ansible/roles/tailscale/tasks/configure.yml
---
# Read authkey from Vault and run `tailscale up` with role-specific
# flags. Idempotent: `tailscale up` is a no-op if state already
# matches; `changed_when` is gated on the pre-run BackendState so the
# play summary only shows "changed" when the daemon transitioned.

- name: Read Tailscale status
  ansible.builtin.command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false

- name: Determine pre-run Tailscale BackendState
  ansible.builtin.set_fact:
    ts_pre_state: "{{ (ts_status.stdout | from_json).BackendState if ts_status.rc == 0 and ts_status.stdout else 'NoState' }}"

- name: Fetch Tailscale authkey from Vault
  ansible.builtin.set_fact:
    tailscale_authkey: "{{ lookup('community.hashi_vault.vault_kv2_get', tailscale_authkey_vault_path).secret.authkey }}"
  no_log: true

- name: Bring Tailscale up
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --authkey={{ tailscale_authkey }}
      --hostname={{ inventory_hostname }}
      --advertise-tags=tag:{{ tailscale_tag }}
      {% if tailscale_advertise_routes is defined and tailscale_advertise_routes %}--advertise-routes={{ tailscale_advertise_routes }}{% endif %}
      {% if tailscale_advertise_exit_node | default(false) %}--advertise-exit-node{% endif %}
      {% if tailscale_up_reset %}--reset{% endif %}
  no_log: true
  changed_when: ts_pre_state != 'Running'
