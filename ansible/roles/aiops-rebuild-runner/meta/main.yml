# ansible/roles/aiops-rebuild-runner/meta/main.yml
---
galaxy_info:
  role_name: aiops_rebuild_runner
  author: XIIISins
  description: >
    The 10g rebuild runner on Frigg: a hardened systemd service on a unix socket that plans and applies
    allow-listed Terraform replaces from a clean main checkout, with a root credential loader on tmpfs.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions: [trixie]
  galaxy_tags: [aiops, frigg, terraform, vault]
dependencies: []
