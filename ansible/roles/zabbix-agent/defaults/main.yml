# ansible/roles/zabbix-agent/defaults/main.yml
---
# Match the server's release line. Bumping `zabbix_major` updates
# the agent's repo source; the agent itself is fully forward-compatible
# with newer servers (lagging versions OK), so this isn't strictly
# required to match — but match for tidiness.
zabbix_major: "7.0"

# Debian repo URL — path is /zabbix/<major>/debian/pool/... — NO
# `release/` segment (the .../release/debian/... variant 404s, verified
# 2026-05-25). Same correction as roles/zabbix-server's defaults; the
# two should bump in lockstep when zabbix_major moves.
zabbix_agent_repo_deb_url: "https://repo.zabbix.com/zabbix/{{ zabbix_major }}/debian/pool/main/z/zabbix-release/zabbix-release_latest_{{ zabbix_major }}+debian{{ ansible_distribution_major_version }}_all.deb"

# RHEL 9 repo URL — used on K3s VMs. Unlike Debian, the RHEL tree has
# NO `_latest_` filename — the operator picks a revision explicitly.
# Highest at the time of this write: zabbix-release-7.0-5.el9.noarch.rpm
# (2026-05-25). Bump `zabbix_agent_rhel_release_revision` when Zabbix
# ships a new release-pkg revision; the rest of the URL derives from
# zabbix_major + ansible_distribution_major_version.
zabbix_agent_rhel_release_revision: "5"
zabbix_agent_repo_rpm_url: "https://repo.zabbix.com/zabbix/{{ zabbix_major }}/rhel/{{ ansible_distribution_major_version }}/x86_64/zabbix-release-{{ zabbix_major }}-{{ zabbix_agent_rhel_release_revision }}.el{{ ansible_distribution_major_version }}.noarch.rpm"

# zabbix-agent2 — the Go-based replacement for the C agent. Lower
# RSS, native concurrency, better defaults. Same protocol; works
# with any Zabbix server version.
zabbix_agent_packages:
  - zabbix-agent2

# Server to push to — the Zabbix LXC at 10.0.11.21 (skuld, vmid 1102).
zabbix_agent_server: "10.0.11.21"
zabbix_agent_server_active: "10.0.11.21"
zabbix_agent_listen_port: 10050
zabbix_agent_listen_ip: "0.0.0.0" # listen on all interfaces — server reaches in via VLAN 11

# Hostname Zabbix uses to identify this agent. Defaults to inventory
# hostname (FQDN-style if inventory uses that). Override per-host
# via host_vars if needed.
zabbix_agent_hostname: "{{ inventory_hostname }}"

# HostMetadata — used by auto-registration on the server side. Lets
# the server's auto-registration action match hosts by metadata
# (e.g. tag-on `host_group` to bucket them automatically into
# "k3s workers" vs "k3s CPs" vs "LXCs").
zabbix_agent_host_metadata: "{{ inventory_hostname }}"

# TLS — currently OFF (homelab-internal traffic on VLAN 11 + 21).
# Bump to PSK or cert-based later if we expose agents over tailnet.
zabbix_agent_tls_connect: unencrypted
zabbix_agent_tls_accept: unencrypted

# Log destination
zabbix_agent_log_type: file
zabbix_agent_log_file: /var/log/zabbix/zabbix_agent2.log

# ─── API host registration ────────────────────────────────────────────
# After install + configure, the role calls Zabbix's API to ensure a
# host record exists with this agent's Hostname + Agent interface +
# the host groups / templates declared below. Idempotent on re-run
# (community.zabbix.zabbix_host handles update vs create). Runs
# delegate_to: localhost so the API HTTP call happens from the
# control node, not the target host — keeps the agent host network-
# clean and the Vault lookup natural.
#
# Bootstrap step (one-time, before the first --tags zabbix-agent:register
# run): log into Zabbix UI as Admin → top-right user icon → API tokens
# → Add → no expiry → generate → copy the token (shown ONCE) → stash:
#   vault kv put secret/ansible/zabbix/api-token value=<the-token>
# The terraform/vault/main.tf resource has lifecycle.ignore_changes
# on data_json so this manual put won't be clobbered.
zabbix_agent_register_host: true
zabbix_agent_api_url: "http://zabbix-direct.niflheim.xiiisins.com"
zabbix_agent_api_token_vault_path: "ansible/zabbix/api-token"
zabbix_agent_api_token_vault_field: value

# IP Zabbix server uses to reach this agent (passive checks). Default
# is the host's primary v4 address from facts — works for single-homed
# hosts. Override per host_vars for multi-homed cases where the agent
# should answer on a non-default interface (e.g. K3s workers' eth1
# isn't where Zabbix should knock — leave eth0).
zabbix_agent_register_ip: "{{ ansible_default_ipv4.address }}"

# Host groups + templates the host should belong to. Defaults are the
# stock Zabbix-shipped values. Override per inventory group via
# group_vars/<group>.yml (e.g. group_vars/asgard_k3s_workers.yml
# could set zabbix_agent_host_groups: ["K3s workers", "Linux servers"]
# once those groups exist on the server side). The API call fails if
# any named group/template doesn't already exist — the role does NOT
# auto-create them; that's a separate server-side concern (7c.7-proper).
zabbix_agent_host_groups:
  - "Linux servers"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
