# ansible/roles/zabbix-agent/tasks/main.yml
---
# OS routing — the agent runs on every inventory host. LXCs + Proxmox
# are Debian-family; the K3s VMs are RHEL 9. Pattern mirrors the
# vlagent role's os_family split.

- name: Install zabbix-agent2 (Debian)
  ansible.builtin.import_tasks: install-debian.yml
  when: ansible_os_family == 'Debian'
  tags: [zabbix-agent, zabbix-agent:install]

- name: Install zabbix-agent2 (RHEL)
  ansible.builtin.import_tasks: install-rhel.yml
  when: ansible_os_family == 'RedHat'
  tags: [zabbix-agent, zabbix-agent:install]

- name: Render config + start
  ansible.builtin.import_tasks: configure.yml
  tags: [zabbix-agent, zabbix-agent:configure]
