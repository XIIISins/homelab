# ansible/roles/zabbix-agent/tasks/main.yml
---
# OS routing — the agent runs on every inventory host. LXCs + Proxmox
# are Debian-family; the K3s VMs are RHEL 9. Pattern mirrors the
# vlagent role's os_family split.

- name: Install zabbix-agent2 (Debian)
  ansible.builtin.import_tasks: install-debian.yml
  when: ansible_os_family == 'Debian'
  tags: [zabbix-agent, zabbix-agent:install]

- name: Install zabbix-agent2 (RHEL)
  ansible.builtin.import_tasks: install-rhel.yml
  when: ansible_os_family == 'RedHat'
  tags: [zabbix-agent, zabbix-agent:install]

- name: Render config + start
  ansible.builtin.import_tasks: configure.yml
  tags: [zabbix-agent, zabbix-agent:configure]

- name: Register host in Zabbix server (declarative, via API)
  ansible.builtin.import_tasks: register-host.yml
  when:
    - zabbix_agent_register_host
    # Skip under --check: community.zabbix's httpapi connection + check_mode
    # path is unreliable, and host registration is mutating remote (Zabbix)
    # state — not in-scope for drift-check, which targets managed state on
    # the local host. Missing-host drift is already visible in Zabbix's UI
    # via the agent's own heartbeat. Same pattern as postgres-common.
    - not ansible_check_mode
  tags: [zabbix-agent, zabbix-agent:register]
