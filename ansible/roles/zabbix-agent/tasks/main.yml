# ansible/roles/zabbix-agent/tasks/main.yml
---
- name: Check if zabbix-release is already installed
  ansible.builtin.command: dpkg-query -W -f='${Version}' zabbix-release
  register: zabbix_release_installed
  changed_when: false
  failed_when: false

- name: Download zabbix-release package
  ansible.builtin.get_url:
    url: "{{ zabbix_agent_repo_deb_url }}"
    dest: "/tmp/zabbix-release.deb"
    mode: "0644"
  when: zabbix_release_installed.rc != 0

- name: Install zabbix-release package
  ansible.builtin.apt:
    deb: "/tmp/zabbix-release.deb"
    state: present
  when: zabbix_release_installed.rc != 0
  notify: apt update

- name: Flush handlers (apt update before installing agent packages)
  ansible.builtin.meta: flush_handlers

- name: Install zabbix-agent2
  ansible.builtin.apt:
    name: "{{ zabbix_agent_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Render /etc/zabbix/zabbix_agent2.conf
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: zabbix
    mode: "0640"
  notify: restart zabbix-agent2

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable + start zabbix-agent2
  ansible.builtin.systemd:
    name: zabbix-agent2
    enabled: true
    state: started
