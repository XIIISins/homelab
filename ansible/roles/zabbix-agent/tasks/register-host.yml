# ansible/roles/zabbix-agent/tasks/register-host.yml
---
# Declarative host registration: ensure the Zabbix server has a host
# record for this agent, with the right agent interface + host groups
# + linked templates. Idempotent — community.zabbix.zabbix_host
# handles create-vs-update.
#
# community.zabbix 4.x REQUIRES the httpapi connection plugin — env
# vars (ZABBIX_API_URL / ZABBIX_API_TOKEN) are 1.x/2.x legacy that
# 4.x rejects with `socket_path must be a value`. The pattern is:
# delegate_to a host that represents the Zabbix server (we use the
# existing `hugin` inventory entry), then override `ansible_connection`
# to httpapi at task scope with the auth + endpoint vars. The module
# then makes API calls to the delegated host's `ansible_host` IP.
#
# become: false on the delegated tasks is required — without it, the
# play-level `become: true` (from zabbix-agents.yml) is inherited
# even on the localhost set_fact delegation, triggering a sudo prompt
# on the operator workstation. no_log: true on these tasks hides any
# error from the playbook output, so a stuck sudo prompt presents
# as "every host fails with zero diagnostic info" — drop no_log
# temporarily + run a standalone playbook to see the real error.

- name: Look up Zabbix API token from Vault
  ansible.builtin.set_fact:
    zabbix_agent_api_token: >-
      {{ lookup('community.hashi_vault.vault_kv2_get',
                zabbix_agent_api_token_vault_path).secret[zabbix_agent_api_token_vault_field] }}
  no_log: true
  run_once: true
  delegate_to: localhost
  become: false

- name: Register host in Zabbix (create or update)
  community.zabbix.zabbix_host:
    host_name: "{{ zabbix_agent_hostname }}"
    host_groups: "{{ zabbix_agent_host_groups }}"
    link_templates: "{{ zabbix_agent_link_templates }}"
    interfaces:
      - type: agent
        main: 1
        useip: 1
        ip: "{{ zabbix_agent_register_ip }}"
        dns: "{{ zabbix_agent_hostname }}"
        port: "{{ zabbix_agent_listen_port }}"
    state: present
  delegate_to: "{{ zabbix_agent_api_delegate }}"
  become: false
  vars:
    ansible_connection: httpapi
    ansible_network_os: community.zabbix.zabbix
    ansible_httpapi_port: "{{ zabbix_agent_api_port }}"
    ansible_httpapi_use_ssl: "{{ zabbix_agent_api_use_ssl }}"
    ansible_httpapi_validate_certs: false
    ansible_user: "{{ zabbix_agent_api_user }}"
    ansible_zabbix_auth_key: "{{ zabbix_agent_api_token }}"
    ansible_zabbix_url_path: ""
  no_log: true # token in vars
