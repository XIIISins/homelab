# ansible/roles/control-node/handlers/main.yml
---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart claude-remote-control
  ansible.builtin.systemd:
    name: "{{ control_node_claude_service_name }}"
    state: restarted
    daemon_reload: true
  # Only meaningful once the token EnvironmentFile exists; a restart without
  # it would just crash-loop. The enable/start gating lives in claude.yml;
  # this handler runs on config change, guarded the same way.
  when: control_node_claude_env_stat.stat.exists | default(false)

- name: restart frigg-reauth-listener
  ansible.builtin.systemd:
    name: "{{ control_node_reauth_service_name }}"
    state: restarted
    daemon_reload: true

# Re-read the networkd drop-in and re-apply the link so resolved drops the
# old servers at once (no reboot), then flush answers cached from them.
- name: reload networkd
  ansible.builtin.command: networkctl reload
  changed_when: true
  listen: reconfigure link dns

- name: reconfigure the link
  ansible.builtin.command: "networkctl reconfigure {{ control_node_dns_interface }}"
  changed_when: true
  listen: reconfigure link dns

- name: flush resolved caches
  ansible.builtin.command: resolvectl flush-caches
  changed_when: true
  listen: reconfigure link dns
