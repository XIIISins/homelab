# ansible/roles/postgres-common/defaults/main.yml
---
# Common PG object provisioning — management roles + per-service databases.
# Consumed by both standalone-PG and Patroni-managed deploys (see role
# README for the invocation patterns).

# ---- Patroni-mode gating ----
# When true, main.yml gates users.yml + databases.yml on `patroni_is_leader`
# so only the current leader performs writes. The fact is set by the
# patroni role's service.yml.
# When false (default), the gate falls through and tasks run unconditionally
# (standalone single-node case).
postgres_patroni_managed: false

# ---- Management PG roles ----
# admin/ansible: SUPERUSER for hand-on-keyboard ops + automation.
# replicator: REPLICATION-only, used by Patroni for streaming replication
# and pg_basebackup. Created on the adoption-time primary pre-Patroni so
# replicas can authenticate when Patroni clones the cluster.
postgres_management_users:
  - name: admin
    vault_path: ansible/postgres/admin-password
    role_attr_flags: SUPERUSER,LOGIN
    description: "Network-accessible superuser for hand-on-keyboard operations"
  - name: ansible
    vault_path: ansible/postgres/ansible-password
    role_attr_flags: SUPERUSER,LOGIN
    description: "Playbook + AWX automation user; also Patroni superuser + rewind user"
  - name: replicator
    vault_path: ansible/postgres/replicator-password
    role_attr_flags: REPLICATION,LOGIN
    description: "Patroni-internal streaming replication + pg_basebackup user"
  - name: zbx_monitor
    vault_path: ansible/postgres/zabbix-monitor-password
    role_attr_flags: LOGIN
    groups: [pg_monitor] # PG predefined role — SELECT on pg_stat_*, pg_ls_*, pg_show_replication_origin_status etc.
    description: "Zabbix PG monitoring user (read-only; pg_monitor membership)"

# ---- Per-service DBs ----
# Set in inventory/group_vars/postgres.yml. Each entry:
#   { name, owner, password_vault_path }
postgres_databases: []
