# ansible/roles/postgres-common/tasks/users.yml
---
# Create management PG roles via Unix socket peer auth. Works for both
# standalone PG (Debian-managed service) and Patroni-managed PG (Patroni
# preserves /var/run/postgresql via postgresql.parameters.unix_socket_directories).
#
# Each entry's `role_attr_flags` is passed verbatim (e.g. SUPERUSER,LOGIN
# or REPLICATION,LOGIN). Vault lookup runs on the control node via the
# ansible-local AppRole. Password rotation in Vault → re-run → ALTER USER fires.

- name: Create management PG roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path).secret.value }}"
    role_attr_flags: "{{ item.role_attr_flags }}"
    state: present
    login_unix_socket: /var/run/postgresql
    encrypted: true
  become: true
  become_user: postgres
  loop: "{{ postgres_management_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# Predefined-role grants (e.g. pg_monitor → zbx_monitor). Separate
# module — community.postgresql.postgresql_user doesn't have a
# `groups` arg; postgresql_membership is the canonical way to grant
# PG role membership. Subelements iterates (user, group) pairs, with
# skip_missing letting users that don't declare `groups` pass through
# unchanged.
- name: Grant predefined-role memberships
  community.postgresql.postgresql_membership:
    source_role: "{{ item.1 }}"
    target_roles: "{{ item.0.name }}"
    state: present
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  loop: "{{ postgres_management_users | subelements('groups', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} → {{ item.1 }}"
