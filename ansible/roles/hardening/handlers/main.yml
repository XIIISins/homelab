---
# ansible/roles/hardening/handlers/main.yml

- name: restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

# Re-run the reapply oneshot when its unit changes so the hardened sysctls
# are re-asserted immediately (not just at next boot).
- name: reload niflheim-sysctl-reapply
  ansible.builtin.systemd:
    name: niflheim-sysctl-reapply.service
    state: restarted
    daemon_reload: true
