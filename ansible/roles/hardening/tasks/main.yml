---
# OS-independent system hardening.
#
# Dispatches OS-family-specific MAC tasks (SELinux on RHEL, AppArmor on
# Debian) to redhat.yml or debian.yml, then performs common hardening
# (SSH config, sysctl, modprobe blocklist, banner).
#
# LXC awareness: kernel-level operations (modprobe, MAC enforcement) are
# largely no-ops inside an unprivileged LXC — the host enforces these.
# Tasks remain in place for the bare-metal / KVM-VM case.

- name: Run RedHat-family hardening tasks
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Run Debian-family hardening tasks
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == "Debian"

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: "hardening role does not support ansible_os_family={{ ansible_os_family }}"
  when: ansible_os_family not in ["RedHat", "Debian"]

# ----- OS-independent hardening -----

- name: Harden SSH configuration
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    mode: "0600"
    owner: root
    group: root
    validate: sshd -t -f %s
  notify: restart sshd

- name: Disable unused filesystems
  # Reduce attack surface — these filesystems are rarely needed.
  # No-op inside unprivileged LXC (host owns the kernel module loader)
  # but harmless; the file is created but ignored.
  ansible.builtin.copy:
    dest: /etc/modprobe.d/disable-filesystems.conf
    content: |
      install cramfs /bin/true
      install freevxfs /bin/true
      install jffs2 /bin/true
      install hfs /bin/true
      install hfsplus /bin/true
      install squashfs /bin/true
      install udf /bin/true
    mode: "0644"

- name: Set secure kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: "{{ hardening_sysctl_file }}"
    sysctl_set: true
    reload: true
  loop:
    # Disable ICMP redirects
    - { name: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { name: "net.ipv4.conf.default.accept_redirects", value: "0" }
    # Disable source routing
    - { name: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { name: "net.ipv4.conf.default.accept_source_route", value: "0" }
    # Log suspicious packets
    - { name: "net.ipv4.conf.all.log_martians", value: "1" }

# LXC reboot-persistence: inside a container the netns + veth are
# re-initialised at every start, and interface bring-up resets
# net.ipv4.conf.{all,default}.accept_redirects (->1) and .all.log_martians
# (->0) AFTER systemd-sysctl has applied the on-disk values. A oneshot
# ordered After=network-online.target re-applies our drop-in once the
# interface is up, so the hardened values stick. VMs/bare-metal don't hit
# this race (sysctl ordering works there) — gate to LXC to avoid adding a
# needless unit. See docs/known-issues/lxc-proxmox.md.
- name: Install sysctl reboot-persistence oneshot (LXC)
  ansible.builtin.template:
    src: niflheim-sysctl-reapply.service.j2
    dest: /etc/systemd/system/niflheim-sysctl-reapply.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_virtualization_type == 'lxc'
  notify: reload niflheim-sysctl-reapply

- name: Enable + start sysctl reboot-persistence oneshot (LXC)
  ansible.builtin.systemd:
    name: niflheim-sysctl-reapply.service
    enabled: true
    state: started
    daemon_reload: true
  # not ansible_check_mode: in a check-mode drift run before the first real
  # apply, the unit file doesn't exist yet (the template task above doesn't
  # write in check mode), and systemd enable/start would error "unit not
  # found". File-drift is still detected by the template task; service
  # enablement is enforced on every real apply.
  when:
    - ansible_virtualization_type == 'lxc'
    - not ansible_check_mode

- name: Configure login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: |
      ******************************************************************
      * This system is part of the niflheim homelab cluster.           *
      * Unauthorized access is prohibited.                             *
      * All activity is logged and monitored.                          *
      ******************************************************************
    mode: "0644"
