---
# ansible/roles/hardening/defaults/main.yml

# SSH hardening
ssh_port: 22
ssh_permit_root_login: "prohibit-password"
ssh_password_authentication: "no"
ssh_pubkey_authentication: "yes"

# Extra (non-default) interactive users permitted by sshd AllowUsers,
# beyond the always-present `ansible` runtime user + the break-glass
# `{{ breakglass_user }}` (recovery). Backward-compatible: empty on every
# existing host, so the rendered AllowUsers line is unchanged. The
# control-node (Frigg) sets this to ["ghost"] so the operator can SSH in
# to drive Claude. See group_vars/control.yml.
ssh_extra_allow_users: []

# SELinux
selinux_state: enforcing
selinux_policy: targeted

# Hardened sysctls are written to a dedicated drop-in (not /etc/sysctl.conf)
# so the LXC reboot-persistence oneshot can re-apply ONLY these net.* keys —
# all settable inside the container netns, so `sysctl -p <file>` reliably
# exits 0 and never becomes a failed-service drift signal of its own.
# See docs/known-issues/lxc-proxmox.md (sysctl reboot persistence).
hardening_sysctl_file: /etc/sysctl.d/60-niflheim-hardening.conf
