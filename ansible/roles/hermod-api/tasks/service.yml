# ansible/roles/hermod-api/tasks/service.yml
---
# systemd unit that wraps `docker compose up`. Survives reboots, pulls
# image on start, restarts container on crash.

- name: Render apprise.service
  ansible.builtin.template:
    src: apprise.service.j2
    dest: /etc/systemd/system/apprise.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Flush handlers (reload systemd before enable+start)
  ansible.builtin.meta: flush_handlers

- name: Enable + start apprise.service
  ansible.builtin.systemd:
    name: apprise.service
    enabled: true
    state: started
