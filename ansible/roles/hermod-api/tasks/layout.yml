# ansible/roles/hermod-api/tasks/layout.yml
---
# System user + directory layout for the AppriseAPI stack.

- name: Create apprise group
  ansible.builtin.group:
    name: "{{ hermod_api_user }}"
    gid: "{{ hermod_api_gid }}"
    state: present

- name: Create apprise user
  ansible.builtin.user:
    name: "{{ hermod_api_user }}"
    uid: "{{ hermod_api_uid }}"
    group: "{{ hermod_api_user }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create config + data + compose directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ hermod_api_user }}"
    group: "{{ hermod_api_user }}"
    mode: "0750"
  loop:
    - "{{ hermod_api_config_dir }}"
    - "{{ hermod_api_data_dir }}"
    - "{{ hermod_api_compose_dir }}"
