# ansible/roles/hermod-api/tasks/docker.yml
---
# Docker engine + compose-plugin from Docker's official Debian repo.
# Native apt repo (NOT the legacy docker.io package) — compose-plugin
# is a Debian package alongside the engine, no separate install.

- name: Ensure prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Docker apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker apt repo signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Write Docker apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: |
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable
    owner: root
    group: root
    mode: "0644"
  notify: apt update

- name: Flush handlers (apt update before package install)
  ansible.builtin.meta: flush_handlers

- name: Install Docker engine + compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable + start Docker engine
  ansible.builtin.systemd:
    name: docker.service
    enabled: true
    state: started
