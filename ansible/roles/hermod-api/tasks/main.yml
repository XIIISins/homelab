# ansible/roles/hermod-api/tasks/main.yml
---
- name: Install Docker engine + compose plugin
  ansible.builtin.import_tasks: docker.yml
  tags: [hermod-api, hermod-api:docker]

- name: Layout + system user
  ansible.builtin.import_tasks: layout.yml
  tags: [hermod-api, hermod-api:layout]

- name: Render Apprise config + compose stack
  ansible.builtin.import_tasks: config.yml
  tags: [hermod-api, hermod-api:config]

- name: Bring up the Apprise stack
  ansible.builtin.import_tasks: service.yml
  tags: [hermod-api, hermod-api:service]
