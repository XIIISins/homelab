# ansible/roles/hermod-api/tasks/config.yml
---
# Render the compose file (stable, just describes the apprise container)
# and the Apprise config file (sources Discord webhook id/token from Vault).
# Both notify the systemd unit to restart the stack.

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ hermod_api_compose_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: restart apprise

- name: Render Apprise config (homelab.yml — tag-driven URL routing)
  ansible.builtin.template:
    src: homelab.yml.j2
    # AppriseAPI loads config from $APPRISE_CONFIG_DIR/<config-key>/config
    # (file or dir). We use a single file named <key>; the container
    # reads $APPRISE_CONFIG_DIR/{{ hermod_api_config_key }} (file mode).
    dest: "{{ hermod_api_config_dir }}/{{ hermod_api_config_key }}"
    owner: "{{ hermod_api_user }}"
    group: "{{ hermod_api_user }}"
    mode: "0640"
  no_log: true # Discord webhook id/token in rendered content
  notify: restart apprise
