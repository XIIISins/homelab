# ansible/roles/hermod-api/defaults/main.yml
---
# Apprise API — tag-driven notification fanout.
# Upstream: https://github.com/caronc/apprise-api
# Docker image: caronc/apprise (Alpine, single uvicorn process, ~50 MB RSS)
#
# Deployment shape: docker-compose v2 stack via systemd unit. Compose file
# rendered from template; config (homelab.yml) rendered from template with
# Discord webhook URLs sourced from Vault. The single config-key `homelab`
# is the route sources POST to (`/notify/homelab`).

hermod_api_image: "caronc/apprise:1.2.1"
hermod_api_listen_port: 8000
hermod_api_data_dir: /var/lib/apprise
hermod_api_config_dir: /etc/apprise
hermod_api_compose_dir: /etc/apprise/compose
hermod_api_user: apprise
hermod_api_uid: 1500
hermod_api_gid: 1500

# Config key — the URL path component sources POST to. We use a single
# `homelab` key + tag-based routing (vs. one key per channel) so adding
# new delivery destinations doesn't require touching source-side code.
hermod_api_config_key: homelab

# Tag taxonomy + Vault paths. Each tag's URL is built from the Discord
# webhook id + token at template-render time via Vault lookup.
# Keep in lockstep with docs/services/notifications.md.
hermod_api_discord_webhooks:
  - tag: critical
    vault_path: "ansible/hermod/discord/critical"
    # Mention behaviour: @everyone for true-2am-pageable alerts.
    # Tuning happens via the Apprise URL query params (rendered in template).
    mention: "@everyone"
  - tag: alert
    vault_path: "ansible/hermod/discord/alert"
    mention: ""
  - tag: media
    vault_path: "ansible/hermod/discord/media"
    mention: ""
