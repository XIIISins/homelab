---
# Install PostgreSQL {{ postgres_version }} from the PGDG apt repository.
# Ref: https://www.postgresql.org/download/linux/debian/

- name: ensure gnupg is installed (required for apt key dearmor)
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Fetch PGDG signing key (ASCII-armored)
  ansible.builtin.get_url:
    url: "{{ postgres_apt_repo_signing_key_url }}"
    dest: /etc/apt/keyrings/postgresql.asc
    mode: "0644"
    force: false

- name: Dearmor PGDG signing key
  ansible.builtin.command:
    cmd: gpg --dearmor --batch --yes -o /etc/apt/keyrings/postgresql.gpg /etc/apt/keyrings/postgresql.asc
    creates: /etc/apt/keyrings/postgresql.gpg

- name: Configure PGDG apt repo
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] {{ postgres_apt_repo_url }} {{ ansible_distribution_release }}-pgdg {{ postgres_apt_repo_component }}"
    filename: pgdg
    state: present
    update_cache: true

# Suppress Debian's auto-cluster-creation BEFORE installing postgresql-17.
# Without this, postgresql-common's post-install hook calls `pg_createcluster
# 17 main` which initdbs an empty cluster — fine for standalone, but on a
# fresh Patroni replica it leaves a data dir with a different system_id from
# the cluster leader. Patroni then refuses to start (system_id mismatch).
# Setting create_main_cluster=false means apt just installs the binaries and
# leaves /var/lib/postgresql/17/main empty; Patroni's pg_basebackup populates
# it from the leader.
- name: Ensure /etc/postgresql-common exists (drop-in dir for postgresql-common)
  ansible.builtin.file:
    path: /etc/postgresql-common
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: postgres_patroni_managed

- name: Suppress auto-cluster creation when Patroni-managed
  ansible.builtin.copy:
    dest: /etc/postgresql-common/createcluster.conf
    content: |
      # Managed by Ansible — postgres role. Manual edits will be overwritten.
      # Patroni manages cluster lifecycle; postgresql-common must not auto-init.
      create_main_cluster = false
    owner: root
    group: root
    mode: "0644"
  when: postgres_patroni_managed

- name: Install PostgreSQL {{ postgres_version }} and Ansible module deps
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - python3-psycopg2
      - python3-cryptography
      # pgvector — needed by Immich (vector similarity search for face/CLIP
      # embeddings; Immich hard-requires either pgvector or vchord, checked
      # at server startup). PGDG-packaged, cluster-wide install (must exist
      # on every node — a replica promoted to leader without it breaks any
      # DB that CREATE EXTENSION'd it). Installed unconditionally rather
      # than gated on postgres_databases containing an `extensions` entry —
      # cheap (~1MB), avoids a second conditional package-install pass, and
      # any future extension-needing app benefits without a role change.
      - "postgresql-{{ postgres_version }}-pgvector"
    state: present
