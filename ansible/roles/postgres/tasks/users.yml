---
# Create management PG roles (admin, ansible) via Unix socket peer auth.
# Both SUPERUSER for now; tighten later if any consumer actually warrants
# least-privilege (no current consumer does).
#
# Vault lookup runs on the control node (MacBook or AWX) via the
# ansible-local AppRole. Vault credentials never touch the DB host.
# Password rotation in Vault → re-run this task → ALTER USER fires.

- name: Create management PG roles
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path).secret.value }}"
    role_attr_flags: "{{ 'SUPERUSER,LOGIN' if item.superuser else 'LOGIN' }}"
    state: present
    login_unix_socket: /var/run/postgresql
    encrypted: true
  become: true
  become_user: postgres
  loop: "{{ postgres_management_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
