---
# Self-signed TLS for in-LAN PG traffic. Cert covers hostname, FQDN, and
# eth0 IP — enough for direct connections from MacBook (admin) and K3s
# nodes (services). HAProxy VIP cert will be its own thing when it lands.
#
# Renewal is manual for now (delete server.crt, re-run role). 825-day
# lifetime gives ~2 years of slack. Future: cert-manager via ESO push.
#
# On Patroni-managed fresh replicas, /etc/postgresql/<v>/<c>/ is not created
# by pg_createcluster (we suppressed that in packages.yml) — ensure it exists
# explicitly so the cert + key have a home Patroni's config_dir can reference.

- name: Ensure PG cluster config dir + conf.d/ exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"
  loop:
    - "/etc/postgresql/{{ postgres_version }}/{{ postgres_cluster }}"
    # conf.d/ is required because Patroni's adoption preserves the
    # leader's stock Debian postgresql.conf as postgresql.base.conf,
    # which contains `include_dir = 'conf.d'`. That base.conf gets
    # synced to replicas during basebackup — and if conf.d/ doesn't
    # exist on the replica, postgres fails to start with
    # "could not open configuration directory". Empty conf.d/ is a
    # harmless no-op for the include_dir directive.
    - "/etc/postgresql/{{ postgres_version }}/{{ postgres_cluster }}/conf.d"

- name: Generate PostgreSQL TLS private key
  community.crypto.openssl_privatekey:
    path: "{{ postgres_tls_key_path }}"
    type: RSA
    size: 4096
    owner: postgres
    group: postgres
    mode: "0600"
  notify: restart postgresql

- name: Generate PostgreSQL TLS CSR
  # Skip in check_mode: openssl_privatekey is skipped (would create), so on
  # a never-deployed host the privatekey_path doesn't exist and csr errors.
  when: not ansible_check_mode
  community.crypto.openssl_csr:
    path: "/etc/postgresql/{{ postgres_version }}/{{ postgres_cluster }}/server.csr"
    privatekey_path: "{{ postgres_tls_key_path }}"
    common_name: "{{ inventory_hostname }}"
    country_name: "{{ postgres_tls_cert_country }}"
    organization_name: "{{ postgres_tls_cert_org }}"
    subject_alt_name:
      - "DNS:{{ inventory_hostname }}"
      - "DNS:{{ inventory_hostname }}.niflheim.xiiisins.com"
      - "IP:{{ ansible_default_ipv4.address }}"
    owner: postgres
    group: postgres
    mode: "0644"

- name: Generate PostgreSQL TLS certificate (self-signed)
  when: not ansible_check_mode  # paired with csr above
  community.crypto.x509_certificate:
    path: "{{ postgres_tls_cert_path }}"
    privatekey_path: "{{ postgres_tls_key_path }}"
    csr_path: "/etc/postgresql/{{ postgres_version }}/{{ postgres_cluster }}/server.csr"
    provider: selfsigned
    selfsigned_not_after: "+{{ postgres_tls_cert_days }}d"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: restart postgresql
