---
# Full standalone PG pass. Used by non-patroni-managed callers. For the
# patroni-managed path, the playbook calls `tasks_from: prepare` before the
# patroni role and `tasks_from: bootstrap` after, with the patroni role
# sandwiched between.
- name: Prepare PG (packages, cluster, TLS, config, hba)
  ansible.builtin.include_tasks: prepare.yml

- name: Bootstrap PG objects (management users, per-service DBs)
  ansible.builtin.include_tasks: bootstrap.yml
  when: not postgres_patroni_managed
