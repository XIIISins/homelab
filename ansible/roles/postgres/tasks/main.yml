---
# Server-side preparation only: packages, cluster init (standalone),
# TLS, postgresql.conf + pg_hba.conf (standalone), adoption-time
# user creation (patroni-managed). PG OBJECT provisioning (management
# roles + per-service DBs) lives in the postgres-common role —
# invoke after this role + the patroni role (if applicable) in the
# playbook. See postgres-common/README.md for invocation patterns.
- name: Prepare PG (packages, cluster, TLS, config, hba)
  ansible.builtin.include_tasks: prepare.yml
