# ansible/roles/jellyfin/tasks/install.yml
---
# curl: not in the minimal LXC template; the zabbix `jellyfin.health` item and operators use it.
- name: Install curl
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyrings directory
  ansible.builtin.file:
    path: "{{ jellyfin_apt_key_path | dirname }}"
    state: directory
    mode: "0755"

# Verified by checksum: a changed key fails the play instead of being trusted. apt accepts an ASCII-armoured key
# (.asc) in Signed-By, so no gpg dearmor step.
- name: Fetch the Jellyfin repository signing key
  ansible.builtin.get_url:
    url: "{{ jellyfin_apt_key_url }}"
    dest: "{{ jellyfin_apt_key_path }}"
    checksum: "sha256:{{ jellyfin_apt_signer_sha256 }}"
    mode: "0644"

- name: Configure the Jellyfin apt repository
  ansible.builtin.deb822_repository:
    name: jellyfin
    types: [deb]
    uris: "{{ jellyfin_apt_uri }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    architectures: [amd64]
    signed_by: "{{ jellyfin_apt_key_path }}"
    state: present
    enabled: true
  register: jellyfin_repo

# deb822_repository does not refresh the index, and the cache is usually fresh from baseline (cache_valid_time below would
# skip the update), so the new repository's packages would be "not available". Found on first provisioning 2026-10-06.
- name: Refresh the apt index when the repository was added or changed
  ansible.builtin.apt:
    update_cache: true
  when: jellyfin_repo.changed

# Before the packages, so the unit never starts against a missing mount even on the very first install.
- name: Create the unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/jellyfin.service.d
    state: directory
    mode: "0755"

- name: Make jellyfin.service wait for the media share and the cache volume
  ansible.builtin.template:
    src: jellyfin-mounts.conf.j2
    dest: /etc/systemd/system/jellyfin.service.d/10-requires-mounts.conf
    mode: "0644"
  notify:
    - Reload systemd (jellyfin)
    - Restart jellyfin

- name: Install the pinned Jellyfin packages
  ansible.builtin.apt:
    name:
      - "jellyfin-server={{ jellyfin_version }}"
      - "jellyfin-web={{ jellyfin_version }}"
      - "jellyfin-ffmpeg7={{ jellyfin_ffmpeg_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    allow_change_held_packages: true # a deliberate version bump is this task with new values
  notify: Restart jellyfin

- name: Hold the pinned packages (no unattended upgrade moves them)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - jellyfin-server
    - jellyfin-web
    - jellyfin-ffmpeg7

- name: Add the jellyfin user to the igpu, video and media groups
  ansible.builtin.user:
    name: "{{ jellyfin_user }}"
    groups: ["{{ jellyfin_gpu_group }}", video, "{{ jellyfin_media_group }}"]
    append: true
  notify: Restart jellyfin

- name: Own the cache volume and the transcode directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ jellyfin_user }}"
    group: "{{ jellyfin_user }}"
    mode: "0755"
  loop:
    - "{{ jellyfin_cache_dir }}"
    - "{{ jellyfin_transcode_dir }}"
