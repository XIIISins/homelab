# ansible/roles/jellyfin/tasks/accounts.yml
---
# The passed render node is owned by gid {{ jellyfin_gpu_gid }} inside the container (Terraform device_passthrough). Create a
# group with exactly that gid; the distro's own `render`/`kvm` groups (992/993 in the Debian 13 template) are left alone.
- name: Create the group that owns the passed-through render node
  ansible.builtin.group:
    name: "{{ jellyfin_gpu_group }}"
    gid: "{{ jellyfin_gpu_gid }}"

- name: Create the media group (files Sonarr/SABnzbd write into the share)
  ansible.builtin.group:
    name: "{{ jellyfin_media_group }}"
    gid: "{{ jellyfin_media_gid }}"
