---
# Install the pinned local .deb fetched in repo.yml. `apt: deb=` resolves
# dependencies and is idempotent — it compares the .deb's version to what's
# installed and reports ok when they match (no needless reinstall / drift).
# Skipped under --check (the .deb isn't fetched in a dry-run); the package is
# already present in steady state, real applies converge version changes.
- name: Install SFTPGo from the pinned .deb
  ansible.builtin.apt:
    deb: "{{ sftpgo_deb_dest }}"
    state: present
  register: sftpgo_apt_install
  when: not ansible_check_mode

# Only on FRESH install: the apt postinstall starts sftpgo immediately with
# default config. Stop it so the admin-create env vars in our managed config
# take effect on the bootstrap-driven (next) start. On steady-state runs the
# daemon is already running with managed config — stopping it would force
# a needless restart and report 'changed' every play (drift-check false
# positive).
- name: Stop SFTPGo to prepare for managed configuration
  ansible.builtin.systemd:
    name: sftpgo.service
    state: stopped
  when: sftpgo_apt_install is changed
  # If this fails (e.g. unit doesn't exist yet on a weird install), continue.
  failed_when: false

- name: Ensure log directory exists
  ansible.builtin.file:
    path: "{{ sftpgo_log_file_path | dirname }}"
    state: directory
    owner: sftpgo
    group: sftpgo
    mode: "0755"

- name: Ensure SFTPGo state directory exists
  ansible.builtin.file:
    path: /var/lib/sftpgo
    state: directory
    owner: sftpgo
    group: sftpgo
    mode: "0750"

- name: Ensure SFTPGo systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/sftpgo.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
