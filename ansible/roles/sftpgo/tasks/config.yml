---
- name: Ensure /etc/sftpgo exists
  ansible.builtin.file:
    path: /etc/sftpgo
    state: directory
    owner: root
    group: sftpgo
    mode: "0750"

- name: Template /etc/sftpgo/sftpgo.env
  ansible.builtin.template:
    src: sftpgo.env.j2
    dest: /etc/sftpgo/sftpgo.env
    owner: root
    group: sftpgo
    mode: "0640"
  notify: restart sftpgo
  # Don't log — the template contains the admin password.
  no_log: true

- name: Drop a systemd override to apply UMask
  ansible.builtin.template:
    src: sftpgo.service.override.j2
    dest: /etc/systemd/system/sftpgo.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart sftpgo
