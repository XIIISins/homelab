---
- name: Install APT helpers
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check if SFTPGo signing key is already installed
  ansible.builtin.stat:
    path: "{{ sftpgo_apt_keyring_path }}"
  register: sftpgo_keyring

- name: Fetch SFTPGo APT signing key
  ansible.builtin.get_url:
    url: "{{ sftpgo_apt_gpg_key_url }}"
    dest: /tmp/sftpgo.gpg.key
    mode: "0644"
    timeout: 30
  when: not sftpgo_keyring.stat.exists

- name: Dearmor SFTPGo signing key
  ansible.builtin.command:
    cmd: "gpg --dearmor -o {{ sftpgo_apt_keyring_path }} /tmp/sftpgo.gpg.key"
    creates: "{{ sftpgo_apt_keyring_path }}"
  when: not sftpgo_keyring.stat.exists

- name: Remove temporary key file
  ansible.builtin.file:
    path: /tmp/sftpgo.gpg.key
    state: absent

- name: Add SFTPGo APT source
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ sftpgo_apt_keyring_path }}] {{ sftpgo_apt_repo_url }} {{ ansible_distribution_release }} main"
    filename: sftpgo
    state: present
    update_cache: true
