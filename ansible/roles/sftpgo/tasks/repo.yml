---
# SFTPGo is installed from the pinned upstream GitHub release .deb, NOT an apt
# repo. The OSU mirror (ftp.osuosl.org/pub/sftpgo/apt) stopped publishing a
# signed InRelease for trixie, which broke `apt update` on every play touching
# this host. See defaults/main.yml + docs/known-issues/sftpgo-factorio.md.

# Remove the dead apt source (+ its keyring) so `apt update` works again. On a
# fresh build these never exist (no-op); on the migrated host this is the fix
# that unsticks every apt task. update_cache=false here — ca-certificates is a
# base package, and we must NOT run apt-get update while the broken source may
# still be on disk under --check (the file removal is simulated, not applied).
- name: Remove the dead OSU-mirror apt source + keyring
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/sftpgo.list
    - /usr/share/keyrings/sftpgo-archive-keyring.gpg

- name: Ensure CA certificates present (HTTPS to github.com)
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: false

# Download + install are skipped under --check (the repo's convention for fetch
# tasks — same as the AdGuard tarball): the deb is unavailable in a dry-run, so
# verifying it would error. The real apply caches it (get_url verifies the
# sha256 and is idempotent once cached in /var/cache) and install.yml installs.
- name: Fetch the pinned SFTPGo .deb from GitHub releases
  ansible.builtin.get_url:
    url: "{{ sftpgo_deb_url }}"
    dest: "{{ sftpgo_deb_dest }}"
    checksum: "sha256:{{ sftpgo_deb_sha256 }}"
    mode: "0644"
    owner: root
    group: root
    timeout: 60
  when: not ansible_check_mode
