---
- name: Install pwgen for password generation
  ansible.builtin.apt:
    name: pwgen
    state: present

- name: Check if generated admin password file already exists
  ansible.builtin.stat:
    path: /etc/sftpgo/admin-password.txt
  register: sftpgo_admin_pw_file

- name: Read previously-generated admin password (if any)
  ansible.builtin.slurp:
    src: /etc/sftpgo/admin-password.txt
  register: sftpgo_admin_pw_slurp
  when: sftpgo_admin_pw_file.stat.exists

- name: Generate a new admin password (if not provided and not on disk)
  ansible.builtin.command: pwgen -s 32 1
  register: sftpgo_admin_pw_gen
  changed_when: true
  when:
    - sftpgo_admin_password | length == 0
    - not sftpgo_admin_pw_file.stat.exists
    - not ansible_check_mode  # pwgen skips in check_mode; set_fact below would deref undef .stdout on fresh hosts

- name: Compute effective admin password
  ansible.builtin.set_fact:
    # `| default('')` on the pwgen branch covers fresh-host check_mode where
    # pwgen was skipped. On deployed hosts the slurp branch wins (slurp
    # supports check_mode), so the password resolves correctly and downstream
    # templates render. Empty fallback is only ever seen by check_mode on a
    # never-deployed host — fine, the template render is never written.
    sftpgo_admin_password_effective: >-
      {{
        sftpgo_admin_password
        if (sftpgo_admin_password | length > 0)
        else (
          sftpgo_admin_pw_slurp.content | b64decode | trim
          if sftpgo_admin_pw_file.stat.exists
          else (sftpgo_admin_pw_gen.stdout | default(''))
        )
      }}
  no_log: true

- name: Persist generated admin password (first run only)
  ansible.builtin.copy:
    content: "{{ sftpgo_admin_password_effective }}\n"
    dest: /etc/sftpgo/admin-password.txt
    owner: root
    group: root
    mode: "0600"
  when:
    - not sftpgo_admin_pw_file.stat.exists
    - not ansible_check_mode
  no_log: true

- name: Show admin password location (one-time, for first deploy)
  ansible.builtin.debug:
    msg: >-
      SFTPGo admin password generated. Stored at /etc/sftpgo/admin-password.txt
      (root-only). Move this into 1Password or Vault and clear the file.
  when:
    - sftpgo_admin_password | length == 0
    - not sftpgo_admin_pw_file.stat.exists
