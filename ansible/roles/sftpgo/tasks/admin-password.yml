---
# SFTPGo admin password — sourced from HashiCorp Vault
# (secret/ansible/sftpgo/admin-password). Migrated off the legacy pwgen +
# on-disk /etc/sftpgo/admin-password.txt mechanism (Wave S3, 2026-05-31). The
# existing password was PRESERVED (lifted into Vault unchanged), so SFTPGo's
# stored admin pw still matches — no API reconcile needed. The Vault lookup is
# the `sftpgo_admin_password` default (defaults/main.yml); an operator can
# still override it via -e / group_vars for a fresh bootstrap.
- name: Resolve effective SFTPGo admin password (from Vault)
  ansible.builtin.set_fact:
    sftpgo_admin_password_effective: "{{ sftpgo_admin_password }}"
  no_log: true

- name: Assert admin password resolved (non-empty)
  ansible.builtin.assert:
    that: sftpgo_admin_password_effective | length > 0
    fail_msg: >-
      SFTPGo admin password is empty — check that
      secret/ansible/sftpgo/admin-password exists in Vault and the AppRole can
      read it.
    quiet: true

# The Vault copy is now canonical; remove the legacy plaintext-on-disk file.
- name: Remove legacy on-disk admin password (now in Vault)
  ansible.builtin.file:
    path: /etc/sftpgo/admin-password.txt
    state: absent
