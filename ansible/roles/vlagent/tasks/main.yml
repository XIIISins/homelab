# ansible/roles/vlagent/tasks/main.yml
---
# apt-cache update is allowed to fail (e.g. PBS hosts the Proxmox
# Enterprise repo without a subscription → 401 on update). The
# packages we install are all base Debian (ca-certs, curl, tar,
# rsyslog) and almost certainly already present + recent. If the
# package install genuinely needs a fresh cache it'll fail at that
# step with a clear "Unable to locate package" error.
- name: Refresh apt cache (best-effort)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_os_family == 'Debian'
    - not ansible_check_mode
  failed_when: false
  register: vlagent_apt_cache
  tags: [vlagent, vlagent:packages]

- name: Install required apt packages (Debian/Proxmox)
  ansible.builtin.apt:
    name:
      - ca-certificates # HTTPS to logs.niflheim.xiiisins.com
      - curl # tarball download (get_url uses libcurl)
      - tar # extract
      - rsyslog # journald → /var/log/syslog forwarder (Debian 13 ships journald-only by default)
    state: present
    update_cache: false
  when: ansible_os_family == 'Debian'
  tags: [vlagent, vlagent:packages]

- name: Install required dnf packages (RHEL)
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - tar
      - rsyslog # already installed on RHEL by default, but be explicit
    state: present
  when: ansible_os_family == 'RedHat'
  tags: [vlagent, vlagent:packages]

- name: Enable + start rsyslog (so /var/log/syslog or /var/log/messages gets written)
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
  # Skip in check_mode: on a host where the apt install above hasn't
  # actually applied yet, the rsyslog unit doesn't exist and the
  # systemd module hard-fails ("Could not find the requested service
  # rsyslog: host"). The package-install diff above is enough drift
  # signal in check_mode.
  when: not ansible_check_mode
  tags: [vlagent, vlagent:packages]

- name: Create vlagent directory layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vlagent_user }}"
    group: "{{ vlagent_group }}"
    mode: "0750"
  loop:
    - /etc/vlagent
    - "{{ vlagent_data_dir }}"
    - "{{ vlagent_log_dir }}"
  tags: [vlagent, vlagent:dirs]

- name: Check installed vlagent version
  ansible.builtin.command: "{{ vlagent_binary }} --version"
  register: vlagent_installed_version_check
  changed_when: false
  failed_when: false
  check_mode: false # read-only probe; must run in --check or set_fact errors on undef .stdout
  tags: [vlagent, vlagent:install]

- name: Set fact for installed version
  ansible.builtin.set_fact:
    vlagent_installed_version: >-
      {{ (vlagent_installed_version_check.stdout | regex_search('v?[0-9]+\.[0-9]+\.[0-9]+'))
         | default('none', true) }}
  tags: [vlagent, vlagent:install]

- name: Download vlutils tarball
  ansible.builtin.get_url:
    url: "{{ vlagent_tarball_url }}"
    dest: "/tmp/vlutils-{{ vlagent_version }}.tar.gz"
    mode: "0644"
  when:
    - vlagent_installed_version != vlagent_version
    - not ansible_check_mode
  tags: [vlagent, vlagent:install]

- name: Extract vlagent binary to /usr/local/bin
  ansible.builtin.unarchive:
    src: "/tmp/vlutils-{{ vlagent_version }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: ["vlagent-prod"]
    owner: root
    group: root
    mode: "0755"
  when:
    - vlagent_installed_version != vlagent_version
    - not ansible_check_mode
  notify: restart vlagent
  tags: [vlagent, vlagent:install]

# Upstream tarball ships the binary as `vlagent-prod`. Symlink to the
# canonical `vlagent` name so the systemd unit + version-check task
# don't have to know about the rename.
- name: Symlink vlagent → vlagent-prod
  ansible.builtin.file:
    src: /usr/local/bin/vlagent-prod
    dest: "{{ vlagent_binary }}"
    state: link
    owner: root
    group: root
  tags: [vlagent, vlagent:install]
  when:
    - not ansible_check_mode

- name: Clean up tarball
  ansible.builtin.file:
    path: "/tmp/vlutils-{{ vlagent_version }}.tar.gz"
    state: absent
  when:
    - vlagent_installed_version != vlagent_version
    - not ansible_check_mode
  tags: [vlagent, vlagent:install]

# Note: vlagent has no YAML/file-based config — all settings go via
# CLI flags in the systemd unit's ExecStart. Per-host overrides
# happen by changing role variables, which re-render the unit.

- name: Install vlagent.service systemd unit
  ansible.builtin.template:
    src: vlagent.service.j2
    dest: /etc/systemd/system/vlagent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart vlagent
  tags: [vlagent, vlagent:service]

- name: Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: [vlagent, vlagent:service]

- name: Enable + start vlagent.service
  ansible.builtin.systemd:
    name: vlagent.service
    enabled: true
    state: started
  # Skip in check_mode: on a host where the unit file template hasn't
  # actually rendered to disk yet, the unit doesn't exist and the
  # systemd module hard-fails. Template diff above covers the drift
  # signal in check_mode.
  when: not ansible_check_mode
  tags: [vlagent, vlagent:service]
