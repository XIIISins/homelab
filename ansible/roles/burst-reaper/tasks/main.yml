---
# ansible/roles/burst-reaper/tasks/main.yml
#
# Root-owned script + oneshot service + timer. See defaults/main.yml and
# docs/procedures/burst-substrate.md ("Cost guard").

- name: Deploy burst-reaper script
  ansible.builtin.copy:
    src: burst-reaper.py
    dest: "{{ burst_reaper_script_path }}"
    owner: root
    group: root
    mode: "0750"
  tags: [burst-reaper]

- name: Render burst-reaper service unit
  ansible.builtin.template:
    src: burst-reaper.service.j2
    dest: "/etc/systemd/system/{{ burst_reaper_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd (burst-reaper)
  tags: [burst-reaper]

- name: Render burst-reaper timer unit
  ansible.builtin.template:
    src: burst-reaper.timer.j2
    dest: "/etc/systemd/system/{{ burst_reaper_unit_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd (burst-reaper)
  tags: [burst-reaper]

- name: Apply unit changes before enabling the timer
  ansible.builtin.meta: flush_handlers
  tags: [burst-reaper]

- name: Enable and start the burst-reaper timer
  ansible.builtin.systemd:
    name: "{{ burst_reaper_unit_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  tags: [burst-reaper]
