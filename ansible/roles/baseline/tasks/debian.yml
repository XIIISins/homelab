---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: not ansible_check_mode

- name: Install qemu-guest-agent (VMs only)
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  register: qemu_agent_install
  when: ansible_virtualization_type != 'lxc'

- name: Enable and start qemu-guest-agent (VMs only)
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when: ansible_virtualization_type != 'lxc'

- name: Ensure locales package is installed
  ansible.builtin.apt:
    name: locales
    state: present

- name: Ensure {{ baseline_locale }} is generated
  community.general.locale_gen:
    name: "{{ baseline_locale }}"
    state: present

# Manage /etc/locale.conf, NOT /etc/default/locale. systemd-tmpfiles ships
# `L+ /etc/default/locale - - - - ../locale.conf` (/usr/lib/tmpfiles.d/
# debian.conf), which force-recreates /etc/default/locale as a symlink to
# /etc/locale.conf at every boot. Writing a regular file there loses the
# race on every reboot (the symlink, mode 777, shows as perpetual drift).
# /etc/locale.conf is the symlink target AND the canonical systemd locale
# file (also native on RHEL), so managing it satisfies both and survives
# reboot. See docs/known-issues/lxc-proxmox.md.
- name: Set default system locale
  ansible.builtin.copy:
    dest: /etc/locale.conf
    content: "LANG={{ baseline_locale }}\n"
    mode: "0644"

- name: Reboot after qemu-guest-agent installation
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: "Rebooting after qemu-guest-agent installation"
  when:
    - ansible_virtualization_type != 'lxc'
    - qemu_agent_install.changed | default(false)
# Package upgrades live in the `os-updates` role + `os-updates.yml`
# playbook (Semaphore-scheduled). Baseline stays pure config-idempotency.
