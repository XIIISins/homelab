---
- name: Run RedHat-family baseline tasks
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Run Debian-family baseline tasks
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == "Debian"

- name: Fail on unsupported OS family
  ansible.builtin.fail:
    msg: "baseline role does not support ansible_os_family={{ ansible_os_family }}"
  when: ansible_os_family not in ["RedHat", "Debian"]

# Minimal Debian images don't include sudo or acl by default. RHEL ships
# both in @core. package: state=present is a no-op when already installed.
- name: Ensure baseline packages are installed
  ansible.builtin.package:
    name:
      - sudo
      - acl
      - tzdata
      - gnupg
      - ca-certificates
    state: present

- name: Set system timezone
  community.general.timezone:
    name: "{{ baseline_timezone }}"

- name: Disable cloud-init resolv.conf management
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-niflheim-resolv-conf.cfg
    content: |
      # Managed by Ansible — niflheim baseline
      manage_resolv_conf: false
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family in ["RedHat"]

- name: Template /etc/resolv.conf
  ansible.builtin.template:
    src: resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
  when: baseline_manage_resolv_conf | bool

# ----- Ansible runtime user (OS-independent) -----

- name: Create ansible runtime user
  ansible.builtin.user:
    name: "{{ ansible_user_name }}"
    shell: /bin/bash
    create_home: true
    password: "*"
    state: present

- name: Add ansible user SSH key
  ansible.posix.authorized_key:
    user: "{{ ansible_user_name }}"
    key: "{{ ansible_user_ssh_public_key }}"
    path: "/home/{{ ansible_user_name }}/.ssh/authorized_keys"
    manage_dir: true
    state: present
  when: ansible_user_ssh_public_key | length > 0

- name: Add ansible user to sudoers (NOPASSWD)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ ansible_user_name }}"
    content: "{{ ansible_user_name }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# ----- Break-glass user (OS-independent) -----

- name: Create break-glass user
  ansible.builtin.user:
    name: "{{ breakglass_user }}"
    shell: /bin/bash
    create_home: true
    password: "*"
    state: present

- name: Add break-glass SSH key
  ansible.posix.authorized_key:
    user: "{{ breakglass_user }}"
    key: "{{ breakglass_ssh_public_key }}"
    path: "/home/{{ breakglass_user }}/.ssh/authorized_keys"
    manage_dir: true
    state: present
  when: breakglass_ssh_public_key | length > 0

- name: Add break-glass user to sudoers (NOPASSWD)
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ breakglass_user }}"
    content: "{{ breakglass_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s

# ----- SSH host key integrity assertion (OS-independent) -----
# A hard crash mid-write can leave a host key file zero-byte: ext4's journal
# restores inode metadata but not page-cache data, so the file exists with an
# old mtime and zero length. sshd keeps serving from in-memory keys until its
# next restart, then dies "no hostkeys available -- exiting" — surfacing days
# later when context is lost. Assert integrity here (read-only find + assert,
# runs fleet-wide in every converge) so a truncated key fails the NEXT play
# instead of the next reboot. See CLAUDE.md "Hostkey files can be left
# zero-byte after hard crash mid-write".
- name: Find SSH host private keys
  ansible.builtin.find:
    paths: /etc/ssh
    patterns: "ssh_host_*_key"
    file_type: file
  register: baseline_ssh_hostkeys

- name: Assert at least one SSH host key is present
  ansible.builtin.assert:
    that: baseline_ssh_hostkeys.matched | int > 0
    fail_msg: >-
      No SSH host private keys found in /etc/ssh — sshd cannot start.
      Recovery: ssh-keygen -A && systemctl restart sshd.
    success_msg: "{{ baseline_ssh_hostkeys.matched }} SSH host key(s) present."

- name: Assert no SSH host key is zero-byte
  ansible.builtin.assert:
    that: item.size | int > 0
    fail_msg: >-
      SSH host key {{ item.path }} is zero-byte — likely truncated by a hard
      crash. Recovery: rm the empty key file(s), ssh-keygen -A (skips existing),
      systemctl restart sshd; then ssh-keygen -R on control nodes.
  loop: "{{ baseline_ssh_hostkeys.files }}"
  loop_control:
    label: "{{ item.path }}"
