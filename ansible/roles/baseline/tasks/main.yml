---
- name: Register RHEL subscription
  community.general.redhat_subscription:
    state: present
    activationkey: "{{ rhel_activation_key }}"
    org_id: "{{ rhel_org_id }}"

- name: Install qemu-guest-agent
  ansible.builtin.dnf:
    name: qemu-guest-agent
    state: present
  register: qemu_agent_install

- name: Enable and start qemu-guest-agent
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started

- name: Reboot after qemu-guest-agent installation
  ansible.builtin.reboot:
    reboot_timeout: 300
    msg: "Rebooting after qemu-guest-agent installation"
  when: qemu_agent_install.changed

- name: Update all packages
  ansible.builtin.dnf:
    name: "*"
    state: latest
  notify: reboot

- name: Create break-glass user
  ansible.builtin.user:
    name: "{{ breakglass_user }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Add break-glass SSH key
  ansible.posix.authorized_key:
    user: "{{ breakglass_user }}"
    key: "{{ breakglass_ssh_public_key }}"
    state: present

- name: Add break-glass user to sudoers
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ breakglass_user }}"
    content: "{{ breakglass_user }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: visudo -cf %s
