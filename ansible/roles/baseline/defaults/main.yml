---
# Break-glass / recovery user
breakglass_user: recovery
breakglass_ssh_public_key: "" # set in vault.yml

# Ansible runtime user
ansible_user_name: ansible
ansible_user_ssh_public_key: "" # set in vault.yml

# RHEL subscription
rhel_subscription_username: ""
rhel_subscription_password: ""

# System timezone. Override per-host or per-group only if a node needs a
# different one (none currently do — all hardware is colocated in NL).
baseline_timezone: Europe/Amsterdam
baseline_locale: en_US.UTF-8

# Apt source/keyring files to delete BEFORE the apt cache update. A dead
# third-party repo fails the whole `apt update` and so the whole baseline.
# Caddy's Cloudsmith repo answers 402 (2026-10-09); Caddy is now installed
# from a pinned GitHub release .deb by the caddy-reverse-proxy role.
baseline_retired_apt_files:
  - /etc/apt/sources.list.d/caddy-stable.list
  - /usr/share/keyrings/caddy-stable-archive-keyring.gpg

# DNS resolution — owned by Ansible, cloud-init disabled.
# List order is the resolver order in /etc/resolv.conf (primary first,
# fallback after). Don't reorder casually — AdGuard VIP direct must be the
# primary, the UCG gateway only catches the case where the VIP itself is
# unreachable from this host.
baseline_nameservers:
  - 10.0.10.200 # primary — AdGuard VIP direct (keepalived across Saga/Mimir/Kvasir)
  - 10.0.254.1  # fallback — UCG gateway (forwards to AdGuard VIP)
baseline_dns_search:
  - niflheim.xiiisins.com

# Set to false on hosts whose /etc/resolv.conf is owned by another component
# (e.g. tailscaled with MagicDNS on the tailscale LXCs — overwriting it breaks
# resolution, so we accept the drift). Cloud-init's manage_resolv_conf flag is
# still flipped off — only the template task is gated.
baseline_manage_resolv_conf: true

# Install + enable qemu-guest-agent on VMs (Proxmox guests). Set false on
# non-Proxmox hosts with no guest-agent channel (the DigitalOcean droplet do1),
# where it would only add a package + a reboot for nothing.
baseline_install_qemu_agent: true
