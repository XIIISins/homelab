---
# Break-glass / recovery user
breakglass_user: recovery
breakglass_ssh_public_key: "" # set in vault.yml

# Ansible runtime user
ansible_user_name: ansible
ansible_user_ssh_public_key: "" # set in vault.yml

# RHEL subscription
rhel_subscription_username: ""
rhel_subscription_password: ""

# System timezone. Override per-host or per-group only if a node needs a
# different one (none currently do — all hardware is colocated in NL).
baseline_timezone: Europe/Amsterdam
baseline_locale: en_US.UTF-8
