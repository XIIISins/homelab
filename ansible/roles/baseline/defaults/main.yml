---
# Break-glass / recovery user
breakglass_user: recovery
breakglass_ssh_public_key: "" # set in vault.yml

# Ansible runtime user
ansible_user_name: ansible
ansible_user_ssh_public_key: "" # set in vault.yml

# RHEL subscription
rhel_subscription_username: ""
rhel_subscription_password: ""

# System timezone. Override per-host or per-group only if a node needs a
# different one (none currently do — all hardware is colocated in NL).
baseline_timezone: Europe/Amsterdam
baseline_locale: en_US.UTF-8

# DNS resolution — owned by Ansible, cloud-init disabled
baseline_nameservers:
  - 10.0.254.1 # UCG, forwards to AdGuard VIP
baseline_dns_search:
  - niflheim.xiiisins.com

# Set to false on hosts whose /etc/resolv.conf is owned by another component
# (e.g. tailscaled with MagicDNS on the tailscale LXCs — overwriting it breaks
# resolution, so we accept the drift). Cloud-init's manage_resolv_conf flag is
# still flipped off — only the template task is gated.
baseline_manage_resolv_conf: true
