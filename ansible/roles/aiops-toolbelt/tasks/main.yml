---
# ansible/roles/aiops-toolbelt/tasks/main.yml
#
# Installs the Toolbelt API from the repo's aiops/ tree. No secret passes through Ansible:
# the root loader fetches the bearer token on the host, from Vault, at every start.

# ---- Phase 10e preflight: the approver token and the operator id must exist before approvals are enabled ----------
- name: Read the approver token and the operator id from Vault (empty when absent)
  ansible.builtin.set_fact:
    aiops_toolbelt_pre_approver: >-
      {{ ((lookup('community.hashi_vault.vault_kv2_get', aiops_toolbelt_approver_token_vault_path | regex_replace('^secret/data/', ''), errors='ignore') | default({}, true)).get('secret', {})).get('value', '') }}
    aiops_toolbelt_pre_operator: >-
      {{ ((lookup('community.hashi_vault.vault_kv2_get', aiops_toolbelt_operators_vault_path | regex_replace('^secret/data/', ''), errors='ignore') | default({}, true)).get('secret', {})).get(aiops_toolbelt_operators_field, '') }}
  no_log: true
  when: aiops_toolbelt_actions_enabled
  tags: [aiops-toolbelt, aiops-toolbelt:preflight]

- name: Assert the approver secrets exist (the API must never run with approvals on and no approver or operator)
  ansible.builtin.assert:
    that:
      - aiops_toolbelt_pre_approver | length >= 32
      - aiops_toolbelt_pre_approver is match('^[A-Za-z0-9]+$')
      - aiops_toolbelt_pre_operator is match('^[0-9]{17,20}(,[0-9]{17,20})*$')
    fail_msg: >-
      Missing or malformed approver secret. Terraform mints {{ aiops_toolbelt_approver_token_vault_path }} (terraform/vault,
      apply from the main checkout); the operator seeds {{ aiops_toolbelt_operators_vault_path }} field
      {{ aiops_toolbelt_operators_field }} with scripts/secrets/seed-discord-bot. To run the Toolbelt WITHOUT approvals
      for now, set aiops_toolbelt_actions_enabled: false. See docs/procedures/aiops-actions.md.
    quiet: true
  when: aiops_toolbelt_actions_enabled
  tags: [aiops-toolbelt, aiops-toolbelt:preflight]

- name: Read the author tokens from Vault (empty when absent)
  ansible.builtin.set_fact:
    aiops_toolbelt_pre_author: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', aiops_toolbelt_author_token_vault_path | regex_replace('^secret/data/', ''), errors='ignore') | default({}, true)).get('secret', {}).get('value', '') }}
    aiops_toolbelt_pre_author_tools: >-
      {{ (lookup('community.hashi_vault.vault_kv2_get', aiops_toolbelt_author_tools_token_vault_path | regex_replace('^secret/data/', ''), errors='ignore') | default({}, true)).get('secret', {}).get('value', '') }}
  no_log: true
  when: aiops_toolbelt_actions_enabled and aiops_toolbelt_change_requests_enabled
  tags: [aiops-toolbelt, aiops-toolbelt:preflight]

- name: Assert the author tokens exist (the loader would otherwise fail the Toolbelt's start)
  ansible.builtin.assert:
    that:
      - aiops_toolbelt_pre_author | length >= 32
      - aiops_toolbelt_pre_author_tools | length >= 32
    fail_msg: >-
      Missing author token. Terraform mints {{ aiops_toolbelt_author_token_vault_path }} and
      {{ aiops_toolbelt_author_tools_token_vault_path }} (terraform/vault/author.tf, apply from the main checkout first). To run the
      Toolbelt without change requests for now, set aiops_toolbelt_change_requests_enabled: false.
    quiet: true
  when: aiops_toolbelt_actions_enabled and aiops_toolbelt_change_requests_enabled
  tags: [aiops-toolbelt, aiops-toolbelt:preflight]

- name: Install the runtime dependency (PyYAML for the routing table)
  ansible.builtin.apt:
    name: [python3, python3-yaml, tzdata, git]
    state: present
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Create the service user (no shell, no home)
  ansible.builtin.user:
    name: "{{ aiops_toolbelt_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Create the code directories, root-owned so the service cannot modify its own code
  ansible.builtin.file:
    path: "{{ aiops_toolbelt_home }}/aiops/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: ["", toolbelt, tools, replays, author]
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the API code and data from the repo
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../aiops/{{ item }}"
    dest: "{{ aiops_toolbelt_home }}/aiops/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ aiops_toolbelt_source_files }}"
  notify: [Restart aiops-toolbelt, Restart aiops-author]  # the dispatcher runs this same code (author/*.py, author-classes.yml): a stale process kept old behaviour after a deploy (2026-10-04)
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the acceptance replay scenarios (read per request, no restart needed)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../aiops/replays/"
    dest: "{{ aiops_toolbelt_replay_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Deploy the token loader
  ansible.builtin.copy:
    src: aiops-toolbelt-token-load.py
    dest: "{{ aiops_toolbelt_loader_path }}"
    owner: root
    group: root
    mode: "0750"
  notify: Restart aiops-toolbelt
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Deploy the repo clone refresh script
  ansible.builtin.copy:
    src: aiops-toolbelt-repo-sync.sh
    dest: "{{ aiops_toolbelt_repo_sync_path }}"
    owner: root
    group: root
    mode: "0755"
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the repo refresh service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ aiops_toolbelt_repo_unit_name }}.{{ item.kind }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: aiops-toolbelt-repo.service.j2, kind: service}
    - {src: aiops-toolbelt-repo.timer.j2, kind: timer}
  register: aiops_toolbelt_repo_units
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the placement sync service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ aiops_toolbelt_placement_unit_name }}.{{ item.kind }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: aiops-toolbelt-placement.service.j2, kind: service}
    - {src: aiops-toolbelt-placement.timer.j2, kind: timer}
  register: aiops_toolbelt_placement_units
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the forecasting shadow service and timer
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ aiops_toolbelt_forecast_unit_name }}.{{ item.kind }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - {src: aiops-toolbelt-forecast.service.j2, kind: service}
    - {src: aiops-toolbelt-forecast.timer.j2, kind: timer}
  register: aiops_toolbelt_forecast_units
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the GitHub read proxy unit (10h2 PR canary tests)
  ansible.builtin.template:
    src: aiops-toolbelt-ghread.service.j2
    dest: "/etc/systemd/system/{{ aiops_toolbelt_ghread_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: aiops_toolbelt_ghread_unit
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the token loader unit
  ansible.builtin.template:
    src: aiops-toolbelt-token.service.j2
    dest: "/etc/systemd/system/{{ aiops_toolbelt_token_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart aiops-toolbelt
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Install the unit
  ansible.builtin.template:
    src: aiops-toolbelt.service.j2
    dest: "/etc/systemd/system/{{ aiops_toolbelt_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart aiops-toolbelt
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Reload systemd when the repo or placement units changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: aiops_toolbelt_repo_units is changed or aiops_toolbelt_placement_units is changed or aiops_toolbelt_forecast_units is changed or aiops_toolbelt_ghread_unit is changed
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Flush handlers so changed code/unit is live before the checks
  ansible.builtin.meta: flush_handlers
  tags: [aiops-toolbelt, aiops-toolbelt:install]

- name: Enable the repo refresh timer
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_repo_unit_name }}.timer"
    enabled: true
    state: started
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Enable the placement sync timer
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_placement_unit_name }}.timer"
    enabled: true
    state: started
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Enable and (re)start the GitHub read proxy
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_ghread_unit_name }}.service"
    enabled: "{{ aiops_toolbelt_change_requests_enabled | bool }}"
    state: "{{ ('restarted' if aiops_toolbelt_ghread_unit is changed else 'started') if aiops_toolbelt_change_requests_enabled | bool else 'stopped' }}"
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Enable (or stop) the forecasting shadow timer
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_forecast_unit_name }}.timer"
    enabled: "{{ aiops_toolbelt_forecast_enabled }}"
    state: "{{ 'started' if aiops_toolbelt_forecast_enabled else 'stopped' }}"
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Is there a placement map yet?
  ansible.builtin.stat:
    path: "{{ aiops_toolbelt_placement_file }}"
  register: aiops_toolbelt_placement_map
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Build the placement map once now (the timer would wait three minutes); a failure is not fatal
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_placement_unit_name }}.service"
    state: started
  failed_when: false
  when: not ansible_check_mode and not aiops_toolbelt_placement_map.stat.exists
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Make sure the clone exists before the API starts (first run)
  ansible.builtin.stat:
    path: "{{ aiops_toolbelt_repo_dir }}/.git"
  register: aiops_toolbelt_clone
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: First clone now (the timer would wait two minutes)
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_repo_unit_name }}.service"
    state: started
  when: not aiops_toolbelt_clone.stat.exists and not ansible_check_mode
  tags: [aiops-toolbelt, aiops-toolbelt:service]

- name: Enable and start the API
  ansible.builtin.systemd:
    name: "{{ aiops_toolbelt_unit_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  tags: [aiops-toolbelt, aiops-toolbelt:service]

# Verification. Unauthenticated probes only: they prove the listener is up and refuses
# an anonymous caller, without ever reading the token.
- name: Liveness (no auth route)
  ansible.builtin.uri:
    url: "http://{{ aiops_toolbelt_listen_host }}:{{ aiops_toolbelt_listen_port }}/healthz"
    status_code: 200
  register: aiops_toolbelt_health
  retries: 10
  delay: 3
  until: aiops_toolbelt_health.status == 200
  when: not ansible_check_mode
  tags: [aiops-toolbelt, aiops-toolbelt:verify]

- name: An anonymous caller is refused (not served, not an error page)
  ansible.builtin.uri:
    url: "http://{{ aiops_toolbelt_listen_host }}:{{ aiops_toolbelt_listen_port }}/stats"
    status_code: 403
  when: not ansible_check_mode
  tags: [aiops-toolbelt, aiops-toolbelt:verify]
