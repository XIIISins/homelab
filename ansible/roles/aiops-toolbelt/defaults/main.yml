---
# ansible/roles/aiops-toolbelt/defaults/main.yml
#
# The Toolbelt API (Phase 10d2) on Frigg: the AIOps agent's only door into the homelab.
# Code lives in the repo (aiops/toolbelt/); this role installs it, a hardened unit, and a
# root loader that puts the n8n -> API bearer token on tmpfs. Design: docs/operations/
# 10d-diagnosis-chatops.md ("The trust boundary"). Gotchas: docs/known-issues/n8n-aiops.md.

aiops_toolbelt_user: aiops-toolbelt
aiops_toolbelt_home: /opt/aiops-toolbelt
aiops_toolbelt_unit_name: aiops-toolbelt
aiops_toolbelt_token_unit_name: aiops-toolbelt-token

# Listener: Frigg's VLAN 11 address, same VLAN as Gna (no firewall hop to open).
aiops_toolbelt_listen_host: "{{ ansible_host }}"
aiops_toolbelt_listen_port: 8090
# Callers. Enforced twice: by the app (server.py --allow) and by the unit's
# IPAddressAllow/Deny (no packet from anywhere else reaches the process).
aiops_toolbelt_allow:
  - 10.0.11.221/32 # Gna (n8n AIOps agent)
aiops_toolbelt_daily_run_cap: 40
# Outbound: the `reach.tcp` tool opens bounded TCP connections to the homelab (a substitute for
# SSH). Everything else this process talks to is a caller above. Narrow this per tool as the
# read-only backends land (each gets its own address); it never includes the internet.
aiops_toolbelt_egress_allow:
  - 10.0.0.0/8
# Recorded tool responses for acceptance replays (X-AIOPS-Replay), under the code directory.
# Read-only shallow clone of the (public) repo for the repo-history tools, refreshed by a timer
# unit of its own (the API unit has no route to GitHub).
aiops_toolbelt_repo_url: https://github.com/XIIISins/homelab.git
aiops_toolbelt_repo_dir: /var/lib/aiops-toolbelt/repo
aiops_toolbelt_repo_refresh: 10min
aiops_toolbelt_repo_sync_path: /usr/local/sbin/aiops-toolbelt-repo-sync
aiops_toolbelt_repo_unit_name: aiops-toolbelt-repo
# Read-only backend credentials the root loader copies from Vault to <creds dir>/<name>.json
# (0400, service user). OPTIONAL at start: a credential that is not minted yet only logs a
# warning and its tool answers 501. name -> KV v2 API path.
aiops_toolbelt_creds_dir: "/run/{{ aiops_toolbelt_runtime_dir_name }}/creds"
aiops_toolbelt_credentials:
  pve: secret/data/ansible/aiops/pve-token # terraform/proxmox/aiops-access
  zabbix: secret/data/ansible/aiops/zabbix-token # roles/zabbix-server tasks/aiops-token.yml (explicit tag)
  netbox: secret/data/ansible/aiops/netbox-token # aiops/tools/mint_netbox_ro.py (view-only user + token)
# Hypervisor placement (guest -> node) so a burst of alerts groups by shared hypervisor. Built from NetBox by a timer
# unit of its own, hot-reloaded by the API; the previous map is kept if NetBox is down or answers implausibly little.
aiops_toolbelt_placement_file: /var/lib/aiops-toolbelt/placement.json
aiops_toolbelt_placement_refresh: 15min
aiops_toolbelt_placement_min_guests: 10
aiops_toolbelt_placement_unit_name: aiops-toolbelt-placement
aiops_toolbelt_replay_dir: "{{ aiops_toolbelt_home }}/aiops/replays"

# Token: minted by terraform/vault (random_password.toolbelt_token), read by the root loader.
aiops_toolbelt_vault_addr: "https://vault.niflheim.xiiisins.com"
aiops_toolbelt_approle_env_path: "{{ control_node_approle_env_path | default('/etc/frigg/vault-approle.env') }}"
aiops_toolbelt_token_vault_path: secret/data/ansible/aiops/toolbelt-token # KV v2 API path
aiops_toolbelt_token_field: value
aiops_toolbelt_loader_path: /usr/local/sbin/aiops-toolbelt-token-load
aiops_toolbelt_runtime_dir_name: aiops-toolbelt
aiops_toolbelt_token_file: "/run/{{ aiops_toolbelt_runtime_dir_name }}/token"

# Files copied from the repo (the same layout the code expects: it finds routing and
# runbooks relative to itself). Paths are relative to the repo's aiops/ directory.
aiops_toolbelt_source_files:
  - toolbelt/__init__.py
  - toolbelt/core.py
  - toolbelt/server.py
  - toolbelt/tools.py
  - toolbelt/diagnosis.py
  - toolbelt/placement_sync.py
  - tools/normalize.py
  - tools/zabbix_event.py
  - alert-routing.yml
  - runbooks.yml
  - actions.yml
