---
# ansible/roles/k3s/defaults/main.yml

# K3s version — pin to a specific version. Desired version: a bump here does NOTHING on a running
# cluster (install is skipped on healthy nodes) — run playbooks/k3s-upgrade.yml (one minor per run).
# playbooks/platform-version-drift.yml reports drift between this and what is running.
k3s_version: "v1.36.4+k3s1"

# Cluster token — used to join nodes to the cluster
# Set this in group_vars/all.vault.yml
k3s_token: ""

# Network CIDRs — don't change these after cluster is created
k3s_pod_cidr: "10.42.0.0/16"
k3s_service_cidr: "10.43.0.0/16"

# CNI — we disable K3s built-in Flannel and install Calico separately
k3s_flannel_backend: "none"

# Calico version — desired version. Changed on a live cluster ONLY via playbooks/calico-upgrade.yml
# (one minor per run, with datastore backup + CRD-prune guard); the install path below is first-install only.
calico_version: "v3.32.2"

# kubeconfig location on MacBook
kubeconfig_local_path: "~/.kube/niflheim-asgard.yaml"

# First control plane node — cluster is initialised here first
k3s_init_node: "gondul"

# Off-homelab etcd snapshots (K3s native etcd-s3-*), CPs only. Bucket + IAM user come from
# terraform/aws/backups.tf; the key pair is read from Vault at play time (never in git/TF state).
# Retention is NOT set here: K3s keeps its default 5 snapshots/node locally and prunes S3 to match;
# the bucket's versioning + lifecycle keeps the pruned ones for ~14 days (see docs/procedures/offsite-backups.md).
k3s_etcd_s3_enabled: true
k3s_etcd_s3_endpoint: "s3.eu-west-1.amazonaws.com"
k3s_etcd_s3_region: "eu-west-1"
k3s_etcd_s3_bucket: "xiiisins-homelab-backups"
k3s_etcd_s3_folder: "etcd"
k3s_etcd_s3_vault_path: "ansible/backups/etcd-s3" # fields: access_key_id, secret_access_key
