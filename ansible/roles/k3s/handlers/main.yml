---
# ansible/roles/k3s/handlers/main.yml

- name: restart k3s
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
  when: inventory_hostname in groups['asgard_k3s_cp']

- name: restart k3s-agent
  ansible.builtin.systemd:
    name: k3s
    state: restarted
    daemon_reload: true
  when: inventory_hostname in groups['asgard_k3s_workers']

- name: reload vlan20 policy routing
  ansible.builtin.systemd:
    name: vlan20-policy-routing.service
    state: restarted
    daemon_reload: true
  when: "'asgard_k3s_workers' in group_names"
