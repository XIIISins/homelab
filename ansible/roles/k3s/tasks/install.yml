---
# ansible/roles/k3s/tasks/install.yml

# Phase 3: Install and configure K3s
#
# K3s cluster bootstrap order is important:
#   1. First control plane node (gondul) initialises the cluster with --cluster-init
#   2. Other control plane nodes join the existing cluster
#   3. Worker nodes join last
#
# This ordering is enforced by the serial/when conditions below

- name: Create K3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Download K3s binary
  ansible.builtin.get_url:
    url: "https://github.com/rancher/k3s/releases/download/{{ k3s_version }}/k3s"
    dest: /usr/local/bin/k3s
    mode: "0755"
    owner: root
    group: root

- name: Template K3s config for first control plane node
  # --cluster-init tells K3s to initialise a new etcd cluster
  # --flannel-backend=none disables built-in Flannel so we can use Calico
  # --disable-network-policy disables K3s built-in network policy (Calico handles this)
  # --disable traefik disables built-in Traefik (we deploy our own)
  # --disable servicelb disables built-in load balancer (we use MetalLB)
  ansible.builtin.template:
    src: config-init.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  when: inventory_hostname == k3s_init_node
  notify: restart k3s

- name: Template K3s config for additional control plane nodes
  ansible.builtin.template:
    src: config-server.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  when:
    - inventory_hostname in groups['asgard_k3s_cp']
    - inventory_hostname != k3s_init_node
  notify: restart k3s

- name: Template K3s config for worker nodes
  ansible.builtin.template:
    src: config-agent.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0644"
  when: inventory_hostname in groups['asgard_k3s_workers']
  notify: restart k3s

- name: Template K3s systemd service file
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: "0644"
  notify: restart k3s

- name: Start K3s on first control plane node
  # Start gondul first and wait for it to be ready before proceeding
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname == k3s_init_node

- name: Wait for K3s API to be ready on first control plane node
  ansible.builtin.wait_for:
    host: "{{ hostvars[k3s_init_node]['ansible_host'] }}"
    port: 6443
    timeout: 120
  when: inventory_hostname == k3s_init_node

- name: Fetch cluster token from first control plane node
  # The token is generated by K3s on first boot and needed for other nodes to join
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token
  delegate_to: "{{ k3s_init_node }}"
  run_once: true

- name: Set token fact
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_node_token['content'] | b64decode | trim }}"
  run_once: true

- name: Start K3s on additional control plane nodes
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true
  when:
    - inventory_hostname in groups['asgard_k3s_cp']
    - inventory_hostname != k3s_init_node

- name: Wait for all control plane nodes to join
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes
  register: k3s_nodes
  until: k3s_nodes.rc == 0
  retries: 20
  delay: 10
  changed_when: false
  delegate_to: "{{ k3s_init_node }}"
  run_once: true

- name: Start K3s on worker nodes
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true
  when: inventory_hostname in groups['asgard_k3s_workers']

- name: Wait for all worker nodes to join
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s kubectl get nodes
  register: k3s_all_nodes
  until: k3s_all_nodes.stdout_lines | length == 7
  retries: 20
  delay: 10
  changed_when: false
  delegate_to: "{{ k3s_init_node }}"
  run_once: true

- name: Fetch kubeconfig from first control plane node
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ kubeconfig_local_path }}"
    flat: true
  delegate_to: "{{ k3s_init_node }}"
  run_once: true

- name: Update kubeconfig server address
  # K3s writes 127.0.0.1 in the kubeconfig — update to actual IP
  ansible.builtin.replace:
    path: "{{ kubeconfig_local_path }}"
    regexp: "https://127.0.0.1:6443"
    replace: "https://{{ hostvars[k3s_init_node]['ansible_host'] }}:6443"
  delegate_to: localhost
  run_once: true
  become: false
