# ansible/roles/offsite-node/tasks/main.yml
---
# ---- Unattended security upgrades, fixed reboot window ----
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present
  tags: [offsite-node, offsite-node:updates]

- name: Enable periodic unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"
  tags: [offsite-node, offsite-node:updates]

- name: Confine unattended reboots to a fixed window
  ansible.builtin.template:
    src: 50unattended-upgrades-do1.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-do1
    owner: root
    group: root
    mode: "0644"
  tags: [offsite-node, offsite-node:updates]

# ---- Layout ----
- name: Create /opt/do1 layout
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ offsite_root }}", mode: "0750" }
    - { path: "{{ offsite_root }}/ts3-data", mode: "0750", owner: "{{ offsite_ts3_uid }}", group: "{{ offsite_ts3_uid }}" }
  loop_control:
    label: "{{ item.path }}"
  tags: [offsite-node, offsite-node:layout]

# ---- PlantNet proxy image: pulled from GHCR (built by HeyLeaf CI) ----
# The old on-host build context is no longer used; remove it so a stale
# source tree cannot be mistaken for what is running.
- name: Assert the PlantNet image tag is pinned to a HeyLeaf commit
  ansible.builtin.assert:
    that: offsite_plantnet_tag is match('^sha-[0-9a-f]{40}$')
    fail_msg: "offsite_plantnet_tag must be sha-<full HeyLeaf commit>, got {{ offsite_plantnet_tag }}"
  tags: [offsite-node, offsite-node:plantnet]

- name: Remove the retired on-host PlantNet build context
  ansible.builtin.file:
    path: "{{ offsite_root }}/plantnet-proxy"
    state: absent
  tags: [offsite-node, offsite-node:plantnet]

# The package is private: pull with a read:packages token from Vault. The
# login stores the credential in /root/.docker/config.json (root-only), the
# same trust boundary as the compose .env holding the API key.
- name: Fetch GHCR pull credential from Vault
  ansible.builtin.set_fact:
    offsite_plantnet_ghcr: "{{ lookup('community.hashi_vault.vault_kv2_get', offsite_plantnet_ghcr_vault_path).secret }}"
  no_log: true
  when: offsite_plantnet_ghcr_vault_path | length > 0
  tags: [offsite-node, offsite-node:plantnet]

# The CLI keeps this free of a community.docker dependency (collection pin +
# Docker SDK/requests on the host); the token goes via stdin, never argv.
- name: Log in to GHCR
  ansible.builtin.command:
    cmd: docker login ghcr.io --username {{ offsite_plantnet_ghcr.username | quote }} --password-stdin
    stdin: "{{ offsite_plantnet_ghcr.token }}"
  changed_when: false
  no_log: true
  when:
    - offsite_plantnet_ghcr_vault_path | length > 0
    - not ansible_check_mode
  tags: [offsite-node, offsite-node:plantnet]

# ---- Compose project ----
- name: Fetch PlantNet API key from Vault
  ansible.builtin.set_fact:
    offsite_plantnet_api_key: "{{ lookup('community.hashi_vault.vault_kv2_get', offsite_plantnet_vault_path).secret.api_key }}"
  no_log: true
  tags: [offsite-node, offsite-node:compose]

- name: Render compose environment (API key, mode 0600)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ offsite_root }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags: [offsite-node, offsite-node:compose]

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ offsite_root }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
  register: offsite_compose_file
  tags: [offsite-node, offsite-node:compose]

- name: Pull the pinned PlantNet proxy image
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ offsite_root }} pull plantnet-proxy
  register: offsite_plantnet_pull
  changed_when: "offsite_plantnet_pull.stderr is search('Pulled|Downloaded')"
  when: not ansible_check_mode
  tags: [offsite-node, offsite-node:compose]

- name: Converge the compose stack
  ansible.builtin.command:
    cmd: docker compose --project-directory {{ offsite_root }} up -d --remove-orphans
  register: offsite_compose_up
  # `up -d` prints Created/Recreated/Started only when it acted.
  changed_when: "offsite_compose_up.stderr is search('Creat|Recreat|Start')"
  when: not ansible_check_mode
  tags: [offsite-node, offsite-node:compose]

- name: Wait for the PlantNet proxy health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ offsite_plantnet_loopback_port }}/health"
    status_code: 200
  register: offsite_plantnet_health
  retries: 12
  delay: 5
  until: offsite_plantnet_health.status == 200
  when: not ansible_check_mode
  tags: [offsite-node, offsite-node:compose]
