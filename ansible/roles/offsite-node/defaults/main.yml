# ansible/roles/offsite-node/defaults/main.yml
---
# do1 service layer: compose stack (TS3 failover + HeyLeaf PlantNet proxy) and
# the unattended-upgrade reboot window. Host layout:
#   /opt/do1/                 this role (compose project "do1")
#   /opt/do1/ts3-data/        TS3 state (SQLite DB, files) — bind mount, uid 9987
#   /opt/gatus, /etc/gatus    the 10b3 `gatus` role (own unprivileged user,
#                             systemd binary — deliberately NOT in compose)
offsite_root: /opt/do1
offsite_compose_project: do1

# ---- TeamSpeak 3 failover ----
# Same server version the homelab K3s instance runs (k8s/asgard/apps/teamspeak).
# The failover keeps its own SQLite DB (restored from the legacy droplet dump,
# docs/services/teamspeak.md "Offsite failover (do1)").
offsite_ts3_image: teamspeak:3.13.7
offsite_ts3_uid: 9987 # ts3server user inside the official image
offsite_ts3_voice_port: 9987

# ---- PlantNet proxy (HeyLeaf) ----
# Built by HeyLeaf CI (.github/workflows/plantnet-proxy-image.yml) and pushed
# to GHCR; do1 only pulls. Pin = the immutable `sha-<commit>` tag of the HeyLeaf
# commit to run. Bump deliberately (a homelab PR), then re-run
# `do1.yml --tags offsite-node`.
offsite_plantnet_image: ghcr.io/xiiisins/heyleaf-plantnet-proxy
offsite_plantnet_tag: sha-REPLACE_WITH_HEYLEAF_COMMIT
# Private package: Vault KV with `username` + `token` (classic PAT, read:packages
# only). Empty string = anonymous pull (only if the package is made public).
offsite_plantnet_ghcr_vault_path: ansible/do1/ghcr
offsite_plantnet_loopback_port: 3000 # Caddy upstream; never published on a public interface
# PlantNet API key: Vault KV `api_key` field (seeded 2026-10-01).
offsite_plantnet_vault_path: ansible/do1/plantnet

# ---- Unattended upgrades (security) ----
# Reboots happen only in this window (host local time = Europe/Amsterdam via
# baseline). The 10b3 Gatus heartbeat grace period must cover it.
offsite_unattended_reboot_time: "04:30"
