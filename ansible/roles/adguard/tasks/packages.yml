# ansible/roles/adguard/tasks/packages.yml
---
- name: Install required apt packages
  ansible.builtin.apt:
    name:
      - ca-certificates # HTTPS to github.com
      - curl # tarball download
      - tar # extract
    state: present
    update_cache: true
    cache_valid_time: 3600

# AdGuardHome needs port 53 free. systemd-resolved binds it by default
# on Debian. Disable + mask to release the port.
- name: Stop + disable systemd-resolved (releases port 53)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false # OK if it wasn't installed

# /etc/resolv.conf is owned by PVE, NOT ansible. The AGH LXC's `dns {}` block
# in terraform/proxmox/asgard-lxcs/lxcs.tf (servers = 127.0.0.1 + Quad9
# 9.9.9.10 bootstrap fallback, domain niflheim.xiiisins.com) makes PVE write
# the local-resolver-plus-fallback config at every container start. Ansible
# managing it here only fought that on reboot (perpetual drift) — see
# docs/known-issues/lxc-proxmox.md. systemd-resolved is still masked above to
# free port 53; PVE writes a regular /etc/resolv.conf regardless of the
# dangling stub symlink, so no ansible task is needed.
