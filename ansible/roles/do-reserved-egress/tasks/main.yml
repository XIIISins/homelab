# ansible/roles/do-reserved-egress/tasks/main.yml
---
- name: Install reserved-IP egress script
  ansible.builtin.template:
    src: do-reserved-egress.sh.j2
    dest: /usr/local/sbin/do-reserved-egress
    owner: root
    group: root
    mode: "0750"
  tags: [do-egress]

- name: Install reserved-IP egress unit
  ansible.builtin.template:
    src: do-reserved-egress.service.j2
    dest: /etc/systemd/system/do-reserved-egress.service
    owner: root
    group: root
    mode: "0644"
  tags: [do-egress]

- name: Enable + start reserved-IP egress unit
  ansible.builtin.systemd:
    name: do-reserved-egress.service
    enabled: true
    state: started
    daemon_reload: true
  # Not in check mode: the unit file doesn't exist yet on a first dry run.
  when: not ansible_check_mode
  tags: [do-egress]

- name: Observe egress IP
  ansible.builtin.uri:
    url: "{{ do_egress_ip_probe_url }}"
    return_content: true
    timeout: 15
  register: do_egress_observed
  changed_when: false
  check_mode: false
  tags: [do-egress]

- name: Report egress IP
  ansible.builtin.debug:
    msg: "do1 egress IPv4 = {{ do_egress_observed.content | trim }} (this must be the address on the PlantNet allowlist)"
  tags: [do-egress]

- name: Assert egress IP is the reserved IP
  ansible.builtin.assert:
    that: (do_egress_observed.content | trim) == do1_reserved_ip
    fail_msg: >-
      Egress IP {{ do_egress_observed.content | trim }} != reserved IP {{ do1_reserved_ip }}.
      PlantNet would see the wrong source address. Check `ip route`, the
      do-reserved-egress unit, and that the reserved IP is assigned.
  when: do1_reserved_ip is defined and do1_reserved_ip | length > 0
  tags: [do-egress]
