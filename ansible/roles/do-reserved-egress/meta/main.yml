galaxy_info:
  role_name: do_reserved_egress
  author: XIIISins
  description: >
    Route a DigitalOcean droplet's outbound traffic via its reserved IP's
    anchor gateway (reserved IPs are inbound-only by default) and assert the
    observed egress IP.
