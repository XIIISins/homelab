---
all:
  children:
    k3s:
      children:
        k3s_cp:
          hosts:
            gondul:
              ansible_host: 10.0.21.11
            hlokk:
              ansible_host: 10.0.21.12
            sigrun:
              ansible_host: 10.0.21.13
        k3s_worker:
          hosts:
            einherjar-urd:
              ansible_host: 10.0.21.21
            einherjar-verd:
              ansible_host: 10.0.21.22
            einherjar-skuld:
              ansible_host: 10.0.21.23

    asgard_lxcs:
      children:
        gameserver:
          hosts:
            factorio:
              ansible_host: 10.0.11.220
        postgres:
          hosts:
            fulla:
              ansible_host: 10.0.11.230
            vor:
              ansible_host: 10.0.11.231
            idunn:
              ansible_host: 10.0.11.232
        haproxy_etcd:
          hosts:
            hlin:
              ansible_host: 10.0.11.233
            eir:
              ansible_host: 10.0.11.234
            snotra:
              ansible_host: 10.0.11.235
        tailscale:
          hosts:
            # Per-host tailscale_* vars live in inventory/host_vars/<host>.yml
            # (NOT inline here) so the NetBox dynamic inventory resolves them
            # too — inline hosts.yml host-vars are invisible to `-i netbox.yml`.
            bifrost:
              ansible_host: 10.0.11.213
            heimdall:
              ansible_host: 10.0.11.214
            gjallarbru:
              ansible_host: 10.0.11.215
        adguard:
          hosts:
            saga:
              ansible_host: 10.0.11.201
            mimir:
              ansible_host: 10.0.11.202
            kvasir:
              ansible_host: 10.0.11.203
        zabbix:
          hosts:
            hugin:
              ansible_host: 10.0.11.21
        apprise:
          # AppriseAPI + Caddy on Hermod (LXC 1103 on Verd, internal-only
          # VLAN 11). Group named for the software (apprise) to avoid
          # the host==group name collision Ansible warns about; the host
          # itself keeps the Norse name. Producers POST alerts gated by
          # Caddy IP allowlist + soft-auth config-key.
          hosts:
            hermod:
              ansible_host: 10.0.11.22
        pbs:
          # PBS (Proxmox Backup Server) — privileged LXC on Skuld.
          # Manual install, no ansible user — root SSH only. The
          # ansible_user=root override lives in
          # group_vars/pbs.yml so playbooks work
          # transparently without `-e ansible_user=root`.
          hosts:
            pbs:
              ansible_host: 10.0.11.20

    # Proxmox PVE hosts themselves — outside the LXC/VM layer entirely.
    # Listed for vlagent log shipping (Phase 7). Manual deploy
    # (no Terraform manages the Proxmox install itself); no ansible
    # user exists. The ansible_user=root override lives in
    # group_vars/proxmox.yml so playbooks work transparently.
    proxmox:
      hosts:
        urd:
          ansible_host: 10.0.254.11
        verd:
          ansible_host: 10.0.254.12
        skuld:
          ansible_host: 10.0.254.13

    # Control node — "Frigg", the always-on Debian 13 watchtower VM on
    # VLAN 11. Drives Terraform / Ansible / kubectl / flux and runs Claude
    # Code remote-control so the operator can drive the homelab from a
    # mobile session. control-node + tailscale (with --ssh) vars live in
    # group_vars/control.yml.
    control:
      hosts:
        frigg:
          ansible_host: 10.0.11.30
