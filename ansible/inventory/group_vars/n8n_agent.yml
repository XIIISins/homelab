# ansible/inventory/group_vars/n8n_agent.yml
---
# Gna - AIOps agent host (n8n), LXC 1121 on Urd, 10.0.11.221 (Phase 10d1).
# Plan: docs/plans/done/10d-diagnosis-chatops.md. Procedure:
# docs/procedures/aiops-diagnosis.md.

# resolv.conf is owned by PVE (the LXC `dns {}` block in terraform/proxmox/
# asgard-lxcs/lxcs.tf writes the AdGuard VIP + UCG fallback at every container
# start). Ansible stops managing it so the two don't fight on reboot. See
# docs/known-issues/lxc-proxmox.md.
baseline_manage_resolv_conf: false

# -----------------------------------------------------------------------------
# caddy-reverse-proxy: the ONLY off-host surface
# -----------------------------------------------------------------------------
# One listener, :8081, allow-listed to the alert sources that actually post to
# the agent, and restricted to /webhook/*. Everything else (the editor, the
# REST API, /healthz, /webhook-test/*) answers 404 from Caddy and never reaches
# n8n; the editor is reached with `ssh -L 5678:127.0.0.1:5678 ansible@gna`.
# Validated with `caddy validate` + a request matrix before merge.
#
# Add a CIDR here in the SAME change that cuts a source over (and add the source
# to n8n_ingest_sources + terraform/vault locals.n8n_ingest_sources):
#   Semaphore / K8s-side  10.0.21.0/24     PG trio (Patroni)  10.0.11.230-.232
#   Frigg (listener)      10.0.11.30/32    S4 prober          runs from Semaphore
caddy_sites:
  - name: gna-ingest
    listen: ":8081"
    upstream: "127.0.0.1:5678"
    allowed_cidrs:
      # Hugin (Zabbix server) - the first cut-over source
      - "10.0.11.21/32"
      # Ratatoskr (the Discord bot, LXC 1122): the chat webhook only (see the per-path rules below)
      - "10.0.11.222/32"
      # Semaphore (K3s node range, pods are SNATed to it): the drift hand-off only (Phase 10h2, see the per-path rules below)
      - "10.0.21.0/24"
    # Runs inside the allowed handle, ahead of reverse_proxy (Caddy orders
    # `respond` before `reverse_proxy`): anything that is not a production
    # webhook path is a 404, and each source may reach ONLY its own path, so a
    # leaked token is still useless from the wrong host (Hugin cannot post chat,
    # Ratatoskr cannot post alerts). Validated 2026-10-03 with Caddy 2.11 + a request matrix.
    extra_directives:
      - "@notwebhook not path /webhook/*"
      - "respond @notwebhook 404"
      - "@chat_wrong_source expression path('/webhook/aiops/chat*') && !remote_ip('10.0.11.222')"
      - "respond @chat_wrong_source 404"
      - "@zabbix_wrong_source expression path('/webhook/aiops/zabbix*') && !remote_ip('10.0.11.21')"
      - "respond @zabbix_wrong_source 404"
      - "@drift_wrong_source expression path('/webhook/aiops/drift*') && !remote_ip('10.0.21.0/24')"
      - "respond @drift_wrong_source 404"
      - "@k3s_wrong_path expression remote_ip('10.0.21.0/24') && !path('/webhook/aiops/drift*')"
      - "respond @k3s_wrong_path 404"

# -----------------------------------------------------------------------------
# vlagent: journald (n8n) + the Caddy JSON access log
# -----------------------------------------------------------------------------
# The Caddy log is the "who tried to hand the agent an alert" trail.
vlagent_log_inputs:
  - path: /var/log/syslog
    service: syslog
  - path: /var/log/caddy/gna-ingest.log
    service: caddy-gna

# Caddyfile changes must APPLY: the role's Caddyfile has `admin off`, so `systemctl reload caddy` cannot work
# (docs/known-issues/caddy.md). A sub-second restart does; certs persist on disk.
caddy_reload_method: restarted

# -----------------------------------------------------------------------------
# net-posture: does Gna's network behaviour still match the UCG egress policy and the design?
# -----------------------------------------------------------------------------
# Probed from Gna every minute (roles/net-posture), alerted by the "Gna network posture" Zabbix template
# (playbooks/files/zabbix/gna-network-posture.yml). The lists mirror the UCG policy table in
# docs/architecture/network.md ("Egress allow-list for Gna"): change one, change the other in the same PR.
net_posture_egress_allow:
  - api.anthropic.com # AIOps - Allow discord-claude: the diagnosis agent's model
  - discord.com # same policy: the #diagnoses webhook
  - deb.debian.org # Allow OS Updates
net_posture_egress_deny:
  - example.com # Egress Default Deny, by name
  - 1.1.1.1 # ... and by raw IP, so a missing DNS answer cannot pass for a block
net_posture_egress_window:
  - github.com # AIOps - Deploy Window: paused except while the n8n / vlagent roles run
# Non-loopback listeners that are expected: sshd, Caddy (the one off-host surface), vlagent's metrics port, zabbix-agent2.
net_posture_listen_allow_ports: [22, 8081, 9429, 10050]

# -----------------------------------------------------------------------------
# Zabbix: the stock Linux template plus the Gna network posture one (egress/ingress alerts), imported by
# playbooks/zabbix-host-groups.yml from playbooks/files/zabbix/gna-network-posture.yml.
# -----------------------------------------------------------------------------
zabbix_agent_host_groups:
  - "Linux servers"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  - "Gna network posture"
