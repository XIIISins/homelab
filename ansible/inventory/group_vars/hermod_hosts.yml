# ansible/inventory/group_vars/hermod_hosts.yml
---
# Hermod notification host group vars. Composes with role defaults from
# baseline, hermod-api, zabbix-agent, hardening.

# Self-monitoring metadata — distinguishes Hermod from other agents in
# any HostMetadata-driven dispatch.
zabbix_agent_host_metadata: "role=hermod location=verd"

# Host record taxonomy. Hermod is monitored at the Linux baseline level
# (CPU, memory, disk, network, agent uptime). No app-level Zabbix
# template exists for AppriseAPI; Apprise's own access logs land in VL
# via vlagent + Docker's journald log driver, which is the audit trail.
zabbix_agent_host_groups:
  - "Linux servers"
  - "Asgard/LXCs/Hermod"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
