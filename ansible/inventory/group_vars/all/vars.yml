# Connection defaults — apply to every host unless overridden in a more
# specific group or per-host.
ansible_user: ansible
# ansible_ssh_private_key_file is DELIBERATELY not set here — `~` would
# expand to the running user's home (e.g. /home/semaphore inside the
# Semaphore pod, where no such file exists) and Ansible's strict
# IdentitiesOnly=yes ssh_args path blocks fallthrough to Semaphore's
# --private-key tempfile. Same class as the vault-pass + private_key
# fixes in ansible.cfg. Operator's MacBook picks up the path via
# ANSIBLE_PRIVATE_KEY_FILE in the homelab-env static map; the pod uses
# the tempfile Semaphore writes from project_inventory.ssh_key_id.
ansible_python_interpreter: /usr/bin/python3

# Baseline role
breakglass_user: recovery

# K3s
k3s_init_node: gondul
