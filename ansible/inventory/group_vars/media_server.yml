---
# Jellyfin - media server with Intel QuickSync, privileged LXC 1123 on Urd, 10.0.11.223 (Phase 5h).
# Plan: docs/operations/5h-jellyfin.md. Composes with the role defaults (roles/jellyfin) and baseline / hardening / vlagent.

# resolv.conf is owned by PVE (the LXC `dns {}` block in terraform/proxmox/asgard-lxcs-root/lxcs.tf writes the AdGuard VIP
# + UCG fallback at every container start). Ansible stops managing it so the two don't fight on reboot.
# See docs/known-issues/lxc-proxmox.md.
baseline_manage_resolv_conf: false

# -----------------------------------------------------------------------------
# vlagent: syslog (the QSV smoke test and the NFS mount log there) and Jellyfin's own log files
# -----------------------------------------------------------------------------
vlagent_log_inputs:
  - path: /var/log/syslog
    service: syslog
  - path: /var/log/jellyfin/jellyfin*.log
    service: jellyfin

# -----------------------------------------------------------------------------
# Zabbix: the stock Linux template plus the Jellyfin one (QSV smoke test, media mount, /health), imported by
# playbooks/zabbix-host-groups.yml from playbooks/files/zabbix/jellyfin.yml.
# -----------------------------------------------------------------------------
zabbix_agent_host_groups:
  - "Linux servers"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  - "Jellyfin"
