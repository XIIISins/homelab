# ansible/inventory/group_vars/pbs.yml
---
# PBS (Proxmox Backup Server, LXC 1101) was installed via the
# upstream PBS installer (not Terraform/Ansible), root-only SSH;
# no `ansible` user with sudo exists. Override the global default
# so any playbook targeting pbs works transparently.
ansible_user: root

# Zabbix host record taxonomy.
zabbix_agent_host_groups:
  - "Linux servers"
  - "Asgard/LXCs/Backup"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  # playbooks/files/zabbix/asgard-services.yml: PBS daemons and the :8007 API port
  - "PBS services"
  # vlagent.service state (playbooks/files/zabbix/asgard-services.yml)
  - "vlagent log shipper"
