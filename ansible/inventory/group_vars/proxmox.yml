# ansible/inventory/group_vars/proxmox.yml
---
# Proxmox PVE hosts (urd/verd/skuld) are operator-managed at the OS
# level — no Terraform manages the Proxmox install, no baseline role
# applied (those run on the LXC/VM workloads, not the hypervisor).
# Result: there's no `ansible` user with sudo; the operator's SSH key
# is on root only. Override the global ansible_user default here so
# any playbook targeting proxmox works transparently.
ansible_user: root

# Zabbix host record taxonomy. Proxmox lives under a separate root
# from Asgard's LXCs — these hosts ARE the substrate, not workloads.
# Linux baseline (host-level via agent) + `Proxmox VE by HTTP`
# (cluster/VM/LXC/storage state via the PVE API).
#
# Auth: TF-managed `zabbix-monitor@pve` user + API token, both
# created by terraform/proxmox/zabbix-access. Token secret stashed
# in Vault at ansible/proxmox/zabbix-token (fields: token_id +
# secret). Single user+token serves all 3 nodes (PVE cluster auth);
# per-host {$PVE.URL.HOST} just steers each scrape to the right node.
zabbix_agent_host_groups:
  - "Linux servers"
  - "Hypervisors/Proxmox"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  - "Proxmox VE by HTTP"
  # NVMe wear / spare / media errors / temperature for the 10h1 forecasts. Needs smartctl + sudo + the sudoers rule from
  # the proxmox-host role (smart.yml); the agent's SMART plugin runs `sudo smartctl` as the zabbix user.
  - "SMART by Zabbix agent 2"
  # i915 GPU HANG counter (the Jellyfin LXC can run on any node): playbooks/files/zabbix/proxmox-igpu.yml, fed by the
  # proxmox-host role (gpu.yml).
  - "Proxmox iGPU"
zabbix_agent_host_macros:
  - macro: "{$PVE.URL.HOST}"
    value: "{{ ansible_host }}"
  - macro: "{$PVE.TOKEN.ID}"
    value: "{{ lookup('community.hashi_vault.vault_kv2_get', 'ansible/proxmox/zabbix-token').secret.token_id }}"
  - macro: "{$PVE.TOKEN.SECRET}"
    value: "{{ lookup('community.hashi_vault.vault_kv2_get', 'ansible/proxmox/zabbix-token').secret.secret }}"
    type: secret
  # NVMe temperature triggers (SMART by Zabbix agent 2). Stock 50/65 sit far below the drives' own limits (warn/crit
  # 85/85 verd, 88/90 skuld, 90/95 urd) and the hosts idle at 52-61 C, so the stock values left every node in a permanent
  # warning and paged Hermod (Average) ~30x a week on urd's brief spikes. Host macros, because a template macro beats a
  # global one.
  - { macro: "{$SMART.TEMPERATURE.MAX.WARN}", value: "75" }
  - { macro: "{$SMART.TEMPERATURE.MAX.CRIT}", value: "85" }
