---
# Factorio LXC group vars. Composes with role defaults from baseline,
# factorio, sftpgo, and hardening.

# SFTPGo virtual users for this host. The factorio role creates and owns
# the /factorio/* tree; SFTPGo serves into it as the sftpgo system user,
# which baseline adds to the `factorio` group (via sftpgo_extra_groups).
sftpgo_extra_groups:
  - factorio

sftpgo_users:
  - username: operator
    description: "Factorio server operator (friend with shell-by-SFTP access)"
    # HashiCorp Vault (preserved value, migrated off Ansible-Vault in Wave S3).
    password: "{{ lookup('community.hashi_vault.vault_kv2_get', 'ansible/factorio/operator-password').secret.value }}"
    status: 1
    home_dir: /factorio
    permissions:
      "/": ["list", "download"]
      "/mods":
        [
          "list",
          "download",
          "upload",
          "overwrite",
          "delete",
          "rename",
          "create_dirs",
        ]
      "/saves":
        [
          "list",
          "download",
          "upload",
          "overwrite",
          "delete",
          "rename",
          "create_dirs",
        ]
      "/scenarios":
        [
          "list",
          "download",
          "upload",
          "overwrite",
          "delete",
          "rename",
          "create_dirs",
        ]
      "/script-output": ["list", "download"]
      "/control": ["list", "download", "upload", "overwrite"]
      "/status": ["list", "download"]
      "/logs": ["list", "download"]
      "/config":
        [
          "list",
          "download",
          "upload",
          "overwrite",
          "delete",
          "rename",
          "create_dirs",
        ]
      # /config is intentionally omitted — server-settings.json contains
      # game_password and account_token; admin/ban/whitelist files are
      # also write-protected from the operator.
    max_sessions: 4
    quota_size: 0 # unlimited; LXC disk is the cap
    quota_files: 0

# -----------------------------------------------------------------------------
# Zabbix host record taxonomy
# -----------------------------------------------------------------------------
zabbix_agent_host_groups:
  - "Linux servers"
  - "Asgard/LXCs/Factorio"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
