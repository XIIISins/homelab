# ansible/inventory/group_vars/zabbix.yml
---
# Zabbix server host group vars. Composes with role defaults from
# baseline, zabbix-server, zabbix-agent, hardening.
#
# Cluster shape (Phase 5h):
#   - Zabbix LXC 1102 on Skuld, IP 10.0.11.21
#   - DB: zabbix on niflheim Patroni cluster (via HAProxy VIP 10.0.10.210)
#
# Pre-flight: ensure `secret/ansible/postgres/zabbix-password` is in
# Vault and `postgres_databases` in group_vars/postgres.yml
# includes the `zabbix` DB. See ansible/roles/zabbix-server/README.md.

# Most defaults from the role are fine. Override here if you want
# different sizing or per-cluster tuning.

# Self-monitoring metadata — distinguishes the Zabbix server from
# the other agents in any HostMetadata-driven auto-registration.
zabbix_agent_host_metadata: "role=zabbix-server location=urd"

# Host record taxonomy. Hugin gets the standard Linux template plus
# `Zabbix server health` — internal monitoring (queue depth, cache
# hit rate, DB write throughput, etc.) that works out of the box on
# the server itself.
zabbix_agent_host_groups:
  - "Linux servers"
  - "Asgard/LXCs/Zabbix"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  - "Zabbix server health"
  # Hugin runs nginx + php-fpm as the Zabbix frontend itself. Both
  # templates fetch via HTTP from localhost — zabbix-server role's
  # web-config.yml exposes /basic_status (nginx stub_status) and
  # /status + /ping (proxied PHP-FPM) restricted to
  # `allow 127.0.0.1; deny all`.
  - "Nginx by Zabbix agent"
  - "PHP-FPM by Zabbix agent"
