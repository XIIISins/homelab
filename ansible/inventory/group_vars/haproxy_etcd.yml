# ansible/inventory/group_vars/haproxy_etcd.yml
---
# HAProxy/etcd trio group vars. Composes with role defaults from
# baseline, etcd, haproxy, keepalived, hardening.
#
# Cluster shape (Phase 5g.2 — PG HA with Patroni):
#   - Hlin   (10.0.11.233 / 10.0.10.233, Urd)   — VRRP primary (priority 100)
#   - Eir    (10.0.11.234 / 10.0.10.234, Verd)  — first failover (90)
#   - Snotra (10.0.11.235 / 10.0.10.235, Skuld) — second failover (80)
#
# eth0 (VLAN 11): etcd peer + Patroni REST API traffic, default gateway
# eth1 (VLAN 10): keepalived VRRP + VIP 10.0.10.210 (HL-ASG-VIP zone)

# -----------------------------------------------------------------------------
# HAProxy — PostgreSQL frontend with Patroni REST-API leader detection
# -----------------------------------------------------------------------------
# Patroni exposes /master on its REST API (port 8008); only the current
# leader returns HTTP 200. HAProxy probes each PG node on the check
# port, marks the two replicas DOWN, routes writes to the leader.
# `balance first` + one-UP-at-a-time = deterministic routing.
# `on-marked-down: shutdown-sessions` forces clients to reconnect on
# leader demotion (otherwise long-lived sessions stick to the deposed
# primary until they error out — defeats failover transparency).
#
# `timeout client/server 30m` + `option tcpka` override the role's 50s
# defaults FOR THE DB PATH ONLY (the stats listener keeps 50s). The 50s
# default reaped any PG connection idle >50s — ~5.5k/day of idle-pooled
# connections (psycopg pools, and Authentik's django-channels LISTEN conn
# most visibly) got killed, surfacing as `OperationalError(SSL SYSCALL
# error: EOF detected)` on next reuse. Benign (auto-reconnect) but wasteful
# + log-noisy. 30m + TCP keepalives matches the upstream Patroni HAProxy
# reference — DB connections are long-lived by design. (Surfaced 2026-05-31
# Wave S7 — HAProxy `cD` terminations at Tt≈50s confirmed the idle reap;
# zero backend DOWN/UP events ruled out shutdown-sessions/failover.)

haproxy_stats:
  bind: "127.0.0.1:9000"
  uri: "/"

haproxy_listens:
  - name: pg_write
    bind: ["*:5432"]
    mode: tcp
    balance: first
    options:
      - "tcplog"
      - "httpchk GET /master HTTP/1.0"
      - "tcpka" # TCP keepalives — detect dead peers under the 30m idle timeout
    http_check:
      expect: "status 200"
    default_server:
      inter: 3s
      fall: 3
      rise: 2
      on-marked-down: shutdown-sessions
    extra:
      - "timeout client 30m" # DB conns are long-lived; the 50s default reaped idle pooled conns
      - "timeout server 30m"
    servers:
      - { name: fulla, address: 10.0.11.230, port: 5432, check_port: 8008 }
      - { name: vor,   address: 10.0.11.231, port: 5432, check_port: 8008 }
      - { name: idunn, address: 10.0.11.232, port: 5432, check_port: 8008 }

# -----------------------------------------------------------------------------
# keepalived — VIP 10.0.10.210 on VLAN 10 (HL-ASG-VIP)
# -----------------------------------------------------------------------------
# All peers start as BACKUP; election by priority (avoids dual-MASTER
# on simultaneous boot when interfaces come up out of order).
#
# chk_haproxy tracking: HAProxy is the actual workload — if it's down
# on the current VIP holder, the VIP must move regardless of node
# health. weight -50 drops the holder's effective priority enough that
# the next peer wins (100→50 < 90 on Hlin, 90→40 < 80 on Eir, etc.)
#
# virtual_router_id 61: AdGuard VIP 10.0.10.200 runs VRRP on the same
# L2 segment at VRID 51. Two VRRPs on one broadcast domain MUST have
# different VRIDs — otherwise each receives the other's adverts,
# auth-fails, and logs "received an invalid passwd from <peer>"
# continuously. Spacing convention: increment by 10 (AGH=51, PG=61,
# next VRRP=71, ...) leaves room without renumbering.

keepalived_priorities:
  hlin:   { VI_PG: 100 }
  eir:    { VI_PG: 90 }
  snotra: { VI_PG: 80 }

keepalived_vrrp_scripts:
  - name: chk_haproxy
    # systemctl returns 0 only when the unit is active (running). Catches
    # "failed", "activating", and "inactive" states all as failure — more
    # accurate than `killall -0` (which passes for any process named
    # haproxy regardless of systemd's view) and avoids depending on psmisc.
    script: "/usr/bin/systemctl is-active --quiet haproxy.service"
    interval: 2
    weight: -50
    fall: 2
    rise: 2

keepalived_vrrp_instances:
  - name: VI_PG
    interface: eth1
    virtual_router_id: 61
    priority: "{{ keepalived_priorities[inventory_hostname].VI_PG }}"
    auth_pass: "{{ lookup('community.hashi_vault.vault_kv2_get', 'ansible/keepalived/pg_vrrp').secret.auth_pass }}"
    virtual_ipaddresses:
      - "10.0.10.210/24 dev eth1"
    track_scripts: [chk_haproxy]

# -----------------------------------------------------------------------------
# Source-based policy routing for VLAN 10
# -----------------------------------------------------------------------------
# VIP segment (VLAN 10) is not on the default route (VLAN 11). Without
# policy routing, replies to clients on a third subnet (K8s pods via
# worker eth1 / Teamspeak LXC / etc.) exit eth0 carrying the VIP source
# IP — UCG-Ultra sees src=10.0.10.x on a VLAN-11 packet and stateful-drops
# the reply. Same class as the K3s workers' VLAN 20 fix, generalised
# into the keepalived role.

keepalived_source_policy_routing:
  - name: vlan10
    table_id: 200
    from: 10.0.10.0/24
    gateway: 10.0.10.1
    interface: eth1

# -----------------------------------------------------------------------------
# Zabbix host record taxonomy (Round 2 — HAProxy + Etcd monitoring depth)
# -----------------------------------------------------------------------------
# Linux baseline + HAProxy + Etcd templates.
#
# `HAProxy by Zabbix agent`: agent2 fetches the stats page via the
# built-in `web.page.get` (no extra plugin package). Our stats
# endpoint binds 127.0.0.1:9000 with uri="/" — overriding PORT=9000
# and PATH="" makes the template's URL pattern
# `http://localhost:9000/` (+ ";csv") match.
#
# `Etcd by HTTP`: Zabbix server fetches /metrics, /health, /version
# directly from each etcd node via HTTP (item type 19, HTTP-agent,
# NOT zabbix-agent). Etcd runs HTTP-only on VLAN 11 in this homelab
# — no client TLS — so server-side scrape Just Works. {$ETCD.HOST}
# resolves to each host's ansible_host IP at register time so the
# server hits the right node.
zabbix_agent_host_groups:
  - "Linux servers"
  - "Asgard/LXCs/HAProxy-etcd"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  - "HAProxy by Zabbix agent"
  - "Etcd by HTTP"
zabbix_agent_host_macros:
  # HAProxy — override defaults to match our stats config
  - { macro: "{$HAPROXY.STATS.PORT}", value: "9000" }
  - { macro: "{$HAPROXY.STATS.PATH}", value: "" } # uri="/" + the template's leading slash
  # Etcd — per-host scrape target (server-side fetch)
  - { macro: "{$ETCD.HOST}", value: "{{ ansible_host }}" }
