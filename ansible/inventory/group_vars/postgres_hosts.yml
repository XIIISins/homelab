---
# PostgreSQL host group vars. Composes with role defaults from baseline,
# postgres, patroni, and hardening.
#
# Cluster shape (Phase 5g.2 — PG HA with Patroni):
#   - Fulla (10.0.11.230, Skuld) — adoption-time primary
#   - Vor   (10.0.11.231, Urd)   — replica
#   - Idunn (10.0.11.232, Verd)  — replica
#
# DCS: etcd on the HAProxy/etcd trio (Hlin/Eir/Snotra), auto-discovered
# from the `haproxy_etcd_hosts` inventory group by the patroni role.
#
# Three management PG roles, passwords sourced from HashiCorp Vault:
#   - admin      — hand-on-keyboard ops (SUPERUSER)
#   - ansible    — playbook + AWX + Patroni-internal superuser (SUPERUSER)
#   - replicator — Patroni-internal streaming replication (REPLICATION)
#
# Per-service databases are added on demand by extending `postgres_databases`
# below and re-running the playbook (changes apply on the Patroni leader).

# Switch the postgres + patroni roles into HA mode. cluster.yml, config.yml,
# hba.yml are skipped; Patroni owns postgresql.conf + pg_hba.conf + cluster
# lifecycle. users.yml / databases.yml run leader-only.
postgres_patroni_managed: true

# Allowed source CIDRs for network auth (scram-sha-256). Rendered into
# Patroni's bootstrap.dcs.postgresql.pg_hba (cluster-wide, propagated to
# all members via DCS). Localhost / peer / replication rules are added
# unconditionally by the patroni.yml.j2 template.
postgres_allowed_cidrs:
  - 10.0.11.0/24 # asgard LXC subnet (Teamspeak, ops, Authentik via HAProxy VIP later)
  - 10.0.21.0/24 # asgard K3s nodes (Authentik via node NAT)
  - 10.0.31.0/24 # jotunheim K3s nodes (future)
  - 10.0.60.10/32 # MacBook (admin tasks)

# Per-service databases. Created via the leader's Unix socket after Patroni
# is up. Idempotent — re-running with the same list is a no-op.
# Schema: { name, owner, password_vault_path }
postgres_databases:
  - name: authentik
    owner: authentik
    password_vault_path: ansible/postgres/authentik-password
  - name: netbox
    owner: netbox
    password_vault_path: ansible/postgres/netbox-password
  # Phase 5h — Zabbix server. The zabbix-server role's schema-bootstrap
  # task loads /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz
  # into this DB on first deploy. See ansible/roles/zabbix-server/README.md.
  - name: zabbix
    owner: zabbix
    password_vault_path: ansible/postgres/zabbix-password
  # Teamspeak 3 server, asgard K3s (k8s/asgard/apps/teamspeak/).
  # TS3 3.13+ ships a first-party PostgreSQL plugin; on first connect
  # with an empty schema it auto-runs create_postgresql.sql to bootstrap
  # tables. The role+DB just need to exist with full ownership on the
  # `teamspeak3` schema — handled by postgres-common.
  - name: teamspeak3
    owner: teamspeak3
    password_vault_path: ansible/postgres/teamspeak3-password

# -----------------------------------------------------------------------------
# Zabbix host record taxonomy (Round 2 — PG monitoring depth)
# -----------------------------------------------------------------------------
# Linux baseline + `PostgreSQL by Zabbix agent 2`. The PG template uses
# {$PG.URI}/{$PG.USER}/{$PG.PASSWORD}/{$PG.DATABASE} macros — agent2's
# PG plugin parses URI, connects, runs SELECTs against pg_stat_* views
# (read-only, via the `pg_monitor` predefined role).
#
# Monitoring user `zbx_monitor` provisioned by postgres-common on the
# Patroni leader (see postgres-common/defaults/main.yml). Password
# minted in Vault at ansible/postgres/zabbix-monitor-password (TF).
# Same password across all three PG nodes (single Patroni cluster,
# shared user table via streaming replication).
# PG monitoring needs the agent2 PostgreSQL plugin, which Zabbix ships
# as a separate Debian package (NOT bundled with base zabbix-agent2).
# Without it, items return `Unknown metric pgsql.<...>` in unsupported
# state. Override the role default to include it on PG hosts only.
zabbix_agent_packages:
  - zabbix-agent2
  - zabbix-agent2-plugin-postgresql

zabbix_agent_host_groups:
  - "Linux servers"
  - "Asgard/LXCs/Postgres"
zabbix_agent_link_templates:
  - "Linux by Zabbix agent"
  - "PostgreSQL by Zabbix agent 2"
zabbix_agent_host_macros:
  # Only PASSWORD needs an override — the template's own defaults for
  # {$PG.CONNSTRING.AGENT2} (tcp://localhost:5432), {$PG.USER}
  # (zbx_monitor), and {$PG.DATABASE} (postgres) all match the
  # provisioning shape we want. Adding redundant macros here would
  # just be noise.
  - macro: "{$PG.PASSWORD}"
    value: "{{ lookup('community.hashi_vault.vault_kv2_get', 'ansible/postgres/zabbix-monitor-password').secret.value }}"
    type: secret
