[defaults]
# Inventory plugin chain: NetBox first (dynamic, Phase 5h.3 — group
# membership via ansible:<group> tags), static fallback second. First
# plugin to provide a host wins; static hosts.yml stays authoritative
# for hosts NOT yet in NetBox + serves as DR fallback when NetBox is
# unreachable + the cache has expired. See
# docs/architecture/ansible-orchestration.md "Inventory" section.
inventory           = inventory/netbox.yml, inventory/hosts.yml
roles_path          = roles
collections_path    = collections
callback_plugins    = callback_plugins
# vault_password_file deliberately NOT set here — `~` would expand to
# /home/semaphore inside the Semaphore pod (path doesn't exist) and
# Ansible hard-errors loading a missing cfg-specified password file
# even when a working --vault-password-file is also passed on CLI.
# Operator's MacBook gets the path via ANSIBLE_VAULT_PASSWORD_FILE in
# the homelab-env static map; Semaphore's template.vaults[] block
# writes its own temp file + flags it. Surfaced 2026-05-26 first
# drift-check smoketest under Semaphore.
# private_key_file deliberately NOT set here — same class as
# vault_password_file above. With IdentitiesOnly=yes in ssh_args, a
# missing cfg-specified IdentityFile gets a "no such identity" SSH
# error AND prevents fallthrough to Semaphore's --private-key (from
# project_inventory.ssh_key_id tempfile), so pod-side runs fail
# 'Permission denied (publickey)' against the real key. Operator's
# MacBook gets the path via ANSIBLE_PRIVATE_KEY_FILE in the
# homelab-env static map.
host_key_checking   = False
deprecation_warnings=False

# Parallelism: default forks=5 serializes the ~23-host fleet 5-at-a-time; 20
# covers it in ~1 wave (measured 2.7x faster on a bare ping fanout, more on
# task-heavy plays). SAFE — every task/play that must serialize carries its
# own serial:/throttle:/run_once:, which are absolute caps that clamp BELOW
# forks (forks is a ceiling, not a floor): keepalived + zabbix host.create
# (throttle:1); postgres/os-updates/k3s/adguard/proxmox-patching (serial:1);
# k3s install/taint (run_once). No unguarded fleet-wide shared-write exists.
forks               = 20

# Enable the plugins netbox.yml relies on. Without auto+jsonfile +
# the netbox plugin in the allow-list, the dynamic inventory file is
# silently skipped (treated as an unparseable YAML inventory).
[inventory]
enable_plugins      = netbox.netbox.nb_inventory, ansible.builtin.yaml, ansible.builtin.ini
cache               = True
cache_plugin        = jsonfile

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root

# ssh_args MUST live under [ssh_connection], not [defaults] — Ansible
# silently ignores it elsewhere and falls back to its built-in default
# (`-C -o ControlMaster=auto -o ControlPersist=60s`). Without
# IdentitiesOnly=yes the SSH client offers every key in ~/.ssh/ +
# ssh-agent before settling on the right one — on hardened sshd with
# MaxAuthTries=3 (set by the hardening role), that disconnects before
# the right key is offered. Surfaced 2026-05-25 mid-Phase-5b.2 after
# hardening landed on Mimir.
[ssh_connection]
# pipelining eliminates the module-write + separate-exec SSH round-trips per
# task (big win, stacks on forks). Safe here: no `requiretty` in the hardening
# role's sudoers (verified 2026-07-02), the only requirement for pipelining +
# become. Validated fleet-wide: sudo command on all 26 hosts, 0 failures.
pipelining = True
# ControlPersist 60s->600s keeps the multiplexed SSH sockets warm across
# back-to-back reconciles (Semaphore's 30-min loop + operator re-runs).
ssh_args = -C -o ControlMaster=auto -o ControlPersist=600s -o IdentitiesOnly=yes
