# .github/workflows/ci.yml
#
# PR validation for the homelab IaC repo. Pushing `main` IS the K8s deploy
# (Flux reconciles it), so this is the gate in front of that: nothing here
# touches a cluster, a hypervisor, Vault or Terraform state — static checks only.
#
#   secrets     gitleaks over the entire repo history, every run (public repo; findings are
#               --redact'ed so the Actions log never prints a value)
#   yamllint    YAML parses + is unambiguous (config: .yamllint.yml)
#   workflows   actionlint on .github/workflows
#   terraform   fmt -check + per-module `init -backend=false` / `validate`
#   kubernetes  kustomize build of every kustomization + kubeconform (schema)
#   ansible     ansible-lint (profile in ansible/.ansible-lint) with the pinned collections
#   docs        relative Markdown links + anchors resolve
#   aiops       Phase 10c: alert/runbook/action schemas, cross-file consistency, tests
#   CI gate     the ONE job a branch ruleset requires (see terraform/github/)
#
# A Markdown-only PR therefore runs just: changes, secrets, docs links, agent-scope and the gate.
#
# Why a single gate job: jobs are skipped when their paths didn't change
# (.github/scripts/ci-changes.sh). A *required* check that is skipped by a
# workflow-level path filter never reports and blocks the PR forever; a skipped
# *job* inside an always-running workflow does report, and the gate folds
# "skipped" into "passing".
#
# Tool versions + sha256 are pinned inline (IaC pin policy; installs go through
# .github/scripts/install-tool.sh which verifies the hash). Reproduce locally:
# every step is a script in .github/scripts/ — see docs/procedures/ci.md.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # URL + sha256 pairs; bump both together.
  TERRAFORM_URL: https://releases.hashicorp.com/terraform/1.10.5/terraform_1.10.5_linux_amd64.zip
  TERRAFORM_SHA: 0566a24f5332098b15716ebc394be503f4094acba5ba529bf5eb0698ed5e2a90
  GITLEAKS_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
  GITLEAKS_SHA: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
  KUBECTL_URL: https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl
  KUBECTL_SHA: cfda68cba5848bc3b6c6135ae2f20ba2c78de20059f68789c090166d6abc3e2c
  KUBECONFORM_URL: https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
  KUBECONFORM_SHA: 95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73
  ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
  ACTIONLINT_SHA: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
  # Caches (docs/procedures/ci.md "Cache keys + bump checklist"). Keys are derived
  # from the pins above / the files named in each key, so a bump busts them.
  TOOL_CACHE: /home/runner/.cache/ci-tools                  # verified tool downloads, by sha256
  TF_PLUGIN_CACHE_DIR: /home/runner/.cache/terraform-plugins
  KUBECONFORM_CACHE: /home/runner/.cache/kubeconform
  # The datreeio CRD catalog is fetched from its `main` branch (a float). Bump
  # this when you bump a chart/operator whose CRD schema you need refreshed.
  KUBECONFORM_SCHEMA_EPOCH: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      terraform_modules: ${{ steps.c.outputs.terraform_modules }}
      k8s: ${{ steps.c.outputs.k8s }}
      yaml: ${{ steps.c.outputs.yaml }}
      ansible: ${{ steps.c.outputs.ansible }}
      docs: ${{ steps.c.outputs.docs }}
      workflows: ${{ steps.c.outputs.workflows }}
      aiops: ${{ steps.c.outputs.aiops }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: c
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/ci-changes.sh "$BASE" HEAD

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOL_CACHE }}
          key: tool-gitleaks-${{ env.GITLEAKS_SHA }}
      - run: .github/scripts/install-tool.sh "$GITLEAKS_URL" "$GITLEAKS_SHA" gitleaks
      # The WHOLE repo, every time: all commits on every fetched ref (full history, ~2 s at this size), not
      # just the commits the PR adds. A leak that slipped in earlier, or a .gitleaks.toml change that stops
      # suppressing something, then fails the next run instead of staying invisible.
      - name: scan the entire repository history
        run: gitleaks git --no-banner --redact .

  yamllint:
    name: yamllint
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-yamllint-${{ hashFiles('.github/ci-requirements.txt') }}
      # single source of truth for the pin: the yamllint line of ci-requirements.txt
      - run: pip install --quiet "$(grep '^yamllint==' .github/ci-requirements.txt)"
      - run: yamllint -f github .

  workflows:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOL_CACHE }}
          key: tool-actionlint-${{ env.ACTIONLINT_SHA }}
      - run: .github/scripts/install-tool.sh "$ACTIONLINT_URL" "$ACTIONLINT_SHA" actionlint
      - run: actionlint -color

  terraform-fmt:
    name: terraform fmt
    needs: changes
    if: needs.changes.outputs.terraform_modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOL_CACHE }}
          key: tool-terraform-${{ env.TERRAFORM_SHA }}
      - run: .github/scripts/install-tool.sh "$TERRAFORM_URL" "$TERRAFORM_SHA" terraform
      - run: terraform fmt -check -recursive -diff terraform

  terraform-validate:
    name: terraform validate (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.terraform_modules != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.terraform_modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOL_CACHE }}
          key: tool-terraform-${{ env.TERRAFORM_SHA }}
      # Providers: lock files are gitignored, so key on the module's .tf files
      # (required_providers pins live there). restore-keys reuses the previous
      # set on any .tf edit; init only downloads what is missing, and the new
      # key is saved. Same terraform version => same cache dir layout.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tfproviders-${{ env.TERRAFORM_SHA }}-${{ matrix.module }}-${{ hashFiles(format('{0}/*.tf', matrix.module)) }}
          restore-keys: |
            tfproviders-${{ env.TERRAFORM_SHA }}-${{ matrix.module }}-
      - run: .github/scripts/install-tool.sh "$TERRAFORM_URL" "$TERRAFORM_SHA" terraform
      - run: .github/scripts/ci-terraform.sh "${{ matrix.module }}"

  kubernetes:
    name: kubernetes (kustomize + kubeconform)
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the burst offline gate diffs against the base commit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TOOL_CACHE }}
          key: tool-k8s-${{ env.KUBECTL_SHA }}-${{ env.KUBECONFORM_SHA }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.KUBECONFORM_CACHE }}
          key: kubeconform-schemas-${{ env.KUBECONFORM_SCHEMA_EPOCH }}-${{ env.KUBECONFORM_SHA }}-${{ hashFiles('.github/scripts/ci-k8s.sh') }}
      - run: .github/scripts/install-tool.sh "$KUBECTL_URL" "$KUBECTL_SHA" kubectl
      - run: .github/scripts/install-tool.sh "$KUBECONFORM_URL" "$KUBECONFORM_SHA" kubeconform
      - run: .github/scripts/ci-k8s.sh
      # 10h burst test, offline half: the burst copy of the touched components builds, every Vault path an ExternalSecret reads is declared,
      # every image in the touched app manifests exists. The live half (a real burst cluster) runs on Frigg for agent PRs.
      - run: pip install --quiet PyYAML==6.0.2
      - run: .github/scripts/ci-k8s-burst.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  ansible:
    name: ansible-lint
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-ansible-${{ hashFiles('.github/ci-requirements.txt') }}
      - run: pip install --quiet -r .github/ci-requirements.txt
      # Collections are concrete-pinned, so the installed tree is a pure function
      # of requirements.yml (+ ansible-core): cache it and only hit Galaxy when a
      # pin changes. Restore and save are split so the cache is saved as soon as
      # the install succeeds, NOT at job end: a lint finding must not throw away
      # a 6-minute download. Saving only after a successful install also means a
      # partial tree (Galaxy 502 mid-install) is never cached.
      - name: restore galaxy collections
        id: galaxy-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ansible/collections
          key: galaxy-${{ runner.os }}-${{ hashFiles('ansible/requirements.yml', '.github/ci-requirements.txt') }}
      - name: install pinned collections
        id: galaxy-install
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        working-directory: ansible
        # Galaxy is slow/flaky: bound each request, retry the whole install.
        # Wipe collections/ between attempts: a 502 mid-install leaves a
        # partial tree and the retry would say "Nothing to do" and exit 0.
        run: |
          for attempt in 1 2 3; do
            rm -rf collections
            ansible-galaxy collection install -r requirements.yml -p collections --timeout 60 && exit 0
            echo "::warning title=galaxy install::attempt $attempt failed, retrying"; sleep 10
          done
          exit 1
      - name: save galaxy collections
        if: steps.galaxy-install.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ansible/collections
          key: ${{ steps.galaxy-cache.outputs.cache-primary-key }}
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint

  docs:
    name: docs links
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/ci-doc-links.py

  aiops:
    name: aiops (schemas + consistency + tests)
    needs: changes
    if: needs.changes.outputs.aiops == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pip install --quiet -r aiops/requirements.txt
      - run: python3 aiops/tools/lint.py
      - run: python3 -m unittest discover -s aiops/tests -v
      # The Zabbix -> n8n sender runs in Zabbix's Duktape engine inside the server (Europe/Amsterdam).
      # Node is preinstalled on the runner; the test shims HttpRequest/Zabbix.log.
      - run: TZ=Europe/Amsterdam node aiops/tests/zabbix-n8n-webhook.test.js

  # Phase 10h2. For a PR from an agent branch (`agent/<class>/<id>-<slug>`, made only by the Frigg dispatcher)
  # the file list must stay inside its class and outside the deny list in aiops/author-classes.yml. The script
  # and the class file are read from the PR's BASE commit so the PR cannot loosen its own rules. Layer two:
  # the dispatcher runs the same script before it pushes. Limit: a PR that edits THIS job is judged by its own
  # edited copy, which is why .github/ is itself on the deny list and the operator does the merge.
  agent-scope:
    name: agent-scope (10h2 agent PR paths)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - run: pip install --quiet PyYAML==6.0.2
      - name: list the PR files and check them
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ ! -f aiops/author/scope.py ]; then echo "scope.py is not on the base commit yet (the PR that adds it); skipping"; exit 0; fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[]' | jq -s '.' > "$RUNNER_TEMP/files.json"
          python3 aiops/author/scope.py --classes aiops/author-classes.yml --branch "$BRANCH" \
            --author "$AUTHOR" --files-json "$RUNNER_TEMP/files.json"
      # 10i4: a rightsizing PR changes container resources and nothing else. The script runs from the BASE commit (checked out above), so the PR
      # cannot loosen it; the PR's own head is fetched only to be read.
      - name: a rightsizing PR changes resources only
        if: startsWith(github.event.pull_request.head.ref, 'agent/rightsizing/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f .github/scripts/ci-resources-only.py ]; then echo "ci-resources-only.py is not on the base commit yet; skipping"; exit 0; fi
          git fetch --quiet --depth=1 origin "$HEAD_SHA"
          python3 .github/scripts/ci-resources-only.py --base "$BASE_SHA" --head "$HEAD_SHA"

  # The single required status check. Always runs; fails if any needed job
  # failed or was cancelled. "skipped" (path-filtered out) counts as passing.
  ci-gate:
    name: CI gate
    if: always()
    needs:
      - changes
      - secrets
      - yamllint
      - workflows
      - terraform-fmt
      - terraform-validate
      - kubernetes
      - ansible
      - docs
      - aiops
      - agent-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: all required jobs succeeded or were skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' >/dev/null; then
            echo "::error title=CI gate::at least one job failed or was cancelled"
            exit 1
          fi
