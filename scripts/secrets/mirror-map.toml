# scripts/secrets/mirror-map.toml
#
# Which Vault KV secret mirrors to which 1Password item. Read by scripts/secrets/vault-1p-mirror.
# Holds NAMES only (paths, titles, field labels), never values.
#
# [[mirror]]
#   name        short handle used on the command line
#   vault_path  KV v2 path under the mount (no "secret/" prefix)
#   op_title    1Password item title (convention: "[Realm] - Mirror - Service - Detail"); used to
#               find the item and, when `to-1p --apply` has to create it, as its title
#   op_id       optional: the item's UUID. Preferred over the title once known (renames stay safe)
#   category    optional: "Login" for a human web-UI login (default "API Credential"). `op` cannot change an
#               existing item's type: archive it and re-run to-1p to recreate it
#   url         optional: the item's website (set on create; added to an existing item only if it has none)
#   static      optional: { label = "value" } text fields written only when the item is CREATED, never
#               mirrored (a login's username when Vault only holds the password)
#   fields      { vault_field = "1P label" }. A ":text" suffix on the label makes a created field
#               plain text instead of concealed (urls, server lists, ids). API Credential items
#               already carry a concealed "credential" field.
#
# Add an entry, run `status`, then `to-1p --apply` (or `to-vault --apply`). Nothing is written
# without --apply, and a value that DIFFERS is never replaced without --overwrite.

[defaults]
op_vault = "Homelab 2.0"
vault_mount = "secret"

# [[ignore]] lists Vault paths that are deliberately NOT mirrored (a trailing / means the whole subtree), or a 1P
# item (op_id) that is deliberately not a mirror.
# `vault-1p-mirror unmapped` reports every Vault path that is neither a [[mirror]] nor an [[ignore]].

[[ignore]]
vault_path = "ansible/tailscale/authkeys/"
reason = "Terraform-minted, ephemeral pre-authorised keys: re-minted by `terraform apply`, a mirror is stale on arrival"

[[ignore]]
vault_path = "ansible/aiops/burst/"
reason = "burst runner env: the DO token is a copy of ansible/frigg/iac-env (mirror the original) and the AWS state key is Terraform-minted (terraform/aws/burst-runner.tf), re-minted by `terraform apply`"

[[ignore]]
vault_path = "ansible/frigg/iac-env"
reason = "aggregate of values that live elsewhere (the 1P items are the source and `homelab-env` loads them); mirror the originals"

[[ignore]]
vault_path = "ansible/frigg/github-pat-frigg"
reason = "single field with an EMPTY name, which neither vault CLI patching nor this tool can address; the PAT is in 1P as '[Asgard] - Frigg - PAT - push'"

[[ignore]]
vault_path = "ansible/adguard/admin-password-hash"
reason = "derived (bcrypt) from the AdGuard login that is already in 1P"

[[ignore]]
vault_path = "k8s/startpage/deploy-key"
reason = "1P holds it as a DOCUMENT item (a file attachment), which `op` cannot edit as a field; mirror by hand"

[[ignore]]
vault_path = "k8s/n8n/"
reason = "old asgard-K3s n8n, removed 2026-10-03 (the Vault apply deletes these)"

[[ignore]]
op_id = "yiid7wbgen6zxo2fxuwm7jbt7m"
reason = "1P note '[Asgard] - Mirror - Cloudflare - Tunnel credentials' holds only the tunnel UUID, not the credentials JSON (that mirror is its own item); kept for reference"

[[ignore]]
vault_path = "ansible/postgres/n8n-password"
reason = "old asgard-K3s n8n database, dropped 2026-10-03"

