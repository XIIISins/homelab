# scripts/secrets/mirror-map.toml
#
# Which Vault KV secret mirrors to which 1Password item. Read by scripts/secrets/vault-1p-mirror.
# Holds NAMES only (paths, titles, field labels), never values.
#
# [[mirror]]
#   name        short handle used on the command line
#   vault_path  KV v2 path under the mount (no "secret/" prefix)
#   op_title    1Password item title (convention: "[Realm] - Mirror - Service - Detail"); used to
#               find the item and, when `to-1p --apply` has to create it, as its title
#   op_id       optional: the item's UUID. Preferred over the title once known (renames stay safe)
#   fields      { vault_field = "1P label" }. A ":text" suffix on the label makes a created field
#               plain text instead of concealed (urls, server lists, ids). API Credential items
#               already carry a concealed "credential" field.
#
# Add an entry, run `status`, then `to-1p --apply` (or `to-vault --apply`). Nothing is written
# without --apply, and a value that DIFFERS is never replaced without --overwrite.

[defaults]
op_vault = "Homelab 2.0"
vault_mount = "secret"

# --- Phase 10d: Toolbelt + Gna secrets (secret/ansible/aiops/*) ---

[[mirror]]
name = "aiops-toolbelt-token"
vault_path = "ansible/aiops/toolbelt-token"
op_title = "[Asgard] - Mirror - AIOps - Toolbelt API token"
fields = { value = "credential" }

[[mirror]]
name = "aiops-zabbix-token"
vault_path = "ansible/aiops/zabbix-token"
op_title = "[Asgard] - Mirror - AIOps - Zabbix read-only token"
fields = { value = "credential", url = "url:text" }

[[mirror]]
name = "aiops-pve-token"
vault_path = "ansible/aiops/pve-token"
op_title = "[Asgard] - Mirror - AIOps - Proxmox read-only token"
fields = { secret = "credential", token_id = "token_id:text" }

[[mirror]]
name = "aiops-netbox-token"
vault_path = "ansible/aiops/netbox-token"
op_title = "[Asgard] - Mirror - AIOps - NetBox read-only token"
fields = { value = "credential", url = "url:text" }

[[mirror]]
name = "aiops-kube-token"
vault_path = "ansible/aiops/kube-token"
op_title = "[Asgard] - Mirror - AIOps - Kubernetes read-only token"
fields = { token = "credential", ca = "ca", servers = "servers:text" }

[[mirror]]
name = "aiops-semaphore-token"
vault_path = "ansible/aiops/semaphore-token"
op_title = "[Asgard] - Mirror - AIOps - Semaphore guest token"
fields = { value = "credential", url = "url:text" }

[[mirror]]
name = "aiops-anthropic-key"
vault_path = "ansible/aiops/anthropic-api-key"
op_title = "[Asgard] - Mirror - AIOps - Anthropic API key (Gna)"
fields = { key = "credential" }

[[mirror]]
name = "aiops-discord-diagnosis"
vault_path = "ansible/aiops/discord-diagnosis"
op_title = "[Asgard] - Mirror - AIOps - Discord #diagnoses webhook"
fields = { url = "credential" }

[[mirror]]
name = "aiops-n8n-encryption-key"
vault_path = "ansible/aiops/n8n-encryption-key"
op_title = "[Asgard] - Mirror - AIOps - n8n encryption key (Gna)"
fields = { value = "credential" }

[[mirror]]
name = "aiops-n8n-owner-password"
vault_path = "ansible/aiops/n8n-owner-password"
op_title = "[Asgard] - Mirror - AIOps - n8n owner password (Gna)"
fields = { value = "credential" }

[[mirror]]
name = "aiops-n8n-ingest-zabbix"
vault_path = "ansible/aiops/n8n-ingest-token/zabbix"
op_title = "[Asgard] - Mirror - AIOps - n8n ingest token (Zabbix)"
fields = { value = "credential" }
