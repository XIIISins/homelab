# k8s/jotunheim/apps/grafana/externalsecret.yaml
#
# Admin password + (optional) OIDC client secret for Grafana.
# Vault paths (to be populated before deploy):
#   secret/k8s/grafana/admin   → admin password
#   secret/k8s/grafana/oidc-client-secret → Authentik OIDC client
#     credentials (Phase 7b — defer until OIDC integration lands)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    template:
      engineVersion: v2
      data:
        admin-user: "admin"
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: k8s/grafana/admin
        property: password
