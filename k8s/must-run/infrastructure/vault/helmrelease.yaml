# k8s/must-run/infrastructure/vault/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.x"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  install:
    createNamespace: false
  values:
    global:
      enabled: true

    server:
      # 3 replicas for HA with Raft storage
      replicas: 3

      # Resource limits — small for homelab
      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
          cpu: 500m

      # Raft integrated storage — no external etcd needed
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/vault/data"
            }

            seal "awskms" {
              region     = "eu-west-1"
              kms_key_id = env("VAULT_AWSKMS_SEAL_KEY_ID")
            }

            service_registration "kubernetes" {}

      # Inject AWS credentials from the SealedSecret
      extraEnvVars:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: vault-unseal
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: vault-unseal
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: vault-unseal
              key: AWS_REGION
        - name: VAULT_AWSKMS_SEAL_KEY_ID
          valueFrom:
            secretKeyRef:
              name: vault-unseal
              key: VAULT_AWSKMS_SEAL_KEY_ID

      # Persistent storage for Raft
      dataStorage:
        enabled: true
        size: 5Gi
        storageClass: null # uses default — we'll configure Synology CSI later

      # Anti-affinity — spread Vault pods across nodes
      affinity: |
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
                  component: server
              topologyKey: kubernetes.io/hostname

    # Disable injector for now — add later if needed
    injector:
      enabled: false

    # Disable UI ingress for now — expose via MetalLB
    ui:
      enabled: true
      serviceType: LoadBalancer
