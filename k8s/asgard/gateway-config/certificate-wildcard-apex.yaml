# k8s/asgard/gateway-config/certificate-wildcard-apex.yaml
#
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-apex
  namespace: traefik
spec:
  secretName: wildcard-apex-tls
  # Wildcard cert for the apex `xiiisins.com` zone. Covers the bare
  # apex AND any subdomain.
  #
  # Browser-visible cert externally is Cloudflare's universal cert
  # (Cloudflare terminates TLS at the edge). This cert lives on the
  # origin side — used by Traefik when:
  #   - Cloudflared connects in-cluster on apex hostnames and
  #     re-encrypts traffic to Traefik.
  #   - Internal clients hit a bare-apex URL (e.g. `xiiisins.com` for
  #     WebFinger, or a `service.xiiisins.com` URL that AdGuard hasn't
  #     been told to rewrite to midgard); Traefik either serves the
  #     route directly or 301-redirects to the midgard mirror.
  dnsNames:
    - "xiiisins.com"
    - "*.xiiisins.com"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h # 90d
  renewBefore: 720h # 30d
  usages:
    - server auth
    - digital signature
    - key encipherment
