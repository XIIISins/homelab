# k8s/asgard/vpa-config/csi-driver-nfs.yaml
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: csi-nfs-controller
  namespace: csi-driver-nfs
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: csi-nfs-controller
  updatePolicy:
    updateMode: "Off"
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: csi-nfs-node
  namespace: csi-driver-nfs
spec:
  targetRef:
    apiVersion: apps/v1
    kind: DaemonSet
    name: csi-nfs-node
  updatePolicy:
    updateMode: "Off"
