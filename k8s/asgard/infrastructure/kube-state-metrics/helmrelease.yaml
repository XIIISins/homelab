# k8s/asgard/infrastructure/kube-state-metrics/helmrelease.yaml
#
# kube-state-metrics — exposes K8s API object state as Prometheus
# metrics (pod phases, deployment readiness, statefulset replicas,
# PVC bound state, etc.). Complements cAdvisor (per-container
# resource usage) and kubelet (per-node) which vmagent scrapes
# directly.
#
# Why this is in monitoring/ namespace (not kube-system) — the
# Phase-7 stack is namespaced + the chart's RBAC ClusterRole is
# cluster-scoped regardless of namespace.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: kube-state-metrics
      version: "8.6.0" # app v2.20.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    # Single replica is plenty for homelab scale. The chart's
    # default RBAC is fine — read-only cluster-scoped access to
    # most kinds.
    replicas: 1

    # Light resource limits — KSM is mostly idle, spikes briefly
    # on each scrape.
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { cpu: 100m, memory: 256Mi }

    # Disable the ServiceMonitor — requires Prometheus-Operator
    # CRDs which we don't have. vmagent's static scrape config
    # targets the Service directly via cluster DNS.
    prometheus:
      monitor:
        enabled: false

    # Default Service type=ClusterIP — what we want for vmagent.

    # Phase 10i1: VPA recommendations as metrics, so VictoriaMetrics keeps their history (the
    # Toolbelt's "is the recommendation stable over 7 days" check, and the 10i digest's trend lines).
    # KSM dropped its built-in VPA collector in v2.9; this is the documented customResourceState
    # replacement. Series: kube_customresource_vpa_containerrecommendations_{lowerbound,target,
    # upperbound,uncappedtarget}{namespace,verticalpodautoscaler,target_kind,target_name,container,
    # resource,unit}. vmagent already scrapes this Service; no scrape change.
    customResourceState:
      enabled: true
      config:
        kind: CustomResourceStateMetrics
        spec:
          resources:
            - groupVersionKind:
                group: autoscaling.k8s.io
                kind: VerticalPodAutoscaler
                version: v1
              metricNamePrefix: kube_customresource
              labelsFromPath:
                namespace: [metadata, namespace]
                verticalpodautoscaler: [metadata, name]
                target_kind: [spec, targetRef, kind]
                target_name: [spec, targetRef, name]
              metrics:
                - name: vpa_containerrecommendations_lowerbound
                  help: VPA container recommendation (lowerBound) for cpu.
                  commonLabels: {resource: cpu, unit: core}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [lowerBound, cpu]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_lowerbound
                  help: VPA container recommendation (lowerBound) for memory.
                  commonLabels: {resource: memory, unit: byte}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [lowerBound, memory]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_target
                  help: VPA container recommendation (target) for cpu.
                  commonLabels: {resource: cpu, unit: core}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [target, cpu]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_target
                  help: VPA container recommendation (target) for memory.
                  commonLabels: {resource: memory, unit: byte}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [target, memory]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_upperbound
                  help: VPA container recommendation (upperBound) for cpu.
                  commonLabels: {resource: cpu, unit: core}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [upperBound, cpu]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_upperbound
                  help: VPA container recommendation (upperBound) for memory.
                  commonLabels: {resource: memory, unit: byte}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [upperBound, memory]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_uncappedtarget
                  help: VPA container recommendation (uncappedTarget) for cpu.
                  commonLabels: {resource: cpu, unit: core}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [uncappedTarget, cpu]
                      labelsFromPath:
                        container: [containerName]
                - name: vpa_containerrecommendations_uncappedtarget
                  help: VPA container recommendation (uncappedTarget) for memory.
                  commonLabels: {resource: memory, unit: byte}
                  each:
                    type: Gauge
                    gauge:
                      path: [status, recommendation, containerRecommendations]
                      valueFrom: [uncappedTarget, memory]
                      labelsFromPath:
                        container: [containerName]
    rbac:
      extraRules:
        - apiGroups: [autoscaling.k8s.io]
          resources: [verticalpodautoscalers]
          verbs: [list, watch]
