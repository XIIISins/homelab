# k8s/asgard/infrastructure/kustomization.yaml
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealed-secrets
  - synology-csi
  - vault
  - external-secrets
  - metallb
  - gateway-api
  - cert-manager
  - traefik
  - authentik
  - cloudflared
  - coredns-custom
  # Phase 7 — observability infra. Order:
  #   monitoring-namespace creates the `monitoring` ns + the shared
  #   Traefik ForwardAuth Middleware (referenced by VL+VM HTTPRoutes
  #   over in apps/). vlagent DaemonSet ships pod logs to VL (in
  #   apps/victorialogs/) via in-cluster Service DNS. vmagent scrapes
  #   K8s-layer metrics (kubelet/cAdvisor/KSM/pod-annotations) and
  #   remote-writes to VM (in apps/victoriametrics/). Zabbix LXC
  #   handles host/LXC-level metrics — clean split, no duplication.
  - monitoring-namespace
  - victoria-logs-collector
  - kube-state-metrics
  - vmagent
  # Garage — self-hosted S3-compatible object store. Single-node
  # (RF=1, consistency_mode=dangerous), backs Outline now + future
  # Immich / backup targets. Bucket+key provisioning lives in
  # terraform/garage/ (operator port-forwards admin API).
  - garage
