# k8s/asgard/infrastructure/kustomization.yaml
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - sealed-secrets
  - synology-csi
  - vault
  - external-secrets
  - metallb
  - gateway-api
  - cert-manager
  - traefik
  - authentik
  - cloudflared
  - coredns-custom
  # Phase 7 — observability infra. Order:
  #   monitoring-namespace creates the `monitoring` ns + the shared
  #   Traefik ForwardAuth Middleware (referenced by VL+VM HTTPRoutes
  #   over in apps/). vlagent DaemonSet ships pod logs to VL (lives
  #   over in apps/victorialogs/) via in-cluster Service DNS.
  - monitoring-namespace
  - victoria-logs-collector
