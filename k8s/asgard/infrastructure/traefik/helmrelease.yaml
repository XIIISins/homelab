# k8s/asgard/infrastructure/traefik/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: "40.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    remediation:
      retries: 3 # first-deploy debugging; restore to 3 post-success
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 3
      kind: Deployment

    # required anti-affinity + 1 pod per worker = no room for a surge pod.
    # maxSurge: 0 prevents the deadlock; maxUnavailable: 1 keeps roll moving.
    # CHART KEY IS ROOT-LEVEL `updateStrategy` — `deployment.strategy` is
    # silently ignored by the chart, so the default (maxSurge:1/maxUnavailable:0)
    # was live for 33d and deadlocked the first roll (security-headers, 2026-06-27:
    # surge pod can't schedule — anti-affinity fills all 3 workers, CPs tainted).
    # See traefik-gateway-api.md.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1

    # Providers — only Gateway API for routing; KubernetesCRD stays on
    # because Middleware CRs are managed by it (Gateway API HTTPRoute
    # ExtensionRef filters reference these). IngressRoute CRs are simply
    # never created in this cluster.
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: true

    # Chart shouldn't auto-create a Gateway — we define our own in 5e.1.f
    gateway:
      enabled: false

    # Dashboard exposure deferred. Reachable via port-forward only.
    ingressRoute:
      dashboard:
        enabled: false

    # Entrypoints — listen on 80/443 directly (NET_BIND_SERVICE granted
    # below). Gateway listener ports match these internal ports 1:1.
    ports:
      web:
        port: 80
        exposedPort: 80
        expose:
          default: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 443
        exposedPort: 443
        expose:
          default: true
        http:
          tls: {}
          # Default security-response-header middleware applied to every
          # router on this entrypoint (all current + future HTTPRoutes).
          # Single source of truth — see middleware-security-headers.yaml.
          # Format is <namespace>-<name>@<provider>.
          middlewares:
            - traefik-security-headers@kubernetescrd
      traefik:
        expose:
          default: false

    # Service config — MetalLB LB on .10, preserve source IP
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 10.0.20.10
        externalTrafficPolicy: Local

    # Modest resources; tune later
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Logging — Traefik defaults to JSON access logs which are noisy.
    # Common log format is sufficient for a homelab.
    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: common

    # Pod anti-affinity: hard requirement to keep exactly one Traefik
    # pod per worker. Pairs with externalTrafficPolicy: Local — MetalLB
    # L2 election can pick any worker, and that worker must always have
    # a local Traefik pod for traffic to land cleanly. See
    # deployment.strategy above for the matching rollout config.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [traefik]
            topologyKey: kubernetes.io/hostname

    # Bind to privileged ports (80/443) directly. NET_BIND_SERVICE is
    # the only capability needed; everything else dropped.
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
