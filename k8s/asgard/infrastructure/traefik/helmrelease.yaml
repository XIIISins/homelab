# k8s/asgard/infrastructure/traefik/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: traefik
      version: "40.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    remediation:
      retries: -1 # first-deploy debugging; restore to 3 post-success
  upgrade:
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 3
      kind: Deployment
      strategy:
        type: RollingUpdate
        rollingupdate:
          maxSurge: 0
          maxUnavailable: 1

    # Providers — only Gateway API for routing; KubernetesCRD stays on
    # because Middleware CRs are managed by it (Gateway API HTTPRoute
    # ExtensionRef filters reference these). IngressRoute CRs are simply
    # never created in this cluster.
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesIngress:
        enabled: false
      kubernetesCRD:
        enabled: true
    # Chart shouldn't auto-create a Gateway — we define our own in 5e.1.f
    gateway:
      enabled: false

    # Dashboard exposure deferred. Reachable via port-forward only.
    ingressRoute:
      dashboard:
        enabled: false

    # Entrypoints — `http.redirections.entryPoint` is the post-v39 syntax
    # aligned with upstream Traefik static config.
    ports:
      web:
        port: 80
        exposedPort: 80
        expose:
          default: true
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        port: 443
        exposedPort: 443
        expose:
          default: true
        http:
          tls: {}
      traefik:
        expose:
          default: false

    # Service config — MetalLB LB on .10, preserve source IP
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 10.0.20.10
        externalTrafficPolicy: Local

    # Modest resources; tune later
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Logging — Traefik defaults to JSON access logs which are noisy.
    # Common log format is sufficient for a homelab.
    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: common

    # Pod anti-affinity to spread the 2 replicas across nodes.
    # Not required (we have 3 workers), but cleaner.
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution: # was preferred
          - labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values: [traefik]
            topologyKey: kubernetes.io/hostname
    securityContext:
      capabilities:
        drop: [ALL]
        add: [NET_BIND_SERVICE]
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      runAsNonRoot: true
