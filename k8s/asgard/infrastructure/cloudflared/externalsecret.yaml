# Pulls the tunnel credentials.json from Vault (written by
# terraform/cloudflare/ in 5e.2.d) and materializes a K8s Secret of the
# same name. The Secret has a single key `credentials.json` whose value
# is the JSON blob {AccountTag, TunnelSecret, TunnelID}. Mounted into
# the cloudflared pod at /etc/cloudflared/creds/credentials.json.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-credentials
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: cloudflared-credentials
    creationPolicy: Owner
  data:
    - secretKey: credentials.json
      remoteRef:
        key: k8s/cloudflared/credentials
        property: credentials.json
