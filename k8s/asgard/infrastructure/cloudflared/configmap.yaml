# Locally-managed cloudflared config. Git is truth — Cloudflare dashboard
# does NOT manage ingress rules (decision row: "Cloudflared management mode").
#
# `tunnel: asgard-k3s` references the tunnel by NAME (created via
# terraform/cloudflare/). cloudflared resolves NAME → UUID via the
# credentials.json file. Using the name keeps this ConfigMap static when
# the tunnel is ever recreated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: asgard-k3s
    credentials-file: /etc/cloudflared/creds/credentials.json

    # Built-in metrics + readiness server on :2000. /ready returns 200
    # iff at least one active connection to the Cloudflare edge.
    metrics: 0.0.0.0:2000

    # Image autoupdate is pointless in K8s (pod restarts blow it away);
    # version is controlled via the Deployment's image tag.
    no-autoupdate: true

    ingress:
      # Authentik via Traefik. Targets Traefik (not Authentik direct) so
      # that:
      # - The WebFinger Middleware (5e.2.f) on the midgard Gateway's
      #   apex listener applies on /.well-known/webfinger requests.
      # - The same path serves any future apex-FQDN service without
      #   needing another ingress rule here.
      #
      # httpHostHeader: required so Traefik sees Host: authentik.xiiisins.com
      # (not the in-cluster Service DNS name) and matches the right
      # HTTPRoute.
      #
      # noTLSVerify: required because Traefik's cert is for the *external*
      # hostname (*.xiiisins.com), not the in-cluster Service DNS name we
      # connect to. TLS still happens (envelope encryption); it's the
      # SAN match we skip. Acceptable — cluster network is trusted.
      - hostname: authentik.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: authentik.xiiisins.com
          noTLSVerify: true
      - hostname: xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: xiiisins.com
          noTLSVerify: true

      # Outline (wiki) — apex hostname routed through the same Traefik
      # backchannel as Authentik. Cloudflare DNS record (apex CNAME)
      # is in terraform/cloudflare/main.tf as cloudflare_dns_record.outline.
      - hostname: wiki.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: wiki.xiiisins.com
          noTLSVerify: true

      # Zabbix (Hugin) — apex hostname for WAN access. Phase 8c.5.
      # Same Traefik backchannel pattern as Authentik + Outline above;
      # midgard Gateway's zabbix-ingress HTTPRoute (k8s/asgard/apps/
      # zabbix-ingress/httproute.yaml) routes by hostname to the
      # zabbix-ingress/hugin Service, which has a manual EndpointSlice
      # pointing at LXC 10.0.11.21:80.
      #
      # SAML round-trip: user lands on the apex via tunnel → Zabbix
      # frontend → SP-signed AuthnRequest with ACS URL=
      # https://hugin.xiiisins.com/index_sso.php?acs → Authentik
      # returns the response to that exact host → user lands back on
      # Zabbix authenticated. The apex hostname is the CANONICAL SAML
      # entry point — authentik_provider_saml only supports a single
      # acs_url, so SAML logins MUST start from hugin.xiiisins.com.
      # The midgard alias (hugin.midgard) is fine for non-SAML browsing.
      - hostname: hugin.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: hugin.xiiisins.com
          noTLSVerify: true

      # Startpage — public personal homepage. Same Traefik backchannel
      # pattern as Authentik/Outline/Zabbix above; the midgard Gateway's
      # apex-wildcard listener routes home.xiiisins.com via the startpage
      # HTTPRoute (k8s/asgard/apps/startpage/httproute.yaml) to the Caddy
      # pod. Cloudflare DNS record: cloudflare_dns_record.startpage in
      # terraform/cloudflare/main.tf. External-only — no LAN bypass.
      - hostname: home.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: home.xiiisins.com
          noTLSVerify: true

      # MicroBin — public pastebin/file-share. Same Traefik backchannel
      # pattern; the midgard Gateway's apex-wildcard listener routes
      # paste.xiiisins.com via the microbin HTTPRoute (which gates
      # /pastalist + /admin behind Authentik, rest open). CF DNS record:
      # cloudflare_dns_record.microbin in terraform/cloudflare/main.tf.
      - hostname: paste.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: paste.xiiisins.com
          noTLSVerify: true

      # n8n — public WEBHOOK endpoint. Same Traefik backchannel pattern;
      # the midgard Gateway's apex-wildcard listener routes n8n.xiiisins.com
      # via the n8n HTTPRoute, which only exposes /webhook/*, /webhook-test/*
      # and /webhook-waiting/* at this hostname (everything else 404s — the
      # editor lives internal-only at n8n.niflheim.xiiisins.com behind
      # Authentik ForwardAuth). CF DNS record: cloudflare_dns_record.n8n in
      # terraform/cloudflare/main.tf.
      - hostname: n8n.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: n8n.xiiisins.com
          noTLSVerify: true

      # Immich — public photo/video library. Same Traefik backchannel
      # pattern as Outline above; the midgard Gateway's apex-wildcard
      # listener routes immich.xiiisins.com via the immich HTTPRoute to
      # the immich-server Service. CF DNS record: cloudflare_dns_record.immich
      # in terraform/cloudflare/main.tf.
      - hostname: immich.xiiisins.com
        service: https://traefik.traefik.svc.cluster.local:443
        originRequest:
          httpHostHeader: immich.xiiisins.com
          noTLSVerify: true

      # Catch-all — required by cloudflared. Returns 404 for any
      # hostname not matched above.
      - service: http_status:404
