# k8s/asgard/infrastructure/authentik/externalsecret.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authentik
    template:
      engineVersion: v2
      data:
        # Postgres — env vars override the chart's authentik.postgresql.* values block.
        # Literal IP (not FQDN) bypasses K8s DNS to avoid cached-NXDOMAIN flapping.
        # Fulla's TLS cert SAN includes the IP, so sslmode=require validates fine.
        AUTHENTIK_POSTGRESQL__HOST: "10.0.11.230"
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__USER: "authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .postgres_password }}"
        AUTHENTIK_POSTGRESQL__SSLMODE: "require"
        # Redis
        AUTHENTIK_REDIS__HOST: "authentik-redis"
        AUTHENTIK_REDIS__PASSWORD: "{{ .redis_password }}"
        # Misc
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrap_password }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .bootstrap_token }}"
        # Consumed by the redis statefulset via secretKeyRef
        redis-password: "{{ .redis_password }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: k8s/authentik/secret-key
        property: value
    - secretKey: postgres_password
      remoteRef:
        key: k8s/authentik/postgres-password
        property: value
    - secretKey: redis_password
      remoteRef:
        key: k8s/authentik/redis-password
        property: value
    - secretKey: bootstrap_password
      remoteRef:
        key: k8s/authentik/bootstrap-password
        property: value
    - secretKey: bootstrap_token
      remoteRef:
        key: k8s/authentik/bootstrap-token
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-blueprint-user
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: authentik-blueprint-user
    template:
      engineVersion: v2
      data:
        AUTHENTIK_BLUEPRINT_USER_PASSWORD: "{{ .user_password }}"
  data:
    - secretKey: user_password
      remoteRef:
        key: k8s/authentik/user-password
        property: value
