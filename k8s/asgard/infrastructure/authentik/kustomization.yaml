# k8s/asgard/infrastructure/authentik/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - namespace.yaml
  - helmrepository.yaml
  - externalsecret.yaml
  - redis.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: authentik-blueprints
    files:
      - blueprints/00-brand.yaml
      - blueprints/01-users.yaml
generatorOptions:
  disableNameSuffixHash: true
