# k8s/asgard/infrastructure/authentik/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  # Attach to the midgard Gateway, which serves the apex + midgard zones.
  # The Gateway lives in the traefik namespace; cross-namespace attachment
  # is allowed by the Gateway's allowedRoutes.namespaces.from: All.
  # Two listeners attached: one matches *.midgard.xiiisins.com (internal
  # alias), the other matches *.xiiisins.com (public via Cloudflared).
  parentRefs:
    - name: midgard
      namespace: traefik
      sectionName: websecure-midgard
    - name: midgard
      namespace: traefik
      sectionName: websecure-apex-wildcard
  hostnames:
    - authentik.midgard.xiiisins.com
    - authentik.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: authentik-server
          port: 80
          # Authentik's chart Service exposes the HTTP container port on 80
          # (the chart's `service.servicePort`, not the container's :9000).
          # No TLS terminate-then-re-encrypt; backend is plaintext inside
          # the cluster, Traefik did the TLS termination at the Gateway.
