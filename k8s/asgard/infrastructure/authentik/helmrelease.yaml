# k8s/asgard/infrastructure/authentik/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: authentik
      version: "2026.8.3"
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: authentik
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    authentik:
      log_level: info
      error_reporting:
        enabled: false
      postgresql:
        # Kept in sync with AUTHENTIK_POSTGRESQL__HOST in externalsecret.yaml,
        # which is the value that actually wins. See comment there for why VIP IP.
        host: 10.0.10.210
        port: 5432
        name: authentik
        user: authentik
        # password injected via AUTHENTIK_POSTGRESQL__PASSWORD from authentik Secret

    blueprints:
      configMaps:
        - authentik-blueprints

    server:
      replicas: 3
      envFrom:
        - secretRef:
            name: authentik
      service:
        type: ClusterIP
      ingress:
        enabled: false
      volumes:
        - name: media
          emptyDir: {}
      volumeMounts:
        - name: media
          mountPath: /media
      # CPU request 200m -> 50m per replica (Phase 10i0): live use is 7-12m
      # (2026-10-05), and three replicas at 200m held 600m of the workers'
      # CPU requests. Memory (576-697Mi used, above the 512Mi request) is
      # left for VPA to size once it has a week of data.
      # Phase 10i initial tuning (VictoriaMetrics 30d, 2026-10-05): max
      # working set 984Mi against the 1Gi limit, so memory request and
      # limit go up (request = 1.2 x max, limit = 1.5 x request).
      resources:
        requests:
          cpu: 50m
          memory: 1184Mi
        limits:
          memory: 1792Mi

    worker:
      replicas: 1
      envFrom:
        - secretRef:
            name: authentik
        - secretRef:
            name: authentik-blueprint-user
      volumes:
        - name: media
          emptyDir: {}
      volumeMounts:
        - name: media
          mountPath: /media
      # Phase 10i initial tuning: 30d max working set 673Mi > 512Mi request.
      resources:
        requests:
          cpu: 100m
          memory: 816Mi
        limits:
          memory: 1Gi

    postgresql:
      enabled: false

    geoip:
      enabled: false
