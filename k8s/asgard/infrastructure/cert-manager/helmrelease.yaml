# k8s/asgard/infrastructure/cert-manager/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.2"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
      interval: 12h
  install:
    remediation:
      # First-deploy debugging: -1 so failures aren't auto-uninstalled.
      # Restore to 3 after success and recommit.
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
      keep: true

    # Gateway API support — required for cert-manager to issue certificates
    # referenced from Gateway listeners. Without this, Gateway-attached certs
    # wouldn't be issued; we'd be stuck with Certificate-only flow.
    config:
      apiVersion: controller.config.cert-manager.io/v1alpha1
      kind: ControllerConfiguration
      enableGatewayAPI: true

    # Replica count: leader-election handles HA; 2 is enough for a homelab.
    replicaCount: 2

    # Phase 10i (2026-10-05): webhook + cainjector had no requests; from 30 days
    # of VictoriaMetrics history (CPU p95 <=9m; max 86Mi / 95Mi).
    webhook:
      replicaCount: 2
      resources:
        requests: {cpu: 10m, memory: 112Mi}

    cainjector:
      replicaCount: 2
      resources:
        requests: {cpu: 10m, memory: 128Mi}

    # Resource requests modest — cert-manager is light.
    resources:
      requests:
        cpu: 10m
        memory: 144Mi # Phase 10i: 30d max working set 117Mi
      limits:
        memory: 256Mi
