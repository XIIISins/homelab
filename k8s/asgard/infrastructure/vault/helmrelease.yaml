# k8s/asgard/infrastructure/vault/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.32.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  install:
    createNamespace: false
  values:
    global:
      enabled: true

    server:
      replicas: 3

      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
          cpu: 500m

      statefulSet:
        securityContext:
          pod:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 100
            runAsNonRoot: false

      extraInitContainers:
        - name: vault-data-chown
          image: busybox
          command:
            - sh
            - -c
            - chown -R 100:1000 /vault/data && chmod 750 /vault/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: data
              mountPath: /vault/data

      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/vault/data"
            }

            seal "awskms" {}

            service_registration "kubernetes" {}

      extraSecretEnvironmentVars:
        - envName: AWS_ACCESS_KEY_ID
          secretName: vault-unseal
          secretKey: AWS_ACCESS_KEY_ID
        - envName: AWS_SECRET_ACCESS_KEY
          secretName: vault-unseal
          secretKey: AWS_SECRET_ACCESS_KEY
        - envName: AWS_REGION
          secretName: vault-unseal
          secretKey: AWS_REGION
        - envName: VAULT_AWSKMS_SEAL_KEY_ID
          secretName: vault-unseal
          secretKey: VAULT_AWSKMS_SEAL_KEY_ID

      dataStorage:
        enabled: true
        size: 5Gi
        storageClass: "local-path"

      affinity: |
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
                  component: server
              topologyKey: kubernetes.io/hostname

    injector:
      enabled: false

    ui:
      enabled: true
      serviceType: LoadBalancer
      # Pin the MetalLB allocation statically. Previously vault-ui had no
      # loadBalancerIP, so MetalLB dynamically allocated from the pool bottom
      # (10.0.20.11) — the static/dynamic collision gotcha: a Service recreate
      # could shift it, and other static claims had to dodge that band.
      # Pinning .11 makes it a deterministic static claim (MetalLB's
      # static-beats-dynamic precedence reserves it). Kept deliberately as a
      # direct, Traefik-independent path to the Vault UI/API alongside the
      # FQDN HTTPRoute (vault.niflheim.xiiisins.com). Phase 6 Stage 1, 2026-05-31.
      loadBalancerIP: 10.0.20.11
      # Lock the plaintext direct path to the homelab supernet. Vault's listener
      # is tls_disable=1 (deliberate homelab tradeoff — Traefik terminates TLS at
      # the FQDN); the unencrypted .11 path must therefore never accept off-LAN
      # traffic. MetalLB (L2) honours loadBalancerSourceRanges → kube-proxy
      # programs the source filter. Safe: .11 is now break-glass-only (VAULT_ADDR
      # is the FQDN; in-cluster consumers use the ClusterIP/Service, not the VIP),
      # so this only constrains direct-VIP clients, all of which are 10.0.0.0/16.
      # NOT enforced at the Vault layer (token_bound_cidrs) — Vault sees SNAT'd
      # source IPs through MetalLB/Traefik, so CIDR-binding there rejects valid
      # logins. Phase 6, 2026-05-31.
      loadBalancerSourceRanges:
        - 10.0.0.0/16
