# k8s/asgard/infrastructure/vault/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: hashicorp
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.releases.hashicorp.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.32.0"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  install:
    createNamespace: false
  values:
    global:
      enabled: true

    server:
      replicas: 3

      resources:
        requests:
          memory: 256Mi
          cpu: 250m
        limits:
          memory: 512Mi
          cpu: 500m

      statefulSet:
        securityContext:
          pod:
            fsGroup: 1000
            runAsGroup: 1000
            runAsUser: 100
            runAsNonRoot: false

      extraInitContainers:
        - name: vault-data-chown
          image: busybox
          command:
            - sh
            - -c
            - chown -R 100:1000 /vault/data && chmod 750 /vault/data
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: data
              mountPath: /vault/data

      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              tls_disable = 1
              address = "[::]:8200"
              cluster_address = "[::]:8201"
            }

            storage "raft" {
              path = "/vault/data"
            }

            seal "awskms" {}

            service_registration "kubernetes" {}

      extraSecretEnvironmentVars:
        - envName: AWS_ACCESS_KEY_ID
          secretName: vault-unseal
          secretKey: AWS_ACCESS_KEY_ID
        - envName: AWS_SECRET_ACCESS_KEY
          secretName: vault-unseal
          secretKey: AWS_SECRET_ACCESS_KEY
        - envName: AWS_REGION
          secretName: vault-unseal
          secretKey: AWS_REGION
        - envName: VAULT_AWSKMS_SEAL_KEY_ID
          secretName: vault-unseal
          secretKey: VAULT_AWSKMS_SEAL_KEY_ID

      dataStorage:
        enabled: true
        size: 5Gi
        storageClass: "synology-csi-iscsi-retain"

      affinity: |
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
                  component: server
              topologyKey: kubernetes.io/hostname

    injector:
      enabled: false

    ui:
      enabled: true
      serviceType: LoadBalancer
