# k8s/asgard/infrastructure/synology-csi/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: synology-csi
  namespace: flux-system
spec:
  interval: 24h
  url: https://christian-schlichtherle.github.io/synology-csi-chart
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: synology-csi
  namespace: synology-csi
spec:
  interval: 30m
  chart:
    spec:
      chart: synology-csi
      version: "0.11.1"
      sourceRef:
        kind: HelmRepository
        name: synology-csi
        namespace: flux-system
  install:
    createNamespace: false
  values:
    clientInfoSecret:
      name: synology-csi
    storageClasses:
      nfs-retain:
        disabled: true
      nfs-delete:
        disabled: true
      iscsi-retain:
        # No default StorageClass post-storage-redesign (2026-05-30). With four
        # tiers live (iscsi / iscsi-vol2 / nfs-client / local-path), a PVC that
        # omits storageClassName must FAIL to bind rather than silently inherit
        # a block LUN against the DS223J ~10-LUN cap. Every PVC names its tier
        # explicitly (verified: all live PVCs + in-repo manifests do).
        # See docs/procedures/synology-storage-redesign.md.
        isDefault: false
        parameters:
          protocol: iscsi
          dsm: "10.0.254.20"
        reclaimPolicy: Retain
      # Volume2 = dedicated, right-sized iSCSI volume (storage redesign
      # 2026-05-30). `location` pins LUN creation to /volume2; without it
      # the driver auto-selects (which is how all 10 LUNs landed on
      # /volume1). Target for the PVC migration off the oversized Volume1.
      # Per-volume LUN cap is 10 — this volume holds the 10 migrated LUNs
      # and is then closed to new workloads (next volume gets its own SC).
      # See docs/procedures/synology-storage-redesign.md.
      iscsi-retain-vol2:
        parameters:
          protocol: iscsi
          dsm: "10.0.254.20"
          location: /volume2
        reclaimPolicy: Retain
      iscsi-delete:
        disabled: true
      smb-retain:
        disabled: true
      smb-delete:
        disabled: true
