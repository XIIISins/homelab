# k8s/asgard/infrastructure/garage/layout-init-job.yaml
#
# One-shot layout assign — Garage requires `garage layout assign` +
# `garage layout apply` after first start before any S3 traffic is
# served. The CLI is idempotent: if the layout is already current at
# the requested version, the second `apply` is a no-op.
#
# Why a Job (not a postStart hook):
#   - postStart blocks pod Ready until it returns; layout init failures
#     would mask the actual Garage start
#   - a Job has its own retry semantics + visible state (Completed vs
#     Failed) which makes debugging clearer
#   - Flux preserves the Completed Job indefinitely; idempotent re-runs
#     are a `kubectl delete job garage-layout-init && flux reconcile`
#     away if we ever need to re-assign (e.g. cluster grows to N nodes)
#
# Resource lifecycle: the Job runs once at first deploy. The garage
# binary inside the Job's container reuses the same image as the
# StatefulSet pod; talks to it over the cluster's RPC by reading
# /etc/garage.toml (same ConfigMap) + GARAGE_RPC_SECRET (same Secret).
apiVersion: batch/v1
kind: Job
metadata:
  name: garage-layout-init
  namespace: garage
spec:
  # Job retries the pod on failure (e.g. Garage not yet Ready); cap at
  # 10 attempts so a genuinely broken layout doesn't loop forever.
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-layout-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: layout
          image: dxflrs/garage:v2.3.0
          command:
            - sh
            - -c
            - |
              set -euo pipefail

              # Wait for the StatefulSet pod's admin endpoint to be
              # reachable. The Job pod and garage-0 share the namespace
              # so the headless DNS resolves.
              echo "Waiting for garage-0 admin endpoint..."
              for i in $(seq 1 60); do
                if /garage status >/dev/null 2>&1; then
                  echo "garage-0 reachable"
                  break
                fi
                sleep 2
              done
              /garage status || { echo "garage-0 never came up"; exit 1; }

              # If layout is already applied at version >= 1, nothing
              # to do. `layout show` exits 0 with "No staged changes"
              # when current; check by inspecting current_version.
              CURRENT_VERSION=$(/garage layout show 2>&1 | awk '/Current version:/ {print $3}')
              if [ "${CURRENT_VERSION:-0}" -ge 1 ]; then
                echo "Layout already at version $CURRENT_VERSION — nothing to do"
                exit 0
              fi

              # Discover the node ID. `node id` returns
              # <id>@<public-addr> on a single line.
              NODE_ID=$(/garage node id -q | cut -d'@' -f1)
              echo "Assigning layout to node $NODE_ID..."
              /garage layout assign -z dc1 -c 200G "$NODE_ID"
              /garage layout apply --version 1
              echo "Layout applied at version 1"
          env:
            # Identical env shape as the StatefulSet pod so the CLI
            # talks to the same cluster.
            - name: GARAGE_RPC_HOST
              value: "garage-0.garage-headless.garage.svc.cluster.local:3901"
          envFrom:
            - secretRef:
                name: garage-server
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: garage-config
