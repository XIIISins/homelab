# k8s/asgard/infrastructure/garage/externalsecret.yaml
#
# Garage server secrets — rpc_secret (cluster RPC auth, even single-node
# requires it set) + admin_token (admin API auth, consumed by the
# jkossis/garage Terraform provider). Both minted by terraform/vault/
# (random_password.garage_rpc_secret + .garage_admin_token) and written
# to Vault at secret/k8s/garage/server.
#
# Garage honors GARAGE_RPC_SECRET + GARAGE_ADMIN_TOKEN env-var overrides
# (Garage's own config-file → env-var precedence rule), so the static
# garage.toml stays secret-free.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-server
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: garage-server
    template:
      engineVersion: v2
      data:
        GARAGE_RPC_SECRET:   "{{ .rpc_secret }}"
        GARAGE_ADMIN_TOKEN:  "{{ .admin_token }}"
  data:
    - secretKey: rpc_secret
      remoteRef:
        key: k8s/garage/server
        property: rpc_secret
    - secretKey: admin_token
      remoteRef:
        key: k8s/garage/server
        property: admin_token
