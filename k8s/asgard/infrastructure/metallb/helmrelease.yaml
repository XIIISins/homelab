# k8s/asgard/infrastructure/metallb/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 24h
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: false
  values:
    # L2-only (no BGPPeer/BGPAdvertisement resources exist). From 0.16 the
    # chart defaults to the bundled frr-k8s subchart (extra DaemonSet + webhook)
    # and the speaker's FRR sidecars are deprecated. Turn both off -> native
    # mode: one lean speaker container per node, no FRR pods, no extra CPU
    # requests on workers (which are ~85-90 % requested, see
    # known-issues/k8s-scheduling.md). Re-enable frrk8s only if BGP is adopted.
    frrk8s:
      enabled: false
    # Phase 10i (2026-10-05): requests where the chart set none, from 30 days of
    # VictoriaMetrics history. CPU = max(1.5 x median daily p95, worst-day p95),
    # floor 10m; memory = 1.2 x the 30-day max working set. No limits added.
    controller:
      resources: # 30d: CPU p95 1-9m, max 124Mi
        requests: {cpu: 10m, memory: 160Mi}
    speaker:
      frr:
        enabled: false
      resources: # 30d: CPU p95 2-8m, max 95Mi (runs on the CPs too)
        requests: {cpu: 10m, memory: 128Mi}
