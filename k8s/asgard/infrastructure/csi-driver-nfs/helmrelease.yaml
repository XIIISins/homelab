# k8s/asgard/infrastructure/csi-driver-nfs/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: csi-driver-nfs
  namespace: flux-system
spec:
  interval: 24h
  url: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: csi-driver-nfs
spec:
  interval: 30m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.2" # concrete pin (CLAUDE.md no-floats rule)
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    createNamespace: false
  values:
    # File-class K8s storage, sidesteps the Synology ~10-LUN iSCSI cap
    # (NFS shares aren't LUNs). Single Synology share `k8s-nfs` on Volume1;
    # the driver creates ONE SUBDIRECTORY per PV inside it — NOT a Synology
    # shared folder per PV (that's synology-csi's NFS mode, which pollutes
    # the Shared Folder overview and is deliberately avoided here).
    # See docs/procedures/synology-storage-redesign.md (storage tiering).
    storageClass:
      create: true
      name: nfs-client
      parameters:
        server: "10.0.254.20"
        share: /volume1/k8s-nfs
        # subDir defaults to pvc-<uuid> — one plain dir per PV inside the share.
        mountPermissions: "0755"
      # Retain mirrors the iSCSI SC: deleting a PVC leaves its subdir in the
      # share (manual cleanup) rather than auto-deleting data. Safe default
      # for stateful data + the migration window.
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4.1
        - hard
