# k8s/asgard/infrastructure/sealed-secrets/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 24h
  # GitHub Pages index moved org bitnami-labs → bitnami (the old
  # bitnami-labs.github.io/sealed-secrets path now 404s). The chart +
  # project are unchanged; only the Pages host moved. (audit 2026-06-18)
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: sealed-secrets
      version: "2.20.0"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
  install:
    createNamespace: true
  values:
    fullnameOverride: sealed-secrets-controller
    # Phase 10i (2026-10-05): requests where the chart set none, from 30 days of
    # VictoriaMetrics history. CPU = max(1.5 x median daily p95, worst-day p95),
    # floor 10m; memory = 1.2 x the 30-day max working set. No limits added.
    resources: # 30d: CPU p95 <=2m, max 100Mi
      requests: {cpu: 10m, memory: 128Mi}
