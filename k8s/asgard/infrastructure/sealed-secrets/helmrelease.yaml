# k8s/asgard/infrastructure/sealed-secrets/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: sealed-secrets
  namespace: flux-system
spec:
  interval: 24h
  # GitHub Pages index moved org bitnami-labs → bitnami (the old
  # bitnami-labs.github.io/sealed-secrets path now 404s). The chart +
  # project are unchanged; only the Pages host moved. (audit 2026-06-18)
  url: https://bitnami.github.io/sealed-secrets
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: sealed-secrets
      version: "2.18.6"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
  install:
    createNamespace: true
  values:
    fullnameOverride: sealed-secrets-controller
