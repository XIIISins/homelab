# k8s/asgard/infrastructure/local-path-provisioner/helmrelease.yaml
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 24h
  url: https://github.com/rancher/local-path-provisioner
  # Rancher publishes no Helm repo index (unlike csi-driver-nfs), so the chart
  # is sourced straight from the upstream git tag — concrete-pinned per the
  # CLAUDE.md no-floats rule. Bump = move this tag + the image tags below.
  ref:
    tag: v0.0.36
  ignore: |
    # Pull only the chart dir (smaller clone); exclude everything else.
    /*
    !/deploy/chart/local-path-provisioner
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 30m
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  install:
    createNamespace: false
  values:
    # Node-local storage for app-replicated state (Vault Raft, Class L in the
    # storage tiering plan). K3s' built-in local-storage provisioner is disabled
    # in our CP config; this is the Flux-managed replacement. Data lands on a
    # dedicated 50G scsi1 data disk on each worker, mounted container-writable
    # at /data by the local-path-disk Ansible role (separate from the OS disk,
    # so it survives a VM rebuild). See docs/procedures/synology-storage-redesign.md.
    image:
      repository: docker.io/rancher/local-path-provisioner
      tag: v0.0.36 # concrete pin (matches chart appVersion / git tag)
    helperImage:
      # Chart default is the floating busybox:latest — pin per CLAUDE.md no-floats.
      repository: docker.io/library/busybox
      tag: "1.37.0"
    storageClass:
      create: true
      name: local-path
      # NOT the default class — explicit per-workload SC naming. The iSCSI
      # synology-csi-iscsi-retain stays default (Stage 4 revisits dropping it).
      defaultClass: false
      # Retain (not Delete): a released/deleted PVC must NOT wipe its node-local
      # host dir. The tier now backs single-replica workloads (VictoriaLogs,
      # VictoriaMetrics) with no app-level replication, so auto-delete-on-release
      # would be irreversible data loss + a migration footgun. (The original
      # Delete rationale — "Raft is the durability layer" — only held while this
      # was Vault-only.) Tradeoff: orphan dirs persist on /data after a PVC
      # delete and need an occasional manual sweep per worker. Changing this on
      # a live SC needs delete+recreate (reclaimPolicy is immutable).
      reclaimPolicy: Retain
      # WaitForFirstConsumer: bind the PV on the node the consuming pod schedules
      # onto — load-bearing for node-local storage (prevents cross-node binding).
      volumeBindingMode: WaitForFirstConsumer
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /data
