# k8s/asgard/apps/startpage/externalsecret.yaml
#
# Read-only SSH deploy key for the private XIIISins/startpage repo, plus a
# pinned github.com known_hosts entry. Consumed by the git-clone init
# container in deployment.yaml — NOT by Caddy itself.
#
# Vault path secret/k8s/startpage/deploy-key is operator-minted (ssh-keygen
# → `gh repo deploy-key add` for the public half, `vault kv put` for the
# private half), same shape as the Hermod operator-minted secrets. It is NOT
# TF-managed: ssh-keygen output isn't a random_password, so terraform/vault/
# doesn't own it. Mirror lives in 1P "[Asgard] - Startpage - GitHub deploy key".
#
# Fields:
#   ssh-privatekey — the ed25519 private key (read-only deploy key)
#   known_hosts    — `ssh-keyscan github.com` output, so the clone uses
#                    StrictHostKeyChecking=yes with no TOFU prompt.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: startpage-deploy-key
  namespace: startpage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: startpage-deploy-key
    template:
      engineVersion: v2
      data:
        ssh-privatekey: "{{ .ssh_privatekey }}"
        known_hosts: "{{ .known_hosts }}"
  data:
    - secretKey: ssh_privatekey
      remoteRef:
        key: k8s/startpage/deploy-key
        property: ssh-privatekey
    - secretKey: known_hosts
      remoteRef:
        key: k8s/startpage/deploy-key
        property: known_hosts
