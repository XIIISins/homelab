# k8s/asgard/apps/startpage/externalsecret.yaml
#
# Pull credential for the private ghcr.io/xiiisins/startpage image, rendered
# as a kubernetes.io/dockerconfigjson Secret for the Deployment's
# imagePullSecrets.
#
# Vault path secret/k8s/startpage/ghcr is operator-minted (a classic PAT with
# only read:packages; GitHub's container registry does not accept fine-grained
# PATs or the repo deploy key). Not TF-managed. Mirror in 1P.
#
# Fields:
#   username — GitHub user that owns the PAT
#   token    — the PAT
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: startpage-ghcr-pull
  namespace: startpage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: startpage-ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: k8s/startpage/ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: k8s/startpage/ghcr
        property: token
