# k8s/asgard/apps/startpage/deployment.yaml
#
# Personal startpage: a static site baked into an nginx image by the
# XIIISins/startpage repo's CI (ghcr.io/xiiisins/startpage, tags `latest` and
# `sha-<short>` on every push to master).
#
# Updating the page: merge to the startpage repo's master, wait for its
# `image` workflow, then bump the sha tag below in a PR. The tag is pinned (not
# `latest`) so a rollout is a reviewed git change and Flux reverts cleanly.
# The rolling update (maxSurge 0 / maxUnavailable 1) keeps the service up.
#
# The image is private; the pull credential comes from Vault via ESO
# (externalsecret.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: startpage
  namespace: startpage
spec:
  # 3 replicas, one per worker — anti-affinity below pins them across the
  # three K3s workers (operator request). Tiny stateless service.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # required anti-affinity + 3 replicas across exactly 3 workers means
      # there's no 4th slot to surge into — maxSurge MUST be 0 or rollouts
      # deadlock (CLAUDE.md "Required pod anti-affinity + RollingUpdate").
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: startpage
  template:
    metadata:
      labels:
        app: startpage
    spec:
      imagePullSecrets:
        - name: startpage-ghcr-pull
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - startpage
              topologyKey: kubernetes.io/hostname
      containers:
        - name: startpage
          image: ghcr.io/xiiisins/startpage:sha-c1203d4
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          # nginx has no /healthz; the index page is the health signal.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
