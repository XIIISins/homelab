# k8s/jotunheim/apps/victoriametrics/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoriametrics
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.38.0" # chart 0.38.0 → vmsingle v1.x (single-binary mode)
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    # Single-instance VictoriaMetrics. For homelab scale (low hundreds
    # of series), vmsingle is the right choice — vmcluster adds shard
    # complexity that we don't need. Migrate to vmcluster only if
    # ingest > 100k samples/sec or retention > 1 year.
    server:
      enabled: true
      # local-path (storage redesign 2026-05-30): VictoriaMetrics mmaps its
      # storage + NFS is the documented Synology panic case (#61), so it
      # belongs on local xfs, NOT NFS; single-replica, so iSCSI's network
      # block bought nothing. Node-pinned to einherjar-verd (spread from VL
      # on urd) via the bound PV's nodeAffinity. Data migrated via rsync
      # static-rebind (362 files, checksums verified). Right-sized 100Gi→20Gi
      # (1-month retention; Zabbix owns long-term trends; local-path advisory,
      # backed by the 50G /data disk).
      # NB: chart key is `storageClassName` (NOT `storageClass` — silently
      # ignored; the old iSCSI binding came from the cluster-DEFAULT SC). Set
      # explicitly so the VCT pins local-path, not a default-iSCSI fallback.
      # Redundancy note: this is single-instance + node-pinned (no cross-node
      # self-heal); recovery floor is PBS daily backup of the worker /data
      # disk. Acceptable for refillable observability; NOT a template for
      # availability-critical single-instance data — that needs app-level
      # replication. See feedback_app_level_redundancy.
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: 20Gi
      retentionPeriod: "1" # months — long-term low-res infra trends are covered by Zabbix; VM downsampling is Enterprise-only (storage redesign 2026-05-30)
      # Resource sizing — VM is single-binary, light. Bump if homelab
      # grows enough to spike ingest.
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { cpu: 1000m, memory: 2Gi }
      # Expose VM via a ClusterIP Service (default). HTTPRoute below
      # wires the external hostname → this Service.
      service:
        type: ClusterIP
      # Anti-affinity preferred (not required) — single replica anyway,
      # but if scaled to >1 keeps them apart.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: victoria-metrics-single
                topologyKey: kubernetes.io/hostname
      # ServiceMonitor for self-scraping. Adds VM's own metrics to the
      # TSDB once it's up. Enable after Phase 6 puts a Prometheus
      # operator (or vmoperator) in place; defaults to false here
      # because the CRD doesn't exist on a fresh cluster.
      serviceMonitor:
        enabled: false

      # vmui custom dashboards — JSON files mounted via the
      # vmui-dashboards ConfigMap (generated by kustomization.yaml's
      # configMapGenerator). The chart's `extraArgs` puts the flag on
      # vmsingle's command line; `extraVolumes` + `extraVolumeMounts`
      # mount the ConfigMap at /vmui-dashboards. Updating a JSON file
      # in dashboards/ → kustomize re-renders the ConfigMap → vmsingle
      # pod restart picks it up (flag is read at startup).
      extraArgs:
        vmui.customDashboardsPath: /vmui-dashboards
      extraVolumes:
        - name: vmui-dashboards
          configMap:
            name: vmui-dashboards
      extraVolumeMounts:
        - name: vmui-dashboards
          mountPath: /vmui-dashboards
          readOnly: true

    # vmalert + alertmanager — disabled for first deploy. Enable when
    # alerting rules are needed. Pairs naturally with Zabbix in our
    # setup (Zabbix is the alerting layer for infra, VM is the
    # metrics-database layer for K8s).
    vmalert:
      enabled: false
    alertmanager:
      enabled: false
