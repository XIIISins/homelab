# k8s/asgard/apps/victorialogs/helmrelease.yaml
#
# VictoriaLogs (single-instance) — log storage + query engine.
# Replaces Loki in our homelab per the CLAUDE.md architectural
# invariant.
#
# Reuses the `victoriametrics` HelmRepository declared next door
# (same chart collection at oci://ghcr.io/victoriametrics/helm-charts).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: victoria-logs-single
      version: "0.12.5" # chart 0.12.5 → vlsingle v1.x
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: monitoring
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    server:
      enabled: true
      persistentVolume:
        enabled: true
        # local-path (storage redesign 2026-05-30): VictoriaLogs mmaps its
        # storage + is the documented Synology-NFS panic case (#61), so it
        # belongs on local xfs, NOT NFS — and it's single-replica so iSCSI's
        # network block bought nothing. node-pinned to einherjar-urd via the
        # bound PV's nodeAffinity. Data migrated via rsync (22450 files,
        # checksums verified). Right-sized 50Gi→20Gi (local-path advisory;
        # backed by the 50G /data disk). If 30d ingest outgrows it, grow the
        # /data disk + bump here.
        # NB: the chart key is `storageClassName` (NOT `storageClass` — that's
        # silently ignored; the old iSCSI binding came from the cluster-DEFAULT
        # SC, not this value). Set it explicitly so the VCT pins local-path
        # instead of defaulting a future PVC back to iSCSI.
        storageClassName: local-path
        size: 20Gi
      retentionPeriod: "30d"
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits: { cpu: 1000m, memory: 2Gi }
      service:
        type: ClusterIP
        # Chart's primary Service is headless (clusterIP: None) for
        # StatefulSet pod discovery. A SECOND, non-headless Service
        # for client access lives in victorialogs-ingest-service.yaml
        # — it's what K3s host-network vlagent dials (host can't reach
        # the MetalLB VIP from host namespace).

      # Anti-affinity preferred (not required) — single replica today,
      # but if scaled to >1 keeps them apart.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: victoria-logs-single
                topologyKey: kubernetes.io/hostname

      # Self-scraping requires the (Victoria) operator's CRDs — off
      # for first deploy, enable after Phase 7b's vm-operator lands.
      serviceMonitor:
        enabled: false

      # Synology CSI iSCSI volumes don't honor `securityContext.fsGroup`
      # — see CLAUDE.md "Storage / iSCSI / Synology CSI" gotchas. The
      # chart's pod runs as runAsUser=1000 / fsGroup=2000 but the ext4
      # LUN gets formatted root-owned, so the runtime user can't create
      # /storage/flock.lock and the pod panics on first boot with:
      #   FATAL: cannot create lock file: ... permission denied
      # Pattern (same class as Vault's vault-data-chown, Authentik's
      # redis-data-chown): busybox initContainer as UID 0 chowns the
      # mount dir to the runtime UID:GID before the main container.
      # Chart values key is `server.initContainers` (NOT `extraInitContainers`
      # — that key is silently ignored by victoria-logs-single chart 0.12.5).
      initContainers:
        - name: vl-data-chown
          image: busybox
          command:
            - sh
            - -c
            - chown -R 1000:2000 /storage && chmod 750 /storage
          volumeMounts:
            - name: server-volume
              mountPath: /storage
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
