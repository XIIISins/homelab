# k8s/asgard/apps/microbin/externalsecret.yaml
#
# MicroBin admin credentials. The /admin interface (gated additionally by
# Authentik ForwardAuth at Traefik) needs these to function — it's the
# trusted-janitor cleanup tool. Shared among the paste-janitors crew.
#
# Vault path secret/k8s/microbin/admin is TF-minted (terraform/vault/
# main.tf — random_password). Fields: username, password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: microbin-admin
  namespace: microbin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: microbin-admin
    template:
      engineVersion: v2
      data:
        MICROBIN_ADMIN_USERNAME: "{{ .username }}"
        MICROBIN_ADMIN_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: k8s/microbin/admin
        property: username
    - secretKey: password
      remoteRef:
        key: k8s/microbin/admin
        property: password
