# k8s/asgard/apps/microbin/httproute.yaml
#
# Routes paste.xiiisins.com to MicroBin, with PARTIAL auth. Gateway API
# longest-prefix matching means the specific /pastalist + /admin rules win
# over the / catchall, so only those two carry the Authentik ForwardAuth
# middleware — everything else (create, view-by-URL, upload, /static) is
# open/anonymous. (This is the inverse of the VictoriaLogs route, which
# exempts /insert from an otherwise-gated app.)
#
# External-only: apex zone is Cloudflare-resolved. Public path is
#   client → Cloudflare edge → tunnel → cloudflared → Traefik → here.
# CF CNAME: cloudflare_dns_record.microbin (terraform/cloudflare/main.tf).
# cloudflared rule: k8s/asgard/infrastructure/cloudflared/configmap.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: microbin
  namespace: microbin
spec:
  parentRefs:
    - name: midgard
      namespace: traefik
      sectionName: websecure-apex-wildcard
  hostnames:
    - "paste.xiiisins.com"
  rules:
    # Gated: the paste index (browse titles/metadata for janitor cleanup).
    - matches:
        - path:
            type: PathPrefix
            value: /pastalist
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: microbin
          port: 80
    # Gated: the admin interface (the only deletion path, EDITABLE=false).
    - matches:
        - path:
            type: PathPrefix
            value: /admin
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: authentik-forward-auth
      backendRefs:
        - name: microbin
          port: 80
    # Open: everything else — anonymous create/view/upload + static assets.
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: microbin
          port: 80
