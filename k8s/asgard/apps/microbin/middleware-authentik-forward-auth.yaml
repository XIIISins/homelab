# k8s/asgard/apps/microbin/middleware-authentik-forward-auth.yaml
#
# Traefik ForwardAuth Middleware for the gated MicroBin routes
# (/pastalist + /admin). Same shape as the shared monitoring one — calls
# Authentik's embedded outpost; a same-namespace copy is needed because
# HTTPRoute extensionRef → Middleware resolves within the route's namespace.
#
# Authenticated + in the paste-janitors group → 200; otherwise → 302 to
# the Authentik auth flow. The provider's external_host (paste.xiiisins.com,
# see terraform/authentik/microbin.tf) is matched from X-Forwarded-Host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: microbin
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      - X-authentik-entitlements
