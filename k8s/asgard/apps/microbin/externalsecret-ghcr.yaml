# k8s/asgard/apps/microbin/externalsecret-ghcr.yaml
#
# GHCR pull credentials for the private custom image
# ghcr.io/xiiisins/microbin-homelab (see deployment.yaml). GitHub has no API
# to make a package public (UI-only), so we keep it private and pull with a
# read-only token instead — the deployment references this secret via
# imagePullSecrets.
#
# Vault path secret/k8s/microbin/ghcr is OPERATOR-WRITTEN (not TF-minted —
# it's an external GitHub PAT, which Terraform can't generate without the
# value landing in state). LAYOUT: a single field whose KEY is the GitHub
# username (`XIIISins`) and whose VALUE is a classic PAT scoped `read:packages`.
# Mirror to 1P per the offline-backup discipline. (If this is ever re-minted,
# a cleaner `username`/`token` two-field layout is fine too — just repoint the
# remoteRef.property + the templated username below.)
#
# ESO renders a kubernetes.io/dockerconfigjson secret. The GHCR username is
# the GitHub account (not secret), hardcoded here; only the token is pulled
# from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: microbin-ghcr
  namespace: microbin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: microbin-ghcr
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"XIIISins","password":"{{ .token }}","auth":"{{ printf "XIIISins:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: k8s/microbin/ghcr
        property: XIIISins
