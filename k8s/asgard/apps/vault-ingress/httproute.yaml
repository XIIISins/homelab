# k8s/asgard/apps/vault-ingress/httproute.yaml
#
# Routes vault.niflheim.xiiisins.com to the Vault UI Service (vault-ui in
# the vault namespace, created by the Vault Helm chart). Internal-only —
# attaches to the niflheim Gateway's HTTPS listener; no midgard/apex
# exposure (the Vault UI/API must never be reachable off-LAN).
#
# Traefik terminates the client TLS with the *.niflheim wildcard, then
# re-encrypts to the backend: Vault's listener is TLS-only (internal CA),
# and backendtlspolicy.yaml tells Traefik to verify it. Backend is in this
# (vault) namespace → no ReferenceGrant; the
# cross-namespace parent attachment to traefik/niflheim is allowed by the
# Gateway's allowedRoutes.namespaces.from: All.
#
# vault-ui selects all three server pods; Vault standby request-forwarding
# (cluster port 8201) transparently routes to the active node — identical
# behavior to the prior MetalLB 10.0.20.11 path, just Traefik-fronted.
#
# NOTE: vault-ui is KEPT as a LoadBalancer (10.0.20.11) deliberately (Phase
# 6 Stage 1 decision) — this route is the primary FQDN path (VAULT_ADDR),
# .11 is the Traefik-independent break-glass path. Both now serve HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault-ui
  namespace: vault
spec:
  parentRefs:
    - name: niflheim
      namespace: traefik
      sectionName: websecure
  hostnames:
    - vault.niflheim.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vault-ui
          port: 8200
