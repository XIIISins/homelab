# k8s/asgard/apps/semaphore/externalsecret.yaml
#
# Single ExternalSecret — Semaphore consumes all values at pod start;
# no early-bind subset (contrast with outline-redis-secret split for
# day-1 Redis). The pod sits in CreateContainerConfigError until all
# three Vault paths exist:
#   - secret/k8s/semaphore/postgres-password — terraform/vault/main.tf
#   - secret/k8s/semaphore/app                — terraform/vault/main.tf
#   - secret/k8s/semaphore/oidc               — terraform/authentik/semaphore.tf
# Order: vault TF first (mints postgres-password + app), then authentik
# TF (mints oidc). Both must apply before the pod can render its env.
#
# Why JSON-in-env for OIDC: Semaphore v2.x reads OIDC providers from
# either a config file (`oidc_providers:` map in semaphore.yml) or the
# SEMAPHORE_OIDC_PROVIDERS env var as a JSON object. Env-var is the
# cleaner K8s shape — keeps the client_secret inside the rendered
# Secret rather than scattered between a ConfigMap (other config) +
# this Secret (the secret). Sprig's `toJson` would over-quote; the
# template builds the JSON literally.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-app
  namespace: semaphore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: semaphore-app
    template:
      engineVersion: v2
      data:
        # ── Core ──────────────────────────────────────────────────
        # Public URL of the Semaphore UI. Drives the OIDC redirect_url
        # baked into the OIDC providers JSON below. Internal-only;
        # no midgard / apex alias.
        SEMAPHORE_WEB_HOST:    "https://semaphore.niflheim.xiiisins.com"
        SEMAPHORE_COOKIE_SECURE: "true"

        # ── Database (Patroni HAProxy VIP) ────────────────────────
        # Semaphore is a Go app using lib/pq; `sslmode=require` works
        # correctly against self-signed certs (unlike the Outline
        # Node/sequelize case that needs `no-verify`). See CLAUDE.md
        # "Modern Node `pg-connection-string` + `sequelize` treats
        # `sslmode=require` as `verify-full`" — Go-side libs honor
        # the libpq spec.
        #
        # SSL config goes through SEMAPHORE_DB_OPTIONS (JSON-encoded
        # map of libpq options), NOT a SEMAPHORE_DB_SSL_MODE env var
        # — Semaphore silently ignores unknown env vars, config.json
        # gets written without sslmode, libpq defaults to no-SSL,
        # Patroni's hostssl-only pg_hba rejects with the misleading
        # "no encryption" message (same class as the existing PG
        # "hostssl-only rejects plaintext clients" CLAUDE.md gotcha).
        SEMAPHORE_DB_DIALECT: "postgres"
        SEMAPHORE_DB_HOST:    "10.0.10.210"
        SEMAPHORE_DB_PORT:    "5432"
        SEMAPHORE_DB_USER:    "semaphore"
        SEMAPHORE_DB_NAME:    "semaphore"
        SEMAPHORE_DB_OPTIONS: '{"sslmode":"require"}'
        SEMAPHORE_DB_PASS:    "{{ .postgres_password }}"

        # ── Crypto keys (stable across pod restarts) ───────────────
        # access_key_encryption: AES key for at-rest encryption of
        #   Semaphore-stored access keys (SSH keys, Vault AppRole
        #   creds, etc.). Rotation = re-enter every access key in
        #   the UI; treat as long-lived.
        # cookie_hash: HMAC key for session cookies. Rotation =
        #   invalidate all live sessions.
        SEMAPHORE_ACCESS_KEY_ENCRYPTION: "{{ .access_key_encryption }}"
        SEMAPHORE_COOKIE_HASH:           "{{ .cookie_hash }}"

        # ── Initial admin (break-glass) ────────────────────────────
        # Semaphore requires a local admin user to exist at bootstrap
        # — used only as the break-glass account when OIDC is down.
        # Password is a one-shot from Vault (operator can rotate via
        # `semaphore-cli user change-by-login`); routine login is OIDC.
        SEMAPHORE_ADMIN:          "admin"
        SEMAPHORE_ADMIN_EMAIL:    "ghost@xiiisins.com"
        SEMAPHORE_ADMIN_NAME:     "Local admin"
        SEMAPHORE_ADMIN_PASSWORD: "{{ .admin_password }}"

        # ── OIDC providers (Authentik) ────────────────────────────
        # JSON object — Semaphore parses on startup. Single provider
        # keyed "authentik" → callback URL becomes
        # /api/auth/oidc/authentik/redirect (path matched by
        # terraform/authentik/semaphore.tf allowed_redirect_uris).
        #
        # username_claim "email" matches the Outline pattern; Authentik
        # emits an `email` claim in the OIDC profile scope.
        #
        # role_claim is the Authentik "groups" claim; role_mapping
        # maps the `semaphore-admins` group to Semaphore's `admin`
        # role for first-login auto-elevation. Members of any other
        # group land as `user` (Semaphore's default unmapped role).
        SEMAPHORE_OIDC_PROVIDERS: |
          {
            "authentik": {
              "display_name": "Authentik",
              "provider_url": "{{ .oidc_issuer_url }}",
              "client_id":    "{{ .oidc_client_id }}",
              "client_secret": "{{ .oidc_client_secret }}",
              "redirect_url": "https://semaphore.niflheim.xiiisins.com/api/auth/oidc/authentik/redirect",
              "scopes":       ["openid", "profile", "email"],
              "username_claim": "email",
              "name_claim":     "name",
              "email_claim":    "email"
            }
          }
  data:
    # k8s/semaphore/postgres-password (terraform/vault/main.tf)
    - secretKey: postgres_password
      remoteRef:
        key: k8s/semaphore/postgres-password
        property: value

    # k8s/semaphore/app (terraform/vault/main.tf)
    - secretKey: access_key_encryption
      remoteRef:
        key: k8s/semaphore/app
        property: access_key_encryption
    - secretKey: cookie_hash
      remoteRef:
        key: k8s/semaphore/app
        property: cookie_hash
    - secretKey: admin_password
      remoteRef:
        key: k8s/semaphore/app
        property: admin_password

    # k8s/semaphore/oidc (terraform/authentik/semaphore.tf)
    - secretKey: oidc_client_id
      remoteRef:
        key: k8s/semaphore/oidc
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: k8s/semaphore/oidc
        property: client_secret
    - secretKey: oidc_issuer_url
      remoteRef:
        key: k8s/semaphore/oidc
        property: issuer_url
