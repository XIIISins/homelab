# k8s/asgard/apps/semaphore/externalsecret.yaml
#
# Single ExternalSecret rendering the full Semaphore config.json from
# Vault. The pod mounts this Secret's `config.json` key directly into
# /etc/semaphore/config.json (subPath) — bypasses Semaphore's setup
# command entirely.
#
# Why: Semaphore's `setup` (the env→config.json translator) only
# carries a small subset of fields through, silently dropping
# oidc_providers, port, web_host, and others. SEMAPHORE_OIDC_PROVIDERS
# arrives as a valid JSON env var in the pod, jq parses it cleanly,
# but Semaphore's setup writer omits it from /etc/semaphore/config.json
# → no OIDC routes registered → /api/auth/oidc/<key>/auth/login 404.
# Mounting config.json directly is the cleanest workaround.
#
# Three Vault paths feed this template (same readiness windows as
# Outline's split — keep on one ExternalSecret since Semaphore can't
# start without ALL of them anyway):
#   - secret/k8s/semaphore/postgres-password — terraform/vault/main.tf
#   - secret/k8s/semaphore/app                — terraform/vault/main.tf
#                                               (access_key_encryption,
#                                                cookie_hash,
#                                                cookie_encryption)
#   - secret/k8s/semaphore/oidc               — terraform/authentik/semaphore.tf
#                                               (client_id, client_secret,
#                                                issuer_url)
#
# Local admin user is NOT in IaC — Semaphore's setup command (which
# would create the admin DB row) is skipped when config.json
# pre-exists. Routine login is OIDC. Break-glass: after first deploy
# the operator can run
#   kubectl exec -n semaphore semaphore-0 -- semaphore user add \
#     --admin --login admin --name 'Local admin' \
#     --email ghost@xiiisins.com --password '<from-vault>'
# if OIDC ever becomes unreachable.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-config
  namespace: semaphore
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: semaphore-config
    template:
      engineVersion: v2
      data:
        # Single key — mounted at /etc/semaphore/config.json by the
        # StatefulSet. Schema follows the JSON tags on Semaphore's
        # util.ConfigType + DbConfig + OidcProvider structs (v2.18.5):
        #   - dialect / postgres.{host,user,pass,name,options}
        #   - port / web_host / tmp_path
        #   - cookie_hash / cookie_encryption / access_key_encryption
        #   - oidc_providers.<key>.{display_name, provider_url,
        #     client_id, client_secret, redirect_url, scopes,
        #     username_claim, name_claim, email_claim}
        config.json: |
          {
            "dialect": "postgres",
            "postgres": {
              "host": "10.0.10.210:5432",
              "user": "semaphore",
              "pass": "{{ .postgres_password }}",
              "name": "semaphore",
              "options": {
                "sslmode": "require"
              }
            },
            "port": ":3000",
            "interface": "",
            "tmp_path": "/tmp/semaphore",
            "web_host": "https://semaphore.niflheim.xiiisins.com",
            "cookie_hash":           "{{ .cookie_hash }}",
            "cookie_encryption":     "{{ .cookie_encryption }}",
            "access_key_encryption": "{{ .access_key_encryption }}",
            "oidc_providers": {
              "authentik": {
                "display_name":  "Authentik",
                "provider_url":  "{{ .oidc_issuer_url }}",
                "client_id":     "{{ .oidc_client_id }}",
                "client_secret": "{{ .oidc_client_secret }}",
                "redirect_url":  "https://semaphore.niflheim.xiiisins.com/api/auth/oidc/authentik/redirect",
                "scopes":        ["openid", "profile", "email"],
                "username_claim": "email",
                "name_claim":     "name",
                "email_claim":    "email"
              }
            }
          }
  data:
    # k8s/semaphore/postgres-password
    - secretKey: postgres_password
      remoteRef:
        key: k8s/semaphore/postgres-password
        property: value

    # k8s/semaphore/app
    - secretKey: access_key_encryption
      remoteRef:
        key: k8s/semaphore/app
        property: access_key_encryption
    - secretKey: cookie_hash
      remoteRef:
        key: k8s/semaphore/app
        property: cookie_hash
    - secretKey: cookie_encryption
      remoteRef:
        key: k8s/semaphore/app
        property: cookie_encryption

    # k8s/semaphore/oidc (terraform/authentik/semaphore.tf)
    - secretKey: oidc_client_id
      remoteRef:
        key: k8s/semaphore/oidc
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: k8s/semaphore/oidc
        property: client_secret
    - secretKey: oidc_issuer_url
      remoteRef:
        key: k8s/semaphore/oidc
        property: issuer_url
