# k8s/asgard/apps/semaphore/statefulset.yaml
#
# Single-replica StatefulSet. State strategy:
#   - Application state (projects, templates, history, access keys) → PG
#     via Patroni VIP. Survives pod restart by virtue of being external.
#   - Inventory cache (jsonfile, 4h TTL) → emptyDir. Same Synology DS223J
#     LUN cap that bit the Outline Redis PVC (CLAUDE.md "Synology
#     DS223J iSCSI LUN cap" — 10/10 in use) made the 11th claim hang
#     Pending. Cache-class state: rebuild = one NetBox API round-trip
#     on next pod start (~30s), acceptable tradeoff to side-step the
#     cap. Mirrors the Outline Redis emptyDir mitigation.
#   - Ansible Galaxy collections → fetched at template-run time into
#     /tmp; no persistence needed.
#
# StatefulSet (not Deployment) kept for naming stability + matches the
# single-replica-emptyDir pattern of Outline Redis + Authentik Redis.
# No actual stable-storage benefit at 1 replica with emptyDir, but
# zero downside either.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: semaphore
  namespace: semaphore
spec:
  serviceName: semaphore
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semaphore
  # Single replica + PG-backed state — RollingUpdate is safe (no
  # cross-replica race). StatefulSet RollingUpdate stalls on a
  # CrashLoopBackOff pod (see CLAUDE.md K8s scheduling gotcha) so any
  # first-deploy iteration needs manual `kubectl delete pod` to break
  # the deadlock. Standard tradeoff.
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semaphore
    spec:
      # Disable legacy service-link env vars. K8s auto-injects
      # <SVC>_SERVICE_HOST / <SVC>_PORT / <SVC>_PORT_<n>_TCP_* for every
      # Service in the namespace; here the `semaphore` Service generates
      # SEMAPHORE_PORT=tcp://<clusterip>:80, which Semaphore reads as
      # its own listen-port config and panics on (expects /^:?[0-9]+$/).
      # Same collision class hits any app whose env-var naming overlaps
      # an in-namespace Service name. enableServiceLinks=false drops
      # the injection entirely — pods that need cross-Service discovery
      # should use DNS (<svc>.<ns>.svc.cluster.local) anyway.
      enableServiceLinks: false
      # emptyDir respects fsGroup natively (the Synology CSI iSCSI
      # fsGroup-not-honored quirk doesn't apply) — pod-level
      # securityContext.fsGroup is sufficient; no chown initContainer
      # needed. Kubelet sets ownership at mount time.
      securityContext:
        fsGroup: 1001
      containers:
        - name: semaphore
          # Custom image (docker/semaphore/Dockerfile → GHCR via
          # .github/workflows/build-semaphore-image.yml). The stock
          # semaphoreui image bundles OLDER collections than our pins, and
          # Semaphore never runs `ansible-galaxy install`, so every play
          # silently ran on the bundle — community.zabbix 2.3.1 vs the pinned
          # 4.2.0 broke the zabbix-agent register-host task (passed from
          # Frigg, failed here). The image installs the pinned collections
          # straight into the ansible venv's site-packages (overwriting the
          # bundle), which is exactly where Ansible's import finder resolves
          # them — Semaphore runs tasks with `collections_path = collections`
          # (empty) and does NOT carry container env vars, so site-packages is
          # the only channel that reaches the task. Runtime pip deps (hvac /
          # psycopg2-binary / pytz) are baked too. Bump the tag in lockstep
          # with IMAGE_TAG in the build workflow + BASE_IMAGE in the Dockerfile
          # whenever requirements.yml moves.
          image: ghcr.io/xiiisins/semaphore-homelab:v2.18.5-ansible2.16.5-r2
          imagePullPolicy: IfNotPresent
          # Deps are baked into the image above, so the old pod-start
          # `pip3 install ... && exec ...` wrapper (~15s/restart) is gone —
          # just exec the stock entrypoint.
          command:
            - /bin/sh
            - -c
            - exec /sbin/tini -- /usr/local/bin/server-wrapper
          # Config lives ENTIRELY in the mounted /etc/semaphore/config.json
          # (rendered by ESO from Vault — see externalsecret.yaml). No
          # envFrom: Semaphore's setup command silently drops fields
          # (oidc_providers, port, web_host, ...) when translating env
          # → config.json, even when the env var is set with valid JSON.
          # Mounting the full file sidesteps setup entirely.
          #
          env:
            # Path of the mounted SSH private key (rendered by the
            # semaphore-ansible-ssh-key ExternalSecret). Ansible reads
            # this for every host connection — Semaphore's
            # project_inventory.ssh_key_id doesn't actually surface
            # the key to the task runtime, so we bring it in directly
            # via a Secret volume mount + this env var.
            - name: ANSIBLE_PRIVATE_KEY_FILE
              value: /etc/ssh-keys/ansible_niflheim
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: inventory-cache
              # Mounted at the path the netbox.netbox.nb_inventory
              # plugin actually writes to (cache_connection in
              # ansible/inventory/netbox.yml = `~/.cache/ansible/
              # netbox-inventory`, and `~` resolves to the
              # semaphore container's HOME=/home/semaphore). Earlier
              # attempts mounted at /var/lib/semaphore/inventory-cache
              # + relied on an ANSIBLE_INVENTORY_CACHE_CONNECTION env
              # var to override the plugin — but that env var doesn't
              # exist in Ansible, and inventory-file `cache_connection`
              # outranks the only real cache-connection env var
              # (ANSIBLE_CACHE_PLUGIN_CONNECTION) anyway, so the
              # cache silently landed at the HOME-relative path while
              # the refresh script wiped a different (empty) location.
              mountPath: /home/semaphore/.cache/ansible/netbox-inventory
            # subPath mount: drops just the `config.json` key from the
            # semaphore-config Secret at /etc/semaphore/config.json
            # without clobbering the rest of /etc/semaphore. Kubelet
            # snapshots subPath mounts at pod start (CLAUDE.md
            # "subPath-mounted ConfigMap/Secret keys do NOT auto-update"
            # gotcha) → rotation requires `kubectl rollout restart sts`.
            - name: config
              mountPath: /etc/semaphore/config.json
              subPath: config.json
              readOnly: true
            # Ansible SSH key — projected by the semaphore-ansible-ssh-key
            # ExternalSecret. defaultMode 0600 on the volume so OpenSSH
            # accepts it (refuses world/group-readable private keys).
            - name: ansible-ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
            # Homelab internal CA (trust-manager-distributed ConfigMap
            # vault-ca-bundle). community.hashi_vault reads it via
            # ANSIBLE_HASHI_VAULT_CA_CERT=/etc/vault-ca/ca.crt (set in the
            # Semaphore project_environment, terraform/semaphore) to verify
            # Vault's TLS-only listener.
            - name: vault-ca
              mountPath: /etc/vault-ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Ansible runs spawn ansible-playbook subprocesses inside
              # the same container; memory ceiling tuned for a fleet
              # the size of niflheim (~25 hosts) running site.yml
              # under --check. Bump if a per-template run OOMs.
              memory: 1Gi
          securityContext:
            # semaphoreui/semaphore upstream Dockerfile USERs the
            # `semaphore` account at UID 1001. K8s runAsNonRoot needs
            # a numeric value (CLAUDE.md "K8s scheduling" gotcha).
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: inventory-cache
          # sizeLimit caps the emptyDir to prevent runaway cache
          # growth from filling the node's ephemeral storage. Actual
          # NetBox-inventory snapshot at this fleet size (~25 hosts)
          # is well under 1MB; 100Mi is comfortable headroom.
          emptyDir:
            sizeLimit: 100Mi
        - name: config
          # ESO-rendered semaphore-config Secret carries a single
          # `config.json` key — the whole Semaphore config tree.
          # Mounted via subPath above so /etc/semaphore retains its
          # other contents (the container's installed defaults / runtime
          # state).
          secret:
            secretName: semaphore-config
            items:
              - key: config.json
                path: config.json
        - name: ansible-ssh-key
          # ESO-rendered SSH private key for ansible-user access to
          # every managed host. defaultMode 0400 is mandatory: OpenSSH
          # refuses keys with group/world bits set (UNPROTECTED PRIVATE
          # KEY FILE message + immediate connection failure).
          secret:
            secretName: semaphore-ansible-ssh-key
            defaultMode: 0400
        - name: vault-ca
          # CA-only ConfigMap written by trust-manager (Bundle
          # vault-ca-bundle) into every namespace; key ca.crt. Read-only CA
          # trust anchor for Ansible's Vault lookups over the TLS listener.
          configMap:
            name: vault-ca-bundle
