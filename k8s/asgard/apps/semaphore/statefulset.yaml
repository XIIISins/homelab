# k8s/asgard/apps/semaphore/statefulset.yaml
#
# Single-replica StatefulSet. State strategy:
#   - Application state (projects, templates, history, access keys) → PG
#     via Patroni VIP. Survives pod restart by virtue of being external.
#   - Inventory cache (jsonfile, 4h TTL) → emptyDir. Same Synology DS223J
#     LUN cap that bit the Outline Redis PVC (CLAUDE.md "Synology
#     DS223J iSCSI LUN cap" — 10/10 in use) made the 11th claim hang
#     Pending. Cache-class state: rebuild = one NetBox API round-trip
#     on next pod start (~30s), acceptable tradeoff to side-step the
#     cap. Mirrors the Outline Redis emptyDir mitigation.
#   - Ansible Galaxy collections → fetched at template-run time into
#     /tmp; no persistence needed.
#
# StatefulSet (not Deployment) kept for naming stability + matches the
# single-replica-emptyDir pattern of Outline Redis + Authentik Redis.
# No actual stable-storage benefit at 1 replica with emptyDir, but
# zero downside either.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: semaphore
  namespace: semaphore
spec:
  serviceName: semaphore
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semaphore
  # Single replica + PG-backed state — RollingUpdate is safe (no
  # cross-replica race). StatefulSet RollingUpdate stalls on a
  # CrashLoopBackOff pod (see CLAUDE.md K8s scheduling gotcha) so any
  # first-deploy iteration needs manual `kubectl delete pod` to break
  # the deadlock. Standard tradeoff.
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semaphore
    spec:
      # Disable legacy service-link env vars. K8s auto-injects
      # <SVC>_SERVICE_HOST / <SVC>_PORT / <SVC>_PORT_<n>_TCP_* for every
      # Service in the namespace; here the `semaphore` Service generates
      # SEMAPHORE_PORT=tcp://<clusterip>:80, which Semaphore reads as
      # its own listen-port config and panics on (expects /^:?[0-9]+$/).
      # Same collision class hits any app whose env-var naming overlaps
      # an in-namespace Service name. enableServiceLinks=false drops
      # the injection entirely — pods that need cross-Service discovery
      # should use DNS (<svc>.<ns>.svc.cluster.local) anyway.
      enableServiceLinks: false
      # emptyDir respects fsGroup natively (the Synology CSI iSCSI
      # fsGroup-not-honored quirk doesn't apply) — pod-level
      # securityContext.fsGroup is sufficient; no chown initContainer
      # needed. Kubelet sets ownership at mount time.
      securityContext:
        fsGroup: 1001
      containers:
        - name: semaphore
          # The `-ansibleN.N.N` variant bakes ansible-core into the
          # image (vs the plain tag which would need a sidecar). Pin
          # the ansible version explicitly — Semaphore's "latest"
          # ansible tag would float. Bump in lockstep with the Ansible
          # collections in ansible/requirements.yml.
          image: semaphoreui/semaphore:v2.18.5-ansible2.16.5
          imagePullPolicy: IfNotPresent
          # Wrap the image's stock entrypoint with a pip install of the
          # Python deps Ansible needs at task runtime:
          #   - hvac          → community.hashi_vault.vault_kv2_get (38 refs)
          #   - psycopg2-binary → community.postgresql.* (8 refs)
          #   - pytz          → netbox.netbox.nb_inventory (dynamic inventory)
          # jmespath, passlib, requests, cryptography already in the image.
          # Adds ~15s to pod start; runs on every restart.
          # Graduate to a custom image (see docs/services/semaphore.md
          # "When to graduate from in-pod pip install") when the dep
          # list reaches ~5 entries or pod-restart latency matters.
          command:
            - /bin/sh
            - -c
            - pip3 install --quiet hvac psycopg2-binary pytz && exec /sbin/tini -- /usr/local/bin/server-wrapper
          # Config lives ENTIRELY in the mounted /etc/semaphore/config.json
          # (rendered by ESO from Vault — see externalsecret.yaml). No
          # envFrom: Semaphore's setup command silently drops fields
          # (oidc_providers, port, web_host, ...) when translating env
          # → config.json, even when the env var is set with valid JSON.
          # Mounting the full file sidesteps setup entirely.
          #
          # Only this one env var stays — it's not a Semaphore field,
          # it's an Ansible-plugin override for the inventory cache path
          # (the netbox.yml plugin reads it, MacBook uses a different
          # path, semaphore pod uses this one).
          env:
            - name: ANSIBLE_INVENTORY_CACHE_CONNECTION
              value: /var/lib/semaphore/inventory-cache
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: inventory-cache
              mountPath: /var/lib/semaphore/inventory-cache
            # subPath mount: drops just the `config.json` key from the
            # semaphore-config Secret at /etc/semaphore/config.json
            # without clobbering the rest of /etc/semaphore. Kubelet
            # snapshots subPath mounts at pod start (CLAUDE.md
            # "subPath-mounted ConfigMap/Secret keys do NOT auto-update"
            # gotcha) → rotation requires `kubectl rollout restart sts`.
            - name: config
              mountPath: /etc/semaphore/config.json
              subPath: config.json
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Ansible runs spawn ansible-playbook subprocesses inside
              # the same container; memory ceiling tuned for a fleet
              # the size of niflheim (~25 hosts) running site.yml
              # under --check. Bump if a per-template run OOMs.
              memory: 1Gi
          securityContext:
            # semaphoreui/semaphore upstream Dockerfile USERs the
            # `semaphore` account at UID 1001. K8s runAsNonRoot needs
            # a numeric value (CLAUDE.md "K8s scheduling" gotcha).
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: inventory-cache
          # sizeLimit caps the emptyDir to prevent runaway cache
          # growth from filling the node's ephemeral storage. Actual
          # NetBox-inventory snapshot at this fleet size (~25 hosts)
          # is well under 1MB; 100Mi is comfortable headroom.
          emptyDir:
            sizeLimit: 100Mi
        - name: config
          # ESO-rendered semaphore-config Secret carries a single
          # `config.json` key — the whole Semaphore config tree.
          # Mounted via subPath above so /etc/semaphore retains its
          # other contents (the container's installed defaults / runtime
          # state).
          secret:
            secretName: semaphore-config
            items:
              - key: config.json
                path: config.json
