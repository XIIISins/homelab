# k8s/asgard/apps/semaphore/httproute.yaml
#
# Internal-only — operator UI for Ansible orchestration. No midgard /
# apex listener; no external (CF tunnel) exposure. The drift-check
# Hermod webhook fires *from* Semaphore *to* hermod.niflheim (LXC),
# so there's no inbound external dependency. Single hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: semaphore
  namespace: semaphore
spec:
  parentRefs:
    - name: niflheim
      namespace: traefik
      sectionName: websecure
  hostnames:
    - semaphore.niflheim.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: semaphore
          port: 80
