# k8s/asgard/apps/outline/externalsecret.yaml
#
# Two ExternalSecrets split by resolve-order: ESO refuses to render a
# target Secret until EVERY `data` ref resolves, so bundling all four
# Vault paths into one resource means redis (which only needs the app
# password) blocks on s3 + oidc paths that don't exist at first deploy
# (terraform/garage/ and terraform/authentik/ apply *after* the K8s
# manifests land).
#
# `outline-redis-secret` resolves immediately from k8s/outline/app
# (terraform/vault/ mints it) → redis StatefulSet can boot day 1.
#
# `outline-app` resolves once all four Vault paths exist:
#   - k8s/outline/app             — terraform/vault/main.tf
#   - k8s/outline/postgres-password — terraform/vault/main.tf
#   - k8s/outline/s3              — terraform/garage/outline.tf
#   - k8s/outline/oidc            — terraform/authentik/outline.tf
# Until then the Outline Deployment sits in CreateContainerConfigError
# which is fine — it's signalling "I'm waiting on TF apply", not a bug.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-redis-secret
  namespace: outline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: outline-redis-secret
    template:
      engineVersion: v2
      data:
        redis_password: "{{ .redis_password }}"
  data:
    - secretKey: redis_password
      remoteRef:
        key: k8s/outline/app
        property: redis_password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: outline-app
  namespace: outline
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: outline-app
    template:
      engineVersion: v2
      data:
        # Outline core
        SECRET_KEY:   "{{ .secret_key }}"
        UTILS_SECRET: "{{ .utils_secret }}"

        # Public URL — apex hostname (cloudflared-fronted). Outline computes
        # OAuth redirect URIs + cookie domains from this. FORCE_HTTPS=true
        # below tells Outline cookies must be Secure.
        URL:         "https://wiki.xiiisins.com"
        FORCE_HTTPS: "true"
        PORT:        "3000"

        # Postgres — Patroni HAProxy VIP (10.0.10.210) auto-routes to current
        # leader. pg_hba is hostssl-only (CLAUDE.md "PG hostssl-only rejects
        # plaintext clients") so SSL is mandatory, but Patroni's cert is
        # self-signed. Outline's pg-connection-string + sequelize stack
        # has tightened `sslmode=require` to behave like `verify-full` and
        # rejects self-signed certs with `SequelizeConnectionError:
        # self-signed certificate`. `no-verify` keeps the TLS envelope
        # (Patroni's hostssl requirement satisfied) but skips chain +
        # hostname verification — the matching mode for self-signed PG
        # in private networks.
        DATABASE_URL: "postgres://outline:{{ .postgres_password }}@10.0.10.210:5432/outline?sslmode=no-verify"

        # Redis — in-namespace StatefulSet.
        REDIS_URL: "redis://:{{ .redis_password }}@outline-redis:6379"

        # S3 (Garage) — in-cluster ClusterIP. FORCE_PATH_STYLE=true required
        # for Garage (research notes — Garage's virtual-host parsing differs
        # from AWS S3; path-style is the safe default).
        FILE_STORAGE:              "s3"
        AWS_ACCESS_KEY_ID:         "{{ .s3_access_key_id }}"
        AWS_SECRET_ACCESS_KEY:     "{{ .s3_secret_access_key }}"
        AWS_REGION:                "{{ .s3_region }}"
        AWS_S3_UPLOAD_BUCKET_URL:  "{{ .s3_endpoint }}"
        AWS_S3_UPLOAD_BUCKET_NAME: "{{ .s3_bucket }}"
        AWS_S3_FORCE_PATH_STYLE:   "true"
        AWS_S3_ACL:                "private"

        # OIDC via Authentik. OIDC_ISSUER_URL drives auto-discovery of
        # /authorize, /token, /userinfo, /jwks — Authentik's discovery
        # endpoint lives at <issuer>/.well-known/openid-configuration
        # (CLAUDE.md "Authentik OIDC discovery is per-app"). Trailing
        # slash is mandatory.
        OIDC_CLIENT_ID:       "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET:   "{{ .oidc_client_secret }}"
        OIDC_ISSUER_URL:      "https://authentik.xiiisins.com/application/o/outline/"
        OIDC_USERNAME_CLAIM:  "email"
        OIDC_DISPLAY_NAME:    "Authentik"
        OIDC_SCOPES:          "openid profile email"
  data:
    # k8s/outline/app
    - secretKey: secret_key
      remoteRef:
        key: k8s/outline/app
        property: secret_key
    - secretKey: utils_secret
      remoteRef:
        key: k8s/outline/app
        property: utils_secret
    - secretKey: redis_password
      remoteRef:
        key: k8s/outline/app
        property: redis_password

    # k8s/outline/postgres-password
    - secretKey: postgres_password
      remoteRef:
        key: k8s/outline/postgres-password
        property: value

    # k8s/outline/s3 (minted by terraform/garage/)
    - secretKey: s3_access_key_id
      remoteRef:
        key: k8s/outline/s3
        property: access_key_id
    - secretKey: s3_secret_access_key
      remoteRef:
        key: k8s/outline/s3
        property: secret_access_key
    - secretKey: s3_bucket
      remoteRef:
        key: k8s/outline/s3
        property: bucket
    - secretKey: s3_endpoint
      remoteRef:
        key: k8s/outline/s3
        property: endpoint
    - secretKey: s3_region
      remoteRef:
        key: k8s/outline/s3
        property: region

    # k8s/outline/oidc (minted by terraform/authentik/)
    - secretKey: oidc_client_id
      remoteRef:
        key: k8s/outline/oidc
        property: client_id
    - secretKey: oidc_client_secret
      remoteRef:
        key: k8s/outline/oidc
        property: client_secret
