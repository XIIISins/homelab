# k8s/asgard/apps/outline/redis.yaml
#
# Hand-rolled single-replica Redis StatefulSet, mirrors the Authentik
# Redis pattern (k8s/asgard/infrastructure/authentik/redis.yaml). One
# Redis per consumer is the homelab convention — keeps blast radius
# tight (Outline can't see Authentik's session keys, vice versa) and
# avoids cross-app cache eviction surprises.
#
# Password comes from ESO (k8s/outline/app → redis_password field),
# which the Outline ExternalSecret materializes into a K8s Secret
# named `outline-app`. This StatefulSet reads the same Secret via
# secretKeyRef so there's no separate Redis-only secret to manage.
#
# Image redis:7-alpine pinned per CLAUDE.md "Concrete-pin all IaC
# versions, no floats" — bump deliberately + verify release notes.
#
# Storage: emptyDir.
#
# Why emptyDir and not iSCSI PVC: the Synology DS223J's iSCSI LUN cap
# is currently saturated (10/10 PVCs across asgard) — provisioning an
# 11th LUN fails with "Number of LUN reach limit". Outline only uses
# Redis for ephemeral state (websocket presence, BullMQ job queues,
# realtime collab Yjs documents in transit). All of it is recoverable:
# session loss on pod restart re-prompts the OIDC flow, pending jobs
# retry from the DB, active collab clients reconnect + resync via
# Yjs's last-writer-wins. Authoritative state lives in Postgres.
# Revisit to iSCSI if Synology LUN count is unblocked (see open
# question — Synology J-series per-volume LUN cap investigation).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: outline-redis
  namespace: outline
spec:
  serviceName: outline-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: outline-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: outline-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command: [redis-server]
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
            - --dir
            - /data
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outline-app
                  key: redis_password
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: outline-redis
  namespace: outline
spec:
  selector:
    app.kubernetes.io/name: outline-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
