# k8s/asgard/apps/netbox/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 10m
  # First-deploy migrations run as a Helm pre-install/upgrade Job and can
  # take 5–10 min on a fresh PG. 15m gives margin.
  timeout: 15m
  chart:
    spec:
      chart: netbox
      # chart 8.2.17 → appVersion v4.6.1 (NetBox community release with
      # the CVE-2026-29514 fix; pin >=4.6.1).
      version: "8.2.17"
      sourceRef:
        kind: HelmRepository
        name: netbox
        namespace: netbox
  install:
    # Restored to the standard `3` in 5i.f post-flight after first-deploy
    # validation. Was `-1` during initial deploy because mid-migration
    # uninstall-on-failure would have left orphan PVCs + partially-
    # migrated DB rows; once migrations completed cleanly that risk is
    # gone and `3` is the safer default for transient upgrade failures.
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  values:
    # ── Pin image to chart appVersion explicitly ──────────────────────
    image:
      tag: v4.6.1

    # ── External Postgres via HAProxy VIP ─────────────────────────────
    postgresql:
      enabled: false # chart's bundled PG off — we use the niflheim-pg cluster
    externalDatabase:
      host: 10.0.10.210 # HAProxy VIP, routes to current Patroni leader
      port: 5432
      database: netbox
      username: netbox
      existingSecretName: netbox-db
      existingSecretKey: postgresql-password
      engine: django.db.backends.postgresql
      connMaxAge: 300
      disableServerSideCursors: false
      options:
        # sslMode key removed in chart v5 — TLS opts moved into options.
        sslmode: "require"
        # libpq belt-and-braces against any Patroni VIP edge-case
        # split-second (HAProxy /master health-check already routes to
        # the leader; this enforces it at the client-driver level too).
        target_session_attrs: "read-write"

    # ── Bundled Valkey (Redis-protocol KV store, chart switched from
    #    Redis → Valkey in v5; consumer keys unchanged) ───────────────
    valkey:
      enabled: true
      # Chart default is `replication` (1 primary + N replicas). For a
      # single-tenant cache where reload-on-restart is fine, replication
      # is unnecessary complexity (and double the disk consumption).
      architecture: standalone
      sentinel:
        enabled: false
      auth:
        enabled: true # default; chart auto-wires the password through
      # Synology CSI iSCSI volumes don't honor fsGroup reliably (see
      # CLAUDE.md "Storage / iSCSI" gotchas — same class as Vault +
      # Authentik Redis). bitnami-valkey ships a built-in chown
      # initContainer for this; enabling it adds a root-running pre-pod
      # that chowns the data dir to the valkey runtime UID/GID.
      volumePermissions:
        enabled: true
      primary:
        persistence:
          enabled: true
          storageClass: synology-csi-iscsi-retain
          size: 2Gi

    # ── App secrets (mounted via existingSecret references) ───────────
    existingSecret: netbox-app # provides secret_key

    superuser:
      username: admin
      email: admin@niflheim.xiiisins.com
      existingSecret: netbox-superuser # provides password + api_token

    # ── ALLOWED_HOSTS (Django setting) ────────────────────────────────
    allowedHosts:
      - netbox.niflheim.xiiisins.com

    # ── Authentik OIDC ────────────────────────────────────────────────
    # NetBox 4.6 still uses python-social-auth (not allauth). Backend
    # class is the explicit OpenIdConnect one. autoCreateUser=true so a
    # first OIDC login provisions a NetBox user record automatically
    # (in-NetBox permissions still assigned manually until we add a
    # SOCIAL_AUTH_PIPELINE override for OIDC group→permission sync —
    # deferred per 5i.c research).
    remoteAuth:
      enabled: true
      backends:
        - social_core.backends.open_id_connect.OpenIdConnectAuth
      autoCreateUser: true

    extraConfig:
      # Non-secret OIDC values: discovery endpoint + scopes + logout URL.
      # OIDC endpoint MUST match the discovery `issuer` value
      # (https://authentik.midgard.xiiisins.com/application/o/netbox/)
      # — python-social-auth validates JWT iss claim against this.
      - values:
          SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: "https://authentik.midgard.xiiisins.com/application/o/netbox"
          SOCIAL_AUTH_OIDC_SCOPE:
            - openid
            - profile
            - email
          LOGOUT_REDIRECT_URL: "https://authentik.midgard.xiiisins.com/application/o/netbox/end-session/"

    # ── OIDC client_id + secret via direct volume mount ───────────────
    # The chart's `extraConfig: secret:` path mounts at
    # /run/config/extra/<index>/, which NetBox's standard configuration
    # loader (which scans /etc/netbox/config/*.py) doesn't read.
    # Variables defined in those files don't reach Django settings.
    #
    # Mount the netbox-oidc Secret's 99-oidc.py key as a single file
    # directly into /etc/netbox/config/ via subPath. `subPath` is
    # critical — mounting the volume at /etc/netbox/config/ without
    # subPath would replace the entire dir (clobbering configuration.py,
    # extra.py, etc.) with just our one secret file.
    # The `99-` prefix ensures it loads AFTER the other configs (NetBox
    # loads .py files in lexical order), so SOCIAL_AUTH_OIDC_KEY and
    # SECRET are set last and override any defaults.
    extraVolumes:
      - name: netbox-oidc
        secret:
          secretName: netbox-oidc
          items:
            - key: 99-oidc.py
              path: 99-oidc.py
    extraVolumeMounts:
      - name: netbox-oidc
        mountPath: /etc/netbox/config/99-oidc.py
        subPath: 99-oidc.py
        readOnly: true

    # ── In-cluster Authentik resolution via CoreDNS rewrite ───────────
    # No per-pod hostAlias needed — the cluster-wide `coredns-custom`
    # ConfigMap (k8s/asgard/infrastructure/coredns-custom/) rewrites
    # `authentik.midgard.xiiisins.com` queries to
    # `traefik.traefik.svc.cluster.local`, resolved at query time via
    # standard cluster DNS. Pod connects to Traefik's ClusterIP (no
    # MetalLB VIP tromboning — same class as the existing "Cloudflared
    # targets ClusterIP DNS, NEVER MetalLB IPs" rule), sends original
    # SNI + Host header so Traefik's *.midgard cert matches and the
    # HTTPRoute for Authentik resolves the backend correctly.
    #
    # In-browser auth flow is unaffected — user's browser uses LAN DNS
    # through AGH directly, hits the MetalLB VIP path which works fine
    # for external clients.

    # ── Media: emptyDir for first deploy ──────────────────────────────
    # Chart shares one media PVC between netbox (server) + netbox-worker
    # as RWO. Synology CSI is iSCSI-only — no RWX support — so an RWO
    # claim forces both pods to the same node (otherwise the second
    # blocks unmounting from the first). Combined with chart's default
    # anti-affinity, this can deadlock scheduling.
    #
    # For day 1 we have zero device photos; emptyDir is fine. Tradeoff:
    # uploaded photos are pod-local and lost on rescheduling. Revisit
    # when actual photos start landing — options at that point are
    # (a) accept same-node server+worker scheduling, (b) split worker
    # off from the shared volume so only server mounts it (cluster
    # singleton — netbox-server replicaCount=1 is already the case),
    # or (c) deploy a small NFS export on Munin for RWX.
    persistence:
      enabled: false

    # No custom reports or scripts for first deploy.
    reportsPersistence:
      enabled: false
    scriptsPersistence:
      enabled: false

    # ── Resource sizing ───────────────────────────────────────────────
    # Memory tracks bitnami `medium` preset (1Gi/1536Mi) — bumped from
    # `small` (768Mi) on first deploy after Django bootstrap + migrations
    # + gunicorn workers OOMKilled. CPU limit bumped from medium-preset
    # 750m → 1500m: a `terraform apply` state-refresh against /api/* can
    # peg granian to the limit for tens of seconds, which trips the
    # chart's 1s readiness probe and drops the pod from Service endpoints
    # while staying "Running" (liveness is TCP-only). Skuld worker is
    # 2 vCPU so 1500m leaves headroom for other pods; request stays at
    # 500m so scheduling pressure is unchanged.
    resourcesPreset: "none"
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1500m
        memory: 1536Mi
    replicaCount: 1 # bump to 2 once steady-state, for rolling-update headroom

    worker:
      replicaCount: 1
      resourcesPreset: medium

    housekeeping:
      enabled: true
      schedule: "30 3 * * *" # 03:30 daily — cheap maintenance pass

    # ── No edge routing via chart ─────────────────────────────────────
    # HTTPRoute lives as a separate manifest (5i.d), consistent with
    # the apex-static + authentik pattern. Disable chart's own routing.
    ingress:
      enabled: false
    httpRoute:
      enabled: false
