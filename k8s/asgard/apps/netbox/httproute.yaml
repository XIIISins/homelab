# k8s/asgard/apps/netbox/httproute.yaml
#
# Routes netbox.niflheim.xiiisins.com to the NetBox Service. Attaches
# to the niflheim Gateway's HTTPS listener — internal-only, no midgard
# or apex zone exposure (IPAM/DCIM isn't externally reachable even via
# SSO-gating; reduces blast radius if Authentik ever has a CVE).
#
# Cross-namespace attachment to traefik/niflheim is allowed by the
# Gateway's allowedRoutes.namespaces.from: All. Backend is in this
# (netbox) namespace, no ReferenceGrant needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: netbox
  namespace: netbox
spec:
  parentRefs:
    - name: niflheim
      namespace: traefik
      sectionName: websecure
  hostnames:
    - netbox.niflheim.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: netbox
          port: 80
