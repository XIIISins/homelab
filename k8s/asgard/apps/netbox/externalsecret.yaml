# k8s/asgard/apps/netbox/externalsecret.yaml
#
# Four ExternalSecrets feed the NetBox HelmRelease:
#   netbox-app       → secret_key                       (existingSecret)
#   netbox-superuser → bootstrap admin password + token (superuser.existingSecret)
#   netbox-db        → postgresql-password              (externalDatabase.existingSecretName)
#   netbox-oidc      → 99-oidc.py file with OIDC creds  (extraConfig secret mount)
#
# The OIDC secret is rendered as a Python config file (NetBox loads .py
# files from /opt/netbox/netbox/netbox/configuration/) rather than as env
# vars — keeps SOCIAL_AUTH_OIDC_KEY + SECRET out of the process env.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-app
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: netbox-app
    template:
      engineVersion: v2
      data:
        secret_key: "{{ .secret_key }}"
        # The chart's pod template projects ALL of these keys from
        # existingSecret without `optional: true`, so the mount hard-fails
        # if any are missing — even if the corresponding feature (email,
        # LDAP, NAPALM) is disabled. Empty strings satisfy the projection
        # without enabling the features.
        email_password: ""
        ldap_bind_password: ""
        napalm_password: ""
  data:
    - secretKey: secret_key
      remoteRef:
        key: k8s/netbox/app
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-superuser
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: netbox-superuser
    template:
      engineVersion: v2
      data:
        # Chart projects ALL of {username, email, password, api_token} from
        # the superuser existingSecret — the values block (superuser.username
        # / .email in HelmRelease) gets IGNORED when existingSecret is set.
        # Embedding the non-secret username + email as literals here.
        username: "admin"
        email: "admin@niflheim.xiiisins.com"
        password: "{{ .password }}"
        api_token: "{{ .api_token }}"
  data:
    - secretKey: password
      remoteRef:
        key: k8s/netbox/superuser
        property: password
    - secretKey: api_token
      remoteRef:
        key: k8s/netbox/superuser
        property: api_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-db
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: netbox-db
    template:
      engineVersion: v2
      data:
        postgresql-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: k8s/netbox/postgres-password
        property: value
---
# OIDC client_id + secret rendered into a Python config file. The chart's
# extraConfig: [{ secret: { ... } }] mounts this as a file in NetBox's
# configuration dir; NetBox loads it alongside the auto-generated values
# from the extraConfig.values block. Two-file split keeps secrets isolated
# from non-secret OIDC settings.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbox-oidc
  namespace: netbox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: netbox-oidc
    template:
      engineVersion: v2
      data:
        99-oidc.py: |
          SOCIAL_AUTH_OIDC_KEY = "{{ .client_id }}"
          SOCIAL_AUTH_OIDC_SECRET = "{{ .client_secret }}"
  data:
    - secretKey: client_id
      remoteRef:
        key: k8s/netbox/oidc-client-secret
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: k8s/netbox/oidc-client-secret
        property: client_secret
