# k8s/asgard/apps/overview/httproute.yaml
#
# Internal-only, like semaphore and the smoketest: no Cloudflare tunnel
# ingress rule and no public DNS record. The names only resolve through
# AdGuard (terraform/adguard/rewrites.tf), so they exist on the LAN and the
# tailnet and nowhere else.
#
# Two routes, one backend: overview.niflheim.* on the niflheim Gateway, and
# the short alias status.xiiisins.com on the midgard Gateway's apex wildcard
# listener (cert: wildcard-apex-tls). The apex listener is also where
# cloudflared lands public traffic, but cloudflared only forwards the
# hostnames listed in its ConfigMap (404 otherwise), and this one is not.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overview
  namespace: overview
spec:
  parentRefs:
    - name: niflheim
      namespace: traefik
      sectionName: websecure
  hostnames:
    - overview.niflheim.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: overview
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overview-status
  namespace: overview
spec:
  parentRefs:
    - name: midgard
      namespace: traefik
      sectionName: websecure-apex-wildcard
  hostnames:
    - status.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: overview
          port: 80
