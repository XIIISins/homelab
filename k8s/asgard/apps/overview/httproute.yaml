# k8s/asgard/apps/overview/httproute.yaml
#
# Internal-only, like semaphore and the smoketest: attached to the niflheim
# Gateway, no midgard/apex listener, no Cloudflare tunnel. The name only
# resolves through AdGuard (terraform/adguard/rewrites.tf), so it exists on
# the LAN and the tailnet and nowhere else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: overview
  namespace: overview
spec:
  parentRefs:
    - name: niflheim
      namespace: traefik
      sectionName: websecure
  hostnames:
    - overview.niflheim.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: overview
          port: 80
