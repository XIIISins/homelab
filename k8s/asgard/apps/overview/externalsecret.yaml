# k8s/asgard/apps/overview/externalsecret.yaml
#
# The overview page's read-only Proxmox API token (PVEAuditor, privilege-separated user
# `overview@pve`), minted by terraform/proxmox/overview-access/ straight into Vault. The
# template turns the two Vault fields into the finished Authorization header value, so
# nothing else has to know the PVE token syntax. Caddy injects it on exactly two GET
# paths (see the Caddyfile); the browser never sees it.
#
# ORDER: this app merges BEFORE the token exists (terraform apply runs only from the main
# checkout, and the module is not there until the merge). Until terraform/proxmox/overview-access/
# is applied, ESO cannot build the Secret (docs/known-issues/flux-helm-kustomize.md,
# "ExternalSecret data refs are all-or-nothing") and shows an error; that is expected. The
# Deployment marks the env var optional, so the pods still start and the page just has no
# Proxmox slide. After the apply: force-sync this ExternalSecret and `kubectl rollout restart`
# the pods, because env vars are read once at start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: overview-pve-token
  namespace: overview
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: overview-pve-token
    template:
      engineVersion: v2
      data:
        PVE_AUTH: "PVEAPIToken={{ .token_id }}={{ .secret }}"
  data:
    - secretKey: token_id
      remoteRef:
        key: k8s/overview/pve-token
        property: token_id
    - secretKey: secret
      remoteRef:
        key: k8s/overview/pve-token
        property: secret
