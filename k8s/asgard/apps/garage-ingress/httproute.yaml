# k8s/asgard/apps/garage-ingress/httproute.yaml
#
# Internal read/write path for Outline's browser uploads and image reads.
# s3.xiiisins.com resolves to the Traefik VIP for LAN and tailnet clients
# (AdGuard rewrite in terraform/adguard/rewrites.tf) and, for pods, to Traefik's
# ClusterIP (CoreDNS rewrite). From the internet the same name resolves to
# Cloudflare and takes the read-only tunnel path instead (apps/garage-ingress/
# Caddyfile), so write access never leaves the LAN/tailnet.
#
# Path-style addressing: the host carries no bucket label, so Garage reads the
# bucket from the first path segment (AWS_S3_FORCE_PATH_STYLE=true on Outline).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: garage-s3
  namespace: garage
spec:
  parentRefs:
    - name: midgard
      namespace: traefik
      sectionName: websecure-apex-wildcard
  hostnames:
    - s3.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: garage-s3-cors
      backendRefs:
        - name: garage-s3
          port: 3900
