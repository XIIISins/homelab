# k8s/asgard/apps/immich/externalsecret.yaml
#
# Single ExternalSecret — only one Vault path exists at first deploy
# (k8s/immich/postgres-password, minted by terraform/vault/main.tf); no
# resolve-order split needed (unlike Outline's redis/app split — Immich's
# valkey is chart-bundled and needs no password, so there's no early,
# fewer-deps consumer to unblock).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-app
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: immich-app
    template:
      engineVersion: v2
      data:
        # Patroni HAProxy VIP (10.0.10.210) auto-routes to the current
        # leader. sslmode=require&uselibpqcompat=true is Immich's current
        # documented way to keep the TLS envelope (pg_hba hostssl-only)
        # while skipping chain verification against Patroni's self-signed
        # cert — see helmrelease.yaml comment for the full rationale.
        DB_URL: "postgresql://immich:{{ .postgres_password }}@10.0.10.210:5432/immich?sslmode=require&uselibpqcompat=true"
  data:
    - secretKey: postgres_password
      remoteRef:
        key: k8s/immich/postgres-password
        property: value
