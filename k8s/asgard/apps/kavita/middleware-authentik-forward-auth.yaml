# Traefik ForwardAuth Middleware for the kavita-manga2 instance (same-namespace extensionRef, the vmui pattern; explained in
# k8s/asgard/infrastructure/monitoring-namespace/middleware-authentik-forward-auth.yaml). The Authentik application and
# proxy providers are in terraform/authentik/kavita.tf (attached to the embedded outpost in outpost.tf).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: kavita
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      - X-authentik-entitlements
