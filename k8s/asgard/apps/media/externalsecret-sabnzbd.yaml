# SABnzbd API/NZB keys (terraform/vault, k8s/media/sabnzbd) and the Usenet provider login (operator-seeded by hand at
# k8s/media/usenet: host, port, username, password, connections; mirrored to 1P). The init container renders them into
# sabnzbd.ini on first start only; the file on the config volume is authoritative afterwards.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-seed
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sabnzbd-seed
    template:
      engineVersion: v2
      data:
        SAB_API_KEY: "{{ .api_key }}"
        SAB_NZB_KEY: "{{ .nzb_key }}"
        USENET_HOST: "{{ .host }}"
        USENET_PORT: "{{ .port }}"
        USENET_USERNAME: "{{ .username }}"
        USENET_PASSWORD: "{{ .password }}"
        USENET_CONNECTIONS: "{{ .connections }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: k8s/media/sabnzbd
        property: api_key
    - secretKey: nzb_key
      remoteRef:
        key: k8s/media/sabnzbd
        property: nzb_key
    - secretKey: host
      remoteRef:
        key: k8s/media/usenet
        property: host
    - secretKey: port
      remoteRef:
        key: k8s/media/usenet
        property: port
    - secretKey: username
      remoteRef:
        key: k8s/media/usenet
        property: username
    - secretKey: password
      remoteRef:
        key: k8s/media/usenet
        property: password
    - secretKey: connections
      remoteRef:
        key: k8s/media/usenet
        property: connections
