# Sonarr API key, minted by terraform/vault (k8s/media/sonarr) and fed to Sonarr as SONARR__AUTH__APIKEY so the key
# survives a config-volume loss (Recyclarr and the Jellyfin/SABnzbd connections depend on it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sonarr-api
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: sonarr-api
    template:
      engineVersion: v2
      data:
        SONARR__AUTH__APIKEY: "{{ .api_key }}"
  data:
    - secretKey: api_key
      remoteRef:
        key: k8s/media/sonarr
        property: api_key
