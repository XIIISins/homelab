# Daily Recyclarr sync into Sonarr (04:30). The config dir (cloned TRaSH repos,
# cache) is an emptyDir: cheap to rebuild, needs egress to github.com. Run it by hand with
# `kubectl -n media create job --from=cronjob/recyclarr recyclarr-manual`. Sonarr must be up and have its API key (Secret
# sonarr-api, minted by terraform/vault); a failed run just leaves the profile as it was.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media
spec:
  schedule: "30 4 * * *"
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.3
              args: ["sync"]
              env:
                # Recyclarr 8 needs a WRITABLE config dir (it creates subdirectories and clones the TRaSH repos under it):
                # an emptyDir at /config with just recyclarr.yml from the ConfigMap placed in it. DATA_DIR defaults to it.
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: sonarr-api
                      key: SONARR__AUTH__APIKEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: appdata
                  mountPath: /config
                - name: config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
          volumes:
            - name: config
              configMap:
                name: recyclarr-config
            - name: appdata
              emptyDir: {}
