# k8s/asgard/apps/n8n/externalsecret.yaml
#
# Single ExternalSecret → Secret `n8n-app`, envFrom'd by the Deployment.
# Both Vault paths it reads are minted by terraform/vault/main.tf and exist
# at first deploy, so no resolve-order split is needed (unlike outline,
# whose s3/oidc paths landed later). Until `terraform apply` of the vault
# module lands the two paths, this ExternalSecret sits in SecretSyncedError
# and the Deployment waits — that's the expected "waiting on TF" state, not
# a bug.
#
# Following the repo convention (see outline), ALL n8n config — secret AND
# non-secret — is templated into this one Secret and consumed via envFrom.
#
# The two Vault-sourced values:
#   - encryption_key  (k8s/n8n/app)            → N8N_ENCRYPTION_KEY, the one
#       load-bearing secret; encrypts every stored credential in Postgres.
#   - postgres_password (k8s/n8n/postgres-password) → DB_POSTGRESDB_PASSWORD.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-app
  namespace: n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: n8n-app
    template:
      engineVersion: v2
      data:
        # ── The single load-bearing secret ──────────────────────────────
        N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"

        # ── Database — Patroni HAProxy VIP (10.0.10.210) auto-routes to the
        # current leader. pg_hba is hostssl-only (CLAUDE.md "PG hostssl-only
        # rejects plaintext clients") so SSL is mandatory; Patroni's leader
        # cert is self-signed, so REJECT_UNAUTHORIZED=false keeps the TLS
        # envelope but skips chain/hostname verification (the n8n analogue of
        # Outline's sslmode=no-verify). n8n runs its own TypeORM migrations
        # on startup. NOTE: DB_TYPE is `postgresdb`, NOT `postgres` — any
        # missing/typo'd DB var silently falls back to SQLite.
        DB_TYPE: "postgresdb"
        DB_POSTGRESDB_HOST: "10.0.10.210"
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: "n8n"
        DB_POSTGRESDB_USER: "n8n"
        DB_POSTGRESDB_PASSWORD: "{{ .postgres_password }}"
        DB_POSTGRESDB_SSL_ENABLED: "true"
        DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"

        # ── Hostnames / reverse-proxy posture ───────────────────────────
        # The EDITOR lives at n8n.niflheim (internal, Authentik-gated). The
        # WEBHOOK base is the apex (n8n.xiiisins.com, public via cloudflared)
        # so webhook nodes advertise a publicly-reachable URL. n8n supports
        # WEBHOOK_URL independent of N8N_EDITOR_BASE_URL — that split is the
        # whole point of this design.
        N8N_HOST: "n8n.niflheim.xiiisins.com"
        N8N_PROTOCOL: "https"
        N8N_PORT: "5678"
        N8N_EDITOR_BASE_URL: "https://n8n.niflheim.xiiisins.com/"
        WEBHOOK_URL: "https://n8n.xiiisins.com/"
        # Secure cookies — Traefik terminates TLS and is the single proxy
        # hop n8n directly trusts (it sets X-Forwarded-Proto=https). One hop
        # in both paths (editor: client→Traefik; webhook: client→CF→cloudflared
        # →Traefik, but n8n only directly trusts Traefik). Express `trust
        # proxy` = 1.
        N8N_SECURE_COOKIE: "true"
        N8N_PROXY_HOPS: "1"

        # ── Task runners — the current code-execution model. Running without
        # them is deprecated and logs a warning; enable explicitly. Default
        # internal mode needs no extra container.
        N8N_RUNNERS_ENABLED: "true"

        # ── Misc hygiene ────────────────────────────────────────────────
        GENERIC_TIMEZONE: "Europe/Amsterdam"
        TZ: "Europe/Amsterdam"
        N8N_DIAGNOSTICS_ENABLED: "false"
        N8N_HIRING_BANNER_ENABLED: "false"
        # Enforce file-permissions on the (ephemeral) ~/.n8n/config n8n still
        # writes — silences the startup warning without a PVC.
        N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  data:
    - secretKey: encryption_key
      remoteRef:
        key: k8s/n8n/app
        property: encryption_key
    - secretKey: postgres_password
      remoteRef:
        key: k8s/n8n/postgres-password
        property: value
