# k8s/asgard/apps/n8n/middleware-authentik-forward-auth.yaml
#
# Traefik ForwardAuth Middleware gating the n8n editor UI on the niflheim
# route. Same shape as the shared monitoring one + the microbin copy — calls
# Authentik's embedded outpost; a same-namespace copy is needed because an
# HTTPRoute extensionRef → Middleware resolves within the route's namespace.
#
# Authenticated + in the n8n-admins group → 200; otherwise → 302 to the
# Authentik auth flow. The provider's external_host
# (https://n8n.niflheim.xiiisins.com, terraform/authentik/n8n.tf) is matched
# from X-Forwarded-Host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forward-auth
  namespace: n8n
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
      - X-authentik-entitlements
