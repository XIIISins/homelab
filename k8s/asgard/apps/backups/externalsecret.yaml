# k8s/asgard/apps/backups/externalsecret.yaml
#
# S3 write credential for both CronJobs (IAM user homelab-backup-writer — PutObject
# only on vault-raft/* and calico/*). Minted by terraform/aws, placed at
# secret/k8s/backups/aws-writer by the operator (docs/procedures/offsite-backups.md).
# Until it is placed this ExternalSecret sits in SecretSyncedError and the Jobs'
# pods wait in CreateContainerConfigError — the expected "waiting on the secret"
# state, not a bug.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-backup-writer
  namespace: backups
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: aws-backup-writer
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: k8s/backups/aws-writer
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: k8s/backups/aws-writer
        property: secret_access_key
