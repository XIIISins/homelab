# k8s/asgard/apps/backups/rbac.yaml
#
# vault-snapshot: no K8s permissions at all — the SA exists only so its projected
#   token can log in to Vault's Kubernetes auth (role `vault-snapshot`, bound to
#   exactly this SA + namespace in terraform/vault/backups.tf).
# calico-export: read-only on the two Calico API groups (datastore + operator CRs).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: backups
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: calico-export
  namespace: backups
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: calico-datastore-read
rules:
  - apiGroups: ["crd.projectcalico.org", "operator.tigera.io"]
    resources: ["*"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: calico-export-datastore-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: calico-datastore-read
subjects:
  - kind: ServiceAccount
    name: calico-export
    namespace: backups
