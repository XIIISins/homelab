# k8s/asgard/apps/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - apex-static
  - netbox
  - teamspeak
  # Phase 8 — observability stack (relocated from jotunheim 2026-05-24
  # for operational reasons: jotunheim's deploy timeline is uncertain;
  # asgard already has the infrastructure VM/VL need, AND keeping VL
  # in the same cluster as the workloads producing logs simplifies
  # the ingest path. See decisions.md "VM/VL placement — asgard".
  # The shared `monitoring` namespace + Traefik ForwardAuth Middleware
  # live in infrastructure/monitoring-namespace (infrastructure-level
  # so the vlagent DaemonSet in infrastructure/victoria-logs-collector
  # can rely on the namespace existing — apps reconcile AFTER infra).
  - victoriametrics
  - victorialogs
  # Outline wiki — Authentik OIDC, PG via Patroni HAProxy VIP, S3 via
  # Garage in infrastructure/, OIDC OAuth2 provider in terraform/authentik/.
  - outline
  # Zabbix ingress shim — Zabbix server itself runs on LXC 1102 (hugin,
  # outside K3s), this directory only contains the K8s-side routing
  # (Service + EndpointSlice + HTTPRoute) that lets Traefik front the
  # LXC for LAN (hugin.midgard) + WAN (hugin.xiiisins.com via
  # cloudflared) under Authentik native SAML. See
  # terraform/authentik/zabbix.tf for the IdP-side declaration.
  - zabbix-ingress
  # Phase 5h.3 — Semaphore (Ansible orchestrator). Internal-only at
  # semaphore.niflheim.xiiisins.com. PG via Patroni HAProxy VIP +
  # Authentik OIDC. NetBox dynamic inventory consumed via the cached
  # netbox.yml plugin (4h TTL, persisted to inventory-cache PVC).
  - semaphore
  # Phase 6 Stage 1 — Vault UI ingress shim. HTTPRoute fronting the
  # vault-ui Service (infrastructure/vault) at vault.niflheim.xiiisins.com
  # under Authentik OIDC (terraform/authentik/vault.tf + terraform/vault/
  # oidc.tf). Additive — vault-ui stays a LoadBalancer (.11) until the
  # operator-gated VAULT_ADDR cutover; see open-questions.md Phase 6 6.c.
  - vault-ingress
  # Personal startpage — public, external-only at home.xiiisins.com via
  # cloudflared. Caddy pod serving a git-clone of the private
  # XIIISins/startpage repo (branch tokyonight_colors); deploy key in Vault.
  # Separate from apex-static so a clone failure can't take down the
  # OIDC-critical WebFinger pod, and a content update (rollout restart)
  # only bounces the startpage. 3 replicas, one per worker.
  - startpage
  # MicroBin — public pastebin/file-share at paste.xiiisins.com (external
  # via cloudflared). Anonymous create/view; /pastalist + /admin gated by
  # Authentik ForwardAuth (paste-janitors group) for trusted cleanup.
  # JSON DB + attachments on NFS. terraform/authentik/microbin.tf +
  # terraform/vault (admin creds) + terraform/cloudflare (CNAME).
  - microbin
  # n8n — workflow automation. Editor UI internal-only at
  # n8n.niflheim.xiiisins.com behind Authentik ForwardAuth (community n8n
  # has no native OIDC); public webhook endpoints at n8n.xiiisins.com via
  # cloudflared (/webhook/* + /form/* only, ungated). Postgres via Patroni
  # VIP, encryption key from Vault, NO PVC (stateless-on-disk). See
  # terraform/{vault,authentik,cloudflare,adguard}/ + docs/services/n8n.md.
  - n8n
  # Immich — photo/video library for the operator + direct family
  # (secondary copy alongside iCloud/Google Photos). NFS library PVC
  # (nfs-client, same k8s-nfs export as MicroBin — Immich has no native
  # S3 backend), local-path ML-model-cache PVC, Postgres via Patroni VIP,
  # Authentik OIDC (manual one-time Admin Settings paste — see
  # helmrelease.yaml + open-questions.md "Immich"). External apex +
  # midgard alias, no niflheim route.
  - immich
