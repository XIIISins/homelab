# k8s/asgard/apps/php-watch/httproute.yaml
#
# Internal-only, like the overview page: no Cloudflare tunnel rule and no public
# DNS record. The name only resolves through AdGuard (terraform/adguard/rewrites.tf),
# so it exists on the LAN and the tailnet and nowhere else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: php-watch
  namespace: php-watch
spec:
  parentRefs:
    - name: niflheim
      namespace: traefik
      sectionName: websecure
  hostnames:
    - php-watch.niflheim.xiiisins.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: php-watch
          port: 80
