# k8s/asgard/apps/php-watch/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-watch
  namespace: php-watch
spec:
  # Two replicas on different workers: it is public now, and each keeps its own
  # in-memory cache of the source pages (refreshed in the background), so a pod
  # that restarts only costs its own warm-up.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: php-watch
  template:
    metadata:
      labels:
        app: php-watch
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - php-watch
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          # Node 24 LTS runs the TypeScript directly (type stripping), so there is
          # no build and no image of our own: the code is the php-watch-server
          # ConfigMap. No dependencies, nothing is installed at start.
          image: node:24.22.1-alpine
          command:
            - node
            - /srv/app/server.ts
          env:
            - name: PORT
              value: "8080"
            - name: SITE_DIR
              value: /srv/site
            - name: NODE_ENV
              value: production
            # Heap cap well under the container limit, so a leak ends as a clean
            # restart instead of an OOM kill mid-response.
            - name: NODE_OPTIONS
              value: --max-old-space-size=128
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Ready once the default CVE list is in memory (or after 45 s), so a new
          # pod never serves a visitor from a cold cache.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Starting point; the VPA object in vpa-config/php-watch.yaml records what it really uses.
          resources:
            requests:
              cpu: 10m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: app
              mountPath: /srv/app
              readOnly: true
            - name: site
              mountPath: /srv/site
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: php-watch-server
        - name: site
          configMap:
            name: php-watch-site
