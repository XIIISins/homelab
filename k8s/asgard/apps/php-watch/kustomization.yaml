# k8s/asgard/apps/php-watch/kustomization.yaml
#
# PHP watch: internal-only at php-watch.niflheim.xiiisins.com. Answers "has a PHP
# fix shipped yet, and where?" from php.net, the Debian/Ubuntu/Red Hat/Alpine
# trackers, Sury and the official Docker image.
# Official php image + a ConfigMap'd site, no image build. The ConfigMap keeps
# the default name hash, so a content change renames it, kustomize rewrites the
# Deployment's reference and the pods roll on their own (no subPath mounts:
# see docs/known-issues/flux-helm-kustomize.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml

configMapGenerator:
  - name: php-watch-site
    namespace: php-watch
    files:
      - site/index.html
      - site/style.css
      - site/app.js
      - site/theme.js
      - site/api.php
      - site/lib.php
      - site/sources.php
      - site/healthz.php
      - site/familjen-grotesk.woff2
