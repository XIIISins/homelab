# k8s/asgard/apps/teamspeak/statefulset.yaml
#
# Single-replica StatefulSet — TeamSpeak server is single-writer (one virtualserver,
# one identity keypair stored in PG). HA is not a thing upstream; failover is
# DNS-SRV at the client side (priority-99 do-ts3 takes over when this is down).
#
# Image is pinned (CLAUDE.md "Concrete-pin all IaC versions, no floats").
# Bump deliberately by editing this file + verifying release notes — TS3 has
# had silent on-disk schema migrations in patch releases historically.
#
# DB backend: PostgreSQL via the first-party ts3db_postgresql plugin (added
# in TS3 3.13.0, Nov 2020). Connection routed through the HAProxy/Patroni
# VIP — leader auto-discovery + transparent failover.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: teamspeak
  namespace: teamspeak
spec:
  serviceName: teamspeak-query
  replicas: 1
  selector:
    matchLabels:
      app: teamspeak
  template:
    metadata:
      labels:
        app: teamspeak
    spec:
      # Synology CSI doesn't honor fsGroup reliably on iSCSI volumes — chown
      # initContainer pattern (same class as Vault/Authentik-Redis/NetBox-Valkey,
      # see CLAUDE.md "Synology CSI iSCSI volumes need a chown initContainer").
      # Official teamspeak image runs as UID 9987 (`ts3server`).
      securityContext:
        fsGroup: 9987
      initContainers:
        - name: data-chown
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 9987:9987 /var/ts3server && chmod 750 /var/ts3server
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/ts3server
      containers:
        - name: teamspeak
          image: teamspeak:3.13.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: voice
              containerPort: 9987
              protocol: UDP
            - name: filetransfer
              containerPort: 30033
              protocol: TCP
            - name: query
              containerPort: 10011
              protocol: TCP
          env:
            - name: TS3SERVER_LICENSE
              value: accept
            # ── PostgreSQL backend (first-party plugin) ─────────────────
            - name: TS3SERVER_DB_PLUGIN
              value: ts3db_postgresql
            - name: TS3SERVER_DB_SQLCREATEPATH
              value: create_postgresql
            - name: TS3SERVER_DB_HOST
              value: "10.0.10.210" # PG HAProxy VIP — auto-routes to current Patroni leader
            - name: TS3SERVER_DB_PORT
              value: "5432"
            - name: TS3SERVER_DB_NAME
              value: teamspeak3
            - name: TS3SERVER_DB_USER
              value: teamspeak3
            - name: TS3SERVER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: teamspeak-db
                  key: password
            - name: TS3SERVER_DB_CONNECTIONS
              value: "10"
            - name: TS3SERVER_DB_WAITUNTILREADY
              value: "30"
            # libpq honors PG* env vars; Patroni's pg_hba is hostssl-only
            # (CLAUDE.md "PG hostssl-only rejects plaintext clients"). Without
            # this, the plugin's libpq default of `prefer` would silently
            # downgrade and fail with the misleading "no encryption" error.
            - name: PGSSLMODE
              value: require
          # No HTTP — TCP probe ServerQuery (10011) for liveness/readiness.
          # 9987 is UDP and can't be TCP-probed; serverquery comes up after
          # voice listener is ready, so it's a conservative signal.
          livenessProbe:
            tcpSocket:
              port: query
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: query
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsUser: 9987
            runAsGroup: 9987
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/ts3server
  # 5Gi initial. StorageClass `synology-csi-iscsi-retain` has
  # allowVolumeExpansion: true — grow up to 20Gi later via
  # `kubectl edit pvc data-teamspeak-0 -n teamspeak` (Synology CSI does
  # online iSCSI LUN resize + the kernel re-reads block geometry; ext4
  # auto-resizes after).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: synology-csi-iscsi-retain
        resources:
          requests:
            storage: 5Gi
