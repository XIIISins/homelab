# k8s/asgard/apps/teamspeak/externalsecret.yaml
#
# Pulls the PG password for the `teamspeak3` DB role from Vault.
# Minted + dual-pathed by terraform/vault/main.tf (random_password.teamspeak_postgres),
# also written to ansible/postgres/teamspeak3-password so the Ansible
# postgres-common role provisions the matching DB role on Patroni.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: teamspeak-db
  namespace: teamspeak
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: teamspeak-db
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: k8s/teamspeak/postgres-password
        property: value
