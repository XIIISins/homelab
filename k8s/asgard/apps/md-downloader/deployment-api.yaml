# k8s/asgard/apps/md-downloader/deployment-api.yaml
#
# Stateless Go API (one image, three roles: this is `-api`). Reads/writes Postgres only; /data is a cover cache, so an
# emptyDir. Two replicas spread across workers with PREFERRED anti-affinity (no surge deadlock). The image tag is pinned;
# bump it in a reviewed PR. Packages are public on ghcr, so no pull secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: md-downloader-api
  namespace: md-downloader
spec:
  replicas: 2
  selector:
    matchLabels:
      app: md-downloader-api
  template:
    metadata:
      labels:
        app: md-downloader-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: md-downloader-api
      containers:
        - name: api
          image: ghcr.io/xiiisins/md-downloader:sha-b242505
          args: ["-api", "-addr", "0.0.0.0:8080"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: Europe/Amsterdam
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: md-downloader-db
                  key: DATABASE_URL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
