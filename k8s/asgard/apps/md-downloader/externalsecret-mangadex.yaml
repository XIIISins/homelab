# k8s/asgard/apps/md-downloader/externalsecret-mangadex.yaml
#
# MangaDex API client + account credentials for the sync worker (the only component that calls MangaDex).
# Vault path secret/k8s/md-downloader/mangadex is operator-seeded (not Terraform); mirrored to 1P.
# Fields: client_id, client_secret, username, password. The Secret keys are the env var names the app reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: md-downloader-mangadex
  namespace: md-downloader
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: md-downloader-mangadex
  data:
    - secretKey: MD_CLIENT_ID
      remoteRef:
        key: k8s/md-downloader/mangadex
        property: client_id
    - secretKey: MD_CLIENT_SECRET
      remoteRef:
        key: k8s/md-downloader/mangadex
        property: client_secret
    - secretKey: MD_USERNAME
      remoteRef:
        key: k8s/md-downloader/mangadex
        property: username
    - secretKey: MD_PASSWORD
      remoteRef:
        key: k8s/md-downloader/mangadex
        property: password
