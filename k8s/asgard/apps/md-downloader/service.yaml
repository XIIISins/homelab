# k8s/asgard/apps/md-downloader/service.yaml
#
# api and web only. The daemon has NO Service: its listener is Host-restricted and only /healthz answers other hosts.
apiVersion: v1
kind: Service
metadata:
  name: md-downloader-api
  namespace: md-downloader
spec:
  type: ClusterIP
  selector:
    app: md-downloader-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: md-downloader-web
  namespace: md-downloader
spec:
  type: ClusterIP
  selector:
    app: md-downloader-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
