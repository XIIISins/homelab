# k8s/asgard/apps/md-downloader/externalsecret-db.yaml
#
# DATABASE_URL for every md-downloader role, built from the Terraform-minted password at
# secret/k8s/md-downloader/postgres-password (terraform/vault/main.tf, field `value`; alphanumeric, so no URL-escaping).
# Patroni HAProxy VIP, TLS required (sslmode=require; the cluster cert is self-signed). The app creates its own tables on
# start and retries through a Patroni failover.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: md-downloader-db
  namespace: md-downloader
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: md-downloader-db
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgres://md_downloader:{{ .password }}@10.0.10.210:5432/md_downloader?sslmode=require"
  data:
    - secretKey: password
      remoteRef:
        key: k8s/md-downloader/postgres-password
        property: value
