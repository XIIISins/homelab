# k8s/asgard/infrastructure-config/clustersecretstore.yaml
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      # Vault's listener serves the homelab internal CA cert (not a public
      # LE cert), so ESO must trust that CA. Read it straight from the
      # cert-manager-issued vault-tls Secret's ca.crt (auto-tracks renewal).
      # namespace is mandatory on a ClusterSecretStore caProvider. ESO's
      # default ClusterRole already grants cluster-wide secret read.
      caProvider:
        type: Secret
        name: vault-tls
        namespace: vault
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
