# k8s/asgard/flux-system/apps.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/asgard/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Apps depend on infrastructure (cert-manager, traefik, gateway-api,
  # ESO, MetalLB, etc.). Without this, an app reconciling before its
  # dependencies are Ready can flap or stall on missing CRDs.
  dependsOn:
    - name: infrastructure
