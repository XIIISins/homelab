# k8s/asgard/flux-system/vpa-config.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vpa-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/asgard/vpa-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # VerticalPodAutoscaler objects need the CRDs that infrastructure/vpa installs.
  dependsOn:
    - name: infrastructure
