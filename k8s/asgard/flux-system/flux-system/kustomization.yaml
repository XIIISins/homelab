apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
# Phase 10i: the stock requests (64Mi) sit far below each controller's 30d max
# working set. Kept as patches so `flux install`/bootstrap can regenerate
# gotk-components.yaml without losing them. Request = 1.2 x max, 16Mi steps.
patches:
- target:
    kind: Deployment
    name: helm-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: helm-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: 336Mi
- target:
    kind: Deployment
    name: kustomize-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: kustomize-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: 432Mi
- target:
    kind: Deployment
    name: notification-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: notification-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: 176Mi
- target:
    kind: Deployment
    name: source-controller
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: source-controller
    spec:
      template:
        spec:
          containers:
          - name: manager
            resources:
              requests:
                memory: 432Mi
