# k8s/asgard/flux-system/vault-config.yaml
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vault-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./k8s/asgard/vault-config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
