# aiops/author-classes.yml — Phase 10h2: what an agent-authored PR may touch.
#
# Read by aiops/author/scope.py from BOTH the dispatcher on Frigg (before it pushes) and the CI job
# `agent-scope` (from the PR's BASE commit, so a PR cannot loosen its own rules). An agent cannot edit this
# file: it is under `deny` below. Plan: docs/operations/10h-predictive-change.md ("The PR gate").
version: 1

# A PR is agent-authored when its head branch is `agent/<class>/<change-request-id>-<slug>`. The dispatcher (not
# the LLM session) creates that branch, so the session cannot pick or omit the name. Optional extra check: when
# `agent_logins` is non-empty a PR from one of these logins must use the prefix.
branch_prefix: agent/
agent_logins: []

limits:
  max_files: 12
  max_changed_lines: 600
  allow_deletes: false      # nothing an agent PR does may delete a file (no data loss class)

# No class may ever touch these: the files that define what agents may do, the CI itself, secrets and the
# deploy path's guardrails. Patterns: `**` crosses directories, `*` does not.
deny:
  - ".github/**"
  - ".claude/**"
  - ".gitleaks.toml"
  - "CLAUDE.md"
  - "terraform/github/**"
  - "terraform/vault/**"
  - "terraform/semaphore/**"
  - "terraform/proxmox/asgard-pools/**"
  - "terraform/aws/**"
  - "aiops/actions.yml"
  - "aiops/runbooks.yml"
  - "aiops/alert-routing.yml"
  - "aiops/schema/**"
  - "aiops/toolbelt/**"
  - "aiops/bot/**"
  - "aiops/n8n/**"
  - "aiops/runner/**"
  - "aiops/author/**"
  - "aiops/author-classes.yml"
  - "ansible/playbooks/aiops-*.yml"   # the replay/guard wrappers a canary test runs under: the PR under test must not be able to edit its own guard
  - "ansible/playbooks/drift-check.yml"
  - "aiops/tools/**"
  - "aiops/tests/**"
  - "ansible/roles/aiops-*/**"
  - "ansible/roles/ratatoskr/**"
  - "ansible/roles/frigg-ssh-agent/**"
  - "ansible/roles/control-node/**"
  - "ansible/inventory/group_vars/all/vault.yml"
  - "docs/operations/decisions.md"
  - "docs/operations/open-questions.md"
  - "docs/operations/build-sequence.md"
  - "scripts/**"
  - "**/*.pem"
  - "**/*.key"
  - "**/*.tfstate*"
  - "**/.env*"
  - "**/vault.yml"

# `enabled: false` classes are drafted nowhere: the dispatcher refuses them and CI fails a PR that names one.
# The doc's order: docs first, capacity remedies second, drift third.
classes:
  docs:
    enabled: true
    summary: Incident write-ups and known-issue / procedure edits (10h3 uses this class).
    allow:
      - "docs/incidents/**"
      - "docs/known-issues/**"
      - "docs/procedures/**"
    tested_on: repo CI (links, yamllint) in the author's worktree; no substrate needed
    checks:  # run by the dispatcher on the patched clone before it pushes; their results go in the PR body
      - {name: doc links, script: .github/scripts/ci-doc-links.py}
  drift-note:
    enabled: true
    summary: A short record of what a drift check reported, why, and how it resolved (documents only; the code-changing class is `drift`).
    allow:
      - "docs/operations/drift/**"
    tested_on: repo CI (links, yamllint) in the author's worktree; no substrate needed
    checks:
      - {name: doc links, script: .github/scripts/ci-doc-links.py}
  capacity:
    enabled: true   # 2026-10-04: from a forecast card's "Draft fix PR" button (filesystem fill, memory creep): one Terraform size value
    summary: A forecast's known remedy, as a value change (a guest's disk size or memory).
    allow:
      - "terraform/proxmox/asgard-lxcs/*.tf"
      - "terraform/proxmox/asgard-lxcs-root/*.tf"
      - "terraform/proxmox/asgard-vms/*.tf"
    tested_on: nothing to run it on (a Terraform size is not exercised by a canary); the reviewer reads the one-value diff, the operator runs terraform apply
  drift:
    enabled: true   # 2026-10-04: narrowed to the four roles the canary pool runs, so every PR can be proven on a canary
    summary: Make the repo match intent after non-convergeable drift (the PR states the direction). One role per PR.
    allow:
      - "ansible/roles/baseline/**"
      - "ansible/roles/hardening/**"
      - "ansible/roles/vlagent/**"
      - "ansible/roles/zabbix-agent/**"
    tested_on: a canary (the Toolbelt proposes it, the operator approves) - dry run of the PR's code, converge, second dry run for idempotence; the result is written into the PR description
    canary_test: true
