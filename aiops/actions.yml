# aiops/actions.yml — the action registry (Phase 10c3).
#
# Schema: schema/actions.v1.schema.json. Validated by `python3 aiops/tools/lint.py`
# (every action has a tier + verify step; every Semaphore template and playbook
# reference resolves).
#
# Rule of the road (aiops-roadmap.md principle 1): the agent acts ONLY through
# a named entry here, executed by Semaphore. No entry = no action. The
# executor (10e1) may trigger only these templates, passing only the declared
# extra_vars (as the Semaphore task `environment`, a JSON string — that
# channel is honoured even though the templates forbid CLI-arg overrides, see
# known-issues/zabbix.md "Semaphore task-start API").
#
# Result convention: every playbook ends with a debug line
#   AIOPS_RESULT {"action": "<name>", "ok": true|false, ...}
# which the executor parses from the task output to evaluate `verify.expect`.
#
# Exception: for replay-role-check / replay-role a playbook cannot see its own
# stats, so `ok` and `changed` in their verify.expect come from the target
# host's PLAY RECAP line (failed=0 unreachable=0; changed=N); AIOPS_RESULT only
# marks guard-passed / complete phases and the check-mode flag.
#
# The playbooks re-enforce each guard themselves (they read this file), so a
# misbehaving executor cannot widen a guard by passing different vars.
#
# Initial scope is T0/T1 only. T2 entries arrive with 10e. Every mutator is
# `max_autonomy: approval` unless a reviewed PR raises it: `auto` (10f) is allowed ONLY for a T1, idempotent
# action that an `autonomy.policies` entry below covers. A ceiling is not a trigger: autonomy also needs the runtime
# master switch (`/aiops autonomy on`, default OFF), the kill switch off, the maintenance flag off, the circuit breaker
# closed, the target inside `autonomy.hosts`, the rate limits, a diagnosis naming the policy's runbook with enough
# confidence, and the Toolbelt's OWN independent check that the fault is real right now (never the model's say-so).
#
# `task_fields.limit` is NOT honoured by this Semaphore (stored at creation, dropped at run, found live 2026-10-03):
# pass `--limit` through `arguments` (the template needs allow_override_args_in_task = true).
# `semaphore.applied: false` = the template is defined in
# terraform/semaphore/templates.tf but nobody has run `terraform apply` yet
# (operator gate, from the main checkout). Flip to true in the PR that follows
# the apply.

schema_version: aiops.actions/v1

# Targets the mutating actions may touch (T1 = stateless / replicated /
# rebuildable from IaC with no data loss, aiops-roadmap.md). Anything not
# listed is T2/T3 and out of scope for restart-unit / replay-role.
host_tiers:
  T1:
    - mimir      # AdGuard replica
    - kvasir     # AdGuard replica (Saga is the Terraform/sync origin: not T1)
    - bifrost    # Tailscale LXC
    - heimdall   # Tailscale LXC
    - gjallarbru # Tailscale LXC
    - hermod     # AppriseAPI + Caddy (stateless; alerts still land in VL when it is down)
    # Disposable canary pool (10b1: LXCs 1190-1192, Urd only). Run nothing but the
    # fleet baseline, so they are the only hosts 10f/10g may fault-inject. Never
    # widen this to a wildcard/group: list each canary by name.
    - canary-1
    - canary-2
    - canary-3
  # T2 = stateful or hard to replace: approval-gated at best, NEVER a target of a T1 action. Listed here only so the
  # `rebuild` section (10g) can name them; they are not in any T1 allow-list.
  T2:
    - einherjar-urd   # asgard K3s workers (local-path data: see the rebuild data manifest)
    - einherjar-verd
    - einherjar-skuld
    - do1             # DigitalOcean offsite (also the outside watcher)

# ---- Phase 10f: autonomous T1 healing ------------------------------------------------------------------------------
# The SCOPE autonomy may act in. Widening any list below is a reviewed PR; the runtime switches (autonomy on/off, kill
# switch, maintenance, circuit breaker) live in the Toolbelt and are driven from Discord (/aiops).
autonomy:
  # Autonomous actions may target ONLY these hosts (a subset of host_tiers.T1). Start with the disposable canaries for
  # the ~14-day soak; widen to real replicas (mimir, kvasir, the Tailscale LXCs, hermod) only after it passes.
  hosts:
    - canary-1
    - canary-2
    - canary-3
  limits:
    per_target_per_hour: 2 # autonomous actions on one target
    per_policy_per_day: 10 # autonomous actions of one policy, fleet-wide
    breaker_failures: 3 # failed / unverified autonomous runs inside the window trip the breaker (autonomy stops until an operator resets it)
    breaker_window_seconds: 3600
  policies:
    # A stopped or failed allow-listed unit on a host that is alive. The diagnosis must name the runbook; the Toolbelt then
    # reads the unit's state itself (service-status) and acts only if it is really failed/inactive.
    restart-failed-unit:
      enabled: true
      action: restart-unit
      runbook: RB-UNIT-STOPPED-T1
      layers: [workload, host]
      min_confidence: medium
      precheck: unit-not-active
    # Off until the canary soak passes: reset a Stalled HelmRelease of a stateless release (kube read confirms Stalled=True).
    reset-stalled-helmrelease:
      enabled: false
      action: flux-reconcile-reset
      runbook: RB-FLUX-HR-STALLED
      layers: [workload]
      min_confidence: medium
      precheck: helmrelease-stalled
    # Off until the soak passes and a drift trigger exists (the Semaphore drift-check is not an n8n source yet): replay a
    # role on a drifted T1 host after a clean dry run whose diff is small.
    replay-drifted-baseline:
      enabled: false
      action: replay-role
      runbook: RB-LXC-BOOT-DRIFT
      layers: [drift]
      min_confidence: medium
      precheck: drift-present
      max_changed: 10

# ---- Phase 10f soak: scheduled fault injection on the canaries -----------------------------------------------------
# docs/procedures/aiops-autonomy.md "Scheduled fault injection". The Toolbelt (never a model) stops ONE allow-listed unit on ONE canary
# on a schedule, so the soak collects evidence that `restart-failed-unit` heals real faults without anyone injecting them by hand,
# and puts the unit back itself if autonomy did not. This is the SCOPE a reviewed PR can change; the runtime gate is the existing
# flags (it runs only while `autonomy` is ON, and never under the kill switch, maintenance or an open breaker) plus the server
# flag `--soak`. Hosts must be a subset of `autonomy.hosts`; the action it uses (`canary-fault`) is internal to the scheduler.
soak:
  hosts: [canary-1, canary-2, canary-3]
  units: [zabbix-agent2.service] # the fault the Canary smoke test template turns into a problem (vlagent raises none: listed on the action, not injected)
  interval_seconds: 28800 # at most one injection per 8 h, fleet-wide
  max_per_day: 3
  heal_deadline_seconds: 1500 # 25 min: diagnosis window, agent run, approval-free heal; after this the scheduler restores the unit itself and records a miss
  ends: '2026-10-31' # the scheduler stops after this UTC date; extending it is a reviewed PR

# ---- Phase 10g: fleet rebuild loop (POLICY DATA ONLY; the engine, runner and playbooks are not built) -----------------
# docs/plans/active/10g-rebuild-loop.md. Same rule as `autonomy`: this is the SCOPE a reviewed PR can widen. The pure
# decisions that read it live in toolbelt/rebuild.py; nothing here runs yet, every policy is disabled and the five
# actions below are `applied: false`. The runtime master switch `autonomy_rebuild` is separate from 10f's `autonomy`
# and is OFF after every deploy and every Toolbelt database reset.
rebuild:
  autonomy_rebuild_default: false
  limits:
    per_target_per_day: 1 # a second rebuild inside 24 h means the first did not fix it: escalate
    per_target_per_week: 2
    per_class_per_day: 2
    fleet_per_day: 3
    breaker_failures: 1 # a failed or unverified rebuild leaves a half-built guest: stop and page
    plan_max_age_seconds: 900
  dead:
    probe_count: 3 # reach.tcp failures after the last success ...
    probe_span_seconds: 600 # ... spanning at least this long, with the Zabbix agent silent
    backup_max_age_hours: 36 # a dead guest with data needs a nightly PBS backup this recent
  broken:
    drift_max_changed: 10 # a dry-run replay larger than this that a role replay cannot fix
  stages:
    A: {classes: [canary], autonomy: auto}
    B1: {classes: [adguard-replica], autonomy: approval-then-auto, approvals_before_auto: 2}
    B2: {classes: [tailscale-router], autonomy: approval} # root-ticket module: an unattended runner must never hold root@pam
    B3: {classes: [offsite], autonomy: approval}
    C: {classes: [worker], autonomy: approval}
  classes:
    canary:
      stage: A
      kind: lxc
      module: asgard-lxcs
      pool: aiops-canary
      backup: none
      converge: asgard-canary
      hosts:
        canary-1: {vmid: 1190, node: urd}
        canary-2: {vmid: 1191, node: urd}
        canary-3: {vmid: 1192, node: urd}
      post_conditions: [ssh-as-ansible, agents-active, alert-cleared, vlagent-active, zabbix-agent2-active, zabbix-group-canary, canary-template-linked]
    adguard-replica:
      stage: B1
      kind: lxc
      module: asgard-lxcs
      pool: aiops-replica
      backup: pbs-last-chance
      converge: asgard-adguard
      leader_aware: vrrp-master
      neighbours: [saga, mimir, kvasir]
      hosts: # Saga (1110) is the Terraform/sync origin and VRRP priority holder: never in scope
        mimir: {vmid: 1111, node: verd}
        kvasir: {vmid: 1112, node: skuld}
      post_conditions: [ssh-as-ansible, agents-active, alert-cleared, adguard-answers-rewrite, keepalived-priority, sync-parity, vip-answers]
    tailscale-router: # approval only; gjallarbru is the sole exit node (singleton): out
      stage: B2
      kind: lxc
      module: asgard-lxcs-root
      backup: pbs-last-chance
      converge: asgard-tailscale
      hosts:
        bifrost: {vmid: 1113, node: urd}
        heimdall: {vmid: 1114, node: skuld}
      post_conditions: [ssh-as-ansible, agents-active, alert-cleared, tailscaled-up-tagged, routes-advertised-approved, peer-router-online]
    offsite:
      stage: B3
      kind: droplet
      module: digitalocean
      backup: pbs-last-chance
      converge: do1
      hosts:
        do1: {vmid: 9900, node: digitalocean}
      post_conditions: [ssh-as-ansible, agents-active, alert-cleared, public-health-via-reserved-ip, containers-up, gatus-heartbeat-accepted, tailnet-tag-offsite]
    worker:
      stage: C
      kind: k8s-worker
      module: asgard-k3s
      backup: manifest # the data-loss manifest (worker_data_manifest) gates it, not a PBS last-chance backup
      converge: asgard-k3s
      hosts:
        einherjar-urd: {vmid: 2101, node: urd}
        einherjar-verd: {vmid: 2102, node: verd}
        einherjar-skuld: {vmid: 2103, node: skuld}
      post_conditions: [node-ready, calico-pod-running, vault-3-voters, no-pvc-pending, helmreleases-ready, local-path-serving, alert-cleared]
  deny: # refused at validation AND re-checked in the runner; lint pins the quorum/CP/brain members so they cannot be dropped
    names: [saga, fulla, vor, idunn, hlin, eir, snotra, hugin, factorio, gna, ratatoskr, frigg, gondul, hlokk, sigrun, pbs]
    vmids: [1101, 1102, 1110, 1120, 1121, 1122, 1130, 1131, 1132, 1133, 1134, 1135, 2001, 2002, 2003, 2900]
  policies: # all disabled: enabling one is a reviewed PR once its stage's gate has passed
    start-dead-canary: {enabled: false, action: start-guest, class: canary, runbook: RB-GUEST-DEAD, layers: [host, workload], min_confidence: medium, precheck: guest-dead}
    start-dead-replica: {enabled: false, action: start-guest, class: adguard-replica, runbook: RB-GUEST-DEAD, layers: [host, workload], min_confidence: medium, precheck: guest-dead}
    rebuild-dead-canary: {enabled: false, action: rebuild-guest, class: canary, runbook: RB-GUEST-DEAD, layers: [host, workload], min_confidence: medium, precheck: guest-dead}
    rebuild-broken-canary: {enabled: false, action: rebuild-guest, class: canary, runbook: RB-GUEST-BROKEN, layers: [workload, drift], min_confidence: medium, precheck: guest-broken}
    rebuild-dead-replica: {enabled: false, action: rebuild-guest, class: adguard-replica, runbook: RB-GUEST-DEAD, layers: [host, workload], min_confidence: medium, precheck: guest-dead} # flipped by PR after 2 clean approvals each

actions:
  # === T0: read-only =========================================================

  service-status:
    description: Read a systemd unit's state on one inventory host (ActiveState, SubState, restart count).
    tier: T0
    max_autonomy: auto
    idempotent: true
    idempotency: Read-only (systemctl show). Safe under --check; changes nothing.
    semaphore:
      template: aiops-service-status
      playbook: ansible/playbooks/aiops-service-status.yml
      applied: true
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
        description: A single inventory hostname (never a group or pattern).
      unit:
        type: string
        required: true
        pattern: '[A-Za-z0-9@:._-]+\.service'
    guard:
      summary: Any single inventory host; read-only, so no tier restriction. The playbook rejects patterns and unknown hosts.
      target_policy: any-inventory-host
    verify:
      self: true
      expect:
        ok: true
    rollback: Nothing to roll back (read-only).

  vault-status:
    description: Unauthenticated Vault seal/HA status via the vault CLI on Frigg (sealed, initialized, HA mode, version, Raft index). Reports the node the FQDN routes to, not a per-pod view (per-pod seal state needs the 10d2 read-only kubectl toolbelt).
    tier: T0
    max_autonomy: auto
    idempotent: true
    idempotency: Read-only (`vault status`, no token). Exit code 2 (sealed) is parsed, not treated as a task failure.
    semaphore:
      template: aiops-vault-status
      playbook: ansible/playbooks/aiops-vault-status.yml
      applied: true
    extra_vars: {}
    guard:
      summary: Runs on Frigg only; sends no credential. Does not call authenticated endpoints, so it cannot read secrets.
      target_policy: n/a
      needs: vault CLI on Frigg and control_node_vault_addr (roles/control-node/defaults).
    verify:
      self: true
      expect:
        ok: true
        sealed: false
    rollback: Nothing to roll back (read-only).

  patroni-status:
    description: Patroni cluster state from the open GET /cluster endpoint on the PG trio (members, roles, state, lag, leader present).
    tier: T0
    max_autonomy: auto
    idempotent: true
    idempotency: Read-only HTTP GET against the unauthenticated /cluster endpoint (same probe as infra-health-check).
    semaphore:
      template: aiops-patroni-status
      playbook: ansible/playbooks/aiops-patroni-status.yml
      applied: true
    extra_vars: {}
    guard:
      summary: GET /cluster only; the mutating Patroni endpoints (/switchover, /failover, /restart) need restapi auth and are never called here.
      target_policy: n/a
    verify:
      self: true
      expect:
        ok: true
        leader_present: true
    rollback: Nothing to roll back (read-only).

  replay-role-check:
    description: Dry-run (--check --diff) of site.yml for ONE host and an allow-listed role tag; reports what a replay would change. Always the first step of replay-role.
    tier: T0
    max_autonomy: auto
    idempotent: true
    idempotency: Runs with --check; by repo convention probe tasks that must execute under --check carry check_mode false and are read-only (known-issues/semaphore.md).
    semaphore:
      template: aiops-replay-role-check
      playbook: ansible/playbooks/aiops-replay-role-check.yml
      applied: true
      result_from: recap
      task_fields:
        arguments: ['--limit', '{target_host}', '--check', '--diff', '--tags', '{role_tag}']
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      role_tag:
        type: enum
        required: true
        values: [baseline, hardening, vlagent, zabbix-agent]
    guard:
      summary: The wrapper playbook asserts ansible_check_mode, a single-host --limit equal to target_host, an allow-listed tag, and a full inventory (>=20 hosts). A hosts:localhost preflight would be skipped under --limit (known-issues/lxc-proxmox.md), so the guard runs on `all` with run_once.
      target_policy: host_tiers.T1
      allowed_tags: [baseline, hardening, vlagent, zabbix-agent]
    verify:
      self: true
      expect:
        ok: true
        check_mode: true
    rollback: Nothing to roll back (check mode).

  # === T1: mutating, replay-safe, T1 hosts only ================================

  restart-unit:
    description: Restart one systemd unit on one T1 host, then wait until it reports active.
    tier: T1
    max_autonomy: auto # only through autonomy.policies.restart-failed-unit (10f), on autonomy.hosts
    idempotent: true
    idempotency: systemctl restart converges to the same running state on replay; the unit allow-list excludes units whose restart moves state (keepalived VIP, databases).
    semaphore:
      template: aiops-restart-unit
      playbook: ansible/playbooks/aiops-restart-unit.yml
      applied: true
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      unit:
        type: string
        required: true
        pattern: '[A-Za-z0-9@:._-]+\.service'
    guard:
      summary: Host must be in host_tiers.T1 AND the unit must be in the per-host allow-list below; anything else fails the play before any change.
      target_policy: host_tiers.T1
      allowed_units:
        mimir: [AdGuardHome.service]
        kvasir: [AdGuardHome.service]
        bifrost: [tailscaled.service]
        heimdall: [tailscaled.service]
        gjallarbru: [tailscaled.service]
        hermod: [apprise-api.service, caddy.service]
        canary-1: [vlagent.service, zabbix-agent2.service]
        canary-2: [vlagent.service, zabbix-agent2.service]
        canary-3: [vlagent.service, zabbix-agent2.service]
    verify:
      action: service-status
      vars:
        target_host: '{target_host}'
        unit: '{unit}'
      expect:
        ok: true
        active_state: active
    rollback: A restart has no inverse. If the unit does not come back active the play fails and the alert stays open; escalate to the unit's runbook. Bifrost is the subnet router, so restarting tailscaled there briefly interrupts tailnet routes (accepted at T1).

  canary-fault:
    description: Stop (or restore) ONE allow-listed systemd unit on ONE canary. Proposed only by the Toolbelt's own soak scheduler (10f soak), never by an agent or the operator's chat; mode restore is the undo.
    tier: T1
    max_autonomy: approval # never through an autonomy policy: the soak scheduler approves its own proposals as `soak`, and only while autonomy is ON
    idempotent: true
    idempotency: systemctl stop and start converge to the requested state on replay; the allow-list is two canary units and the guard confines the host to the disposable canary pool.
    internal: true
    internal_source: soak
    semaphore:
      template: aiops-canary-fault
      playbook: ansible/playbooks/aiops-canary-fault.yml
      applied: true # the aiops-canary-fault template was applied 2026-10-05 (terraform/semaphore, main checkout)
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      unit:
        type: string
        required: true
        pattern: '[A-Za-z0-9@:._-]+\.service'
      mode:
        type: enum
        required: true
        values: [stop, restore]
    guard:
      summary: The host must be a canary in host_tiers.T1 AND in soak.hosts, the unit in the per-host allow-list below; the playbook re-checks all of it (and that the host is in the `canary` group) before any change.
      target_policy: canaries
      allowed_units:
        canary-1: [vlagent.service, zabbix-agent2.service]
        canary-2: [vlagent.service, zabbix-agent2.service]
        canary-3: [vlagent.service, zabbix-agent2.service]
    verify:
      self: true
      expect:
        ok: true
    rollback: Run the same action with mode restore (the soak scheduler does it itself when autonomy has not healed the fault by the deadline), or `scripts/canary/fault restore <canary> <unit>` by hand. The canaries are disposable and hold no state.

  replay-role:
    description: Converge ONE allow-listed role tag on ONE T1 host by running site.yml with --limit and --tags (the same code path as asgard-apply, narrowed).
    tier: T1
    max_autonomy: approval
    idempotent: true
    idempotency: site.yml is the fleet's idempotent converge (drift-check runs it every 6h in --check mode and asgard-apply runs it for real). The role tags are the ones those plays already apply fleet-wide. The registry still requires replay-role-check first.
    semaphore:
      template: aiops-replay-role
      playbook: ansible/playbooks/aiops-replay-role.yml
      applied: true
      result_from: recap
      task_fields:
        arguments: ['--limit', '{target_host}', '--tags', '{role_tag}']
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      role_tag:
        type: enum
        required: true
        values: [baseline, hardening, vlagent, zabbix-agent]
    guard:
      summary: Wrapper playbook asserts not-check-mode, a single-host --limit equal to target_host, an allow-listed tag, host in host_tiers.T1, and a full inventory. The executor must have a clean replay-role-check diff (in scope, no unexpected hosts/tasks) for the same host and tag first. Roles with their own idempotency guards (calico-upgrade, k3s-upgrade) are not tags in the allow-list.
      target_policy: host_tiers.T1
      allowed_tags: [baseline, hardening, vlagent, zabbix-agent]
      requires_prior: replay-role-check
    verify:
      action: replay-role-check
      vars:
        target_host: '{target_host}'
        role_tag: '{role_tag}'
      expect:
        ok: true
        changed: 0
    rollback: Replaying a converge has no inverse; the previous state is whatever Git declared before the drift. If verify still shows changes after the replay, stop and escalate (the drift is not role-convergeable, e.g. a provision-layer setting, see RB-LXC-BOOT-DRIFT).

  # === 10h2: prove an agent-authored PR on a canary (internal: only the Toolbelt proposes these) ===========================
  # The same shape as replay-role-check / replay-role (check, converge, second check = idempotence) but the Semaphore task is
  # started with `git_branch` = the PR branch (Semaphore 2.18 honours a per-task branch), so the PR's role code runs on ONE canary.
  # The branch's own guard playbooks are NEVER trusted: the Toolbelt reads the PR from GitHub (read-only) before it proposes and
  # again before it runs, and refuses anything but role content for the listed roles (guard.pr_scope).
  pr-test-check:
    description: Dry-run (--check --diff) of a PR branch's version of one canary-exercised role on ONE canary; the first and last step of pr-canary-test.
    tier: T1
    max_autonomy: approval
    internal: true
    idempotent: true
    idempotency: Runs with --check; the PR's tasks that must execute under --check carry check_mode false by repo convention (known-issues/semaphore.md).
    semaphore:
      template: aiops-replay-role-check
      playbook: ansible/playbooks/aiops-replay-role-check.yml
      applied: true
      result_from: recap
      task_fields:
        git_branch: '{pr_branch}'
        arguments: ['--limit', '{target_host}', '--check', '--diff', '--tags', '{role_tag}']
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: 'canary-[0-9]+'
      role_tag:
        type: enum
        required: true
        values: [baseline, hardening, vlagent, zabbix-agent]
      pr_branch:
        type: string
        required: true
        pattern: 'agent/(drift|capacity)/[0-9]+-[a-z0-9][a-z0-9-]*'
      pr_sha:
        type: string
        required: true
        pattern: '[0-9a-f]{40}'
    guard:
      summary: One canary only (the wrapper asserts a single-host --limit in host_tiers.T1 and check mode); the PR is checked by the Toolbelt itself against GitHub (agent PR, role content for one allow-listed role, no deletions, no risky constructs) before this is proposed and before it runs.
      target_policy: canaries
      allowed_tags: [baseline, hardening, vlagent, zabbix-agent]
      pr_scope:
        classes: [drift, capacity]
        roles: [baseline, hardening, vlagent, zabbix-agent]
    verify:
      self: true
      expect:
        ok: true
        check_mode: true
    rollback: Nothing to roll back (check mode).

  pr-canary-test:
    description: Run a PR branch's version of one canary-exercised role on ONE canary - dry run, converge, second dry run (changed=0 = idempotent) - so the PR carries evidence of a real run.
    tier: T1
    max_autonomy: approval
    internal: true
    idempotent: true
    idempotency: site-nonprod.yml is the canary pool's idempotent converge; the second dry run in verify proves the PR's change is idempotent on the canary.
    semaphore:
      template: aiops-replay-role
      playbook: ansible/playbooks/aiops-replay-role.yml
      applied: true
      result_from: recap
      task_fields:
        git_branch: '{pr_branch}'
        arguments: ['--limit', '{target_host}', '--tags', '{role_tag}']
    extra_vars:
      target_host:
        type: string
        required: true
        pattern: 'canary-[0-9]+'
      role_tag:
        type: enum
        required: true
        values: [baseline, hardening, vlagent, zabbix-agent]
      pr_branch:
        type: string
        required: true
        pattern: 'agent/(drift|capacity)/[0-9]+-[a-z0-9][a-z0-9-]*'
      pr_sha:
        type: string
        required: true
        pattern: '[0-9a-f]{40}'
    guard:
      summary: Same as pr-test-check, plus a clean dry run of the PR's code must pass first. A canary is disposable (10b1; alerts capped at info); nothing here touches a production host.
      target_policy: canaries
      allowed_tags: [baseline, hardening, vlagent, zabbix-agent]
      requires_prior: pr-test-check
      pr_scope:
        classes: [drift, capacity]
        roles: [baseline, hardening, vlagent, zabbix-agent]
    verify:
      action: pr-test-check
      vars:
        target_host: '{target_host}'
        role_tag: '{role_tag}'
        pr_branch: '{pr_branch}'
        pr_sha: '{pr_sha}'
      expect:
        ok: true
        changed: 0
    rollback: A canary is disposable; if the test leaves it wrong, rebuild it (10g stage A). Nothing else was touched.

  # 10h: prove an agent PR that changes ONE app under k8s/asgard/apps/ on a throwaway burst cluster (docs/plans/active/10h-k8s-burst-test.md). The Toolbelt
  # proposes it itself for a PR it has inspected on GitHub (guard.pr_scope kind k8s), the operator approves the card, and the BURST RUNNER on Frigg
  # (aiops/runner/burst_runner.py: a root-loaded service with its own Vault identity and a socket) builds the cluster, tests the PR's manifests and tears
  # the cluster down. No Semaphore template exists or is needed (runner_only); `applied` flips to true by PR once the runner is deployed.
  pr-burst-test:
    description: Apply an agent PR's one-app k8s change to a throwaway burst cluster (Flux, a one-node Vault with random seeds, same charts) and check HelmReleases, ExternalSecrets and workloads, then destroy the cluster.
    tier: T1
    max_autonomy: approval
    internal: true
    scope: burst
    steps:
      - {name: test, backend: burst}
    idempotent: true
    idempotency: Every run builds a fresh cluster from Terraform and destroys it afterwards; nothing persists and nothing in asgard is touched, so a rerun is a clean new test.
    semaphore:
      applied: true # the burst runner is deployed (2026-10-05, docs/procedures/k8s-burst-test.md "Deploy")
      runner_only: true
    extra_vars:
      pr_branch:
        type: string
        required: true
        pattern: 'agent/(k8s|rightsizing)/[0-9]+-[a-z0-9][a-z0-9-]*'
      pr_sha:
        type: string
        required: true
        pattern: '[0-9a-f]{40}'
      component:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
    guard:
      summary: One app per PR (the Toolbelt reads the PR from GitHub itself and requires an agent k8s PR with yaml under exactly one k8s/asgard/apps/<app>/, no deletes or renames and no host-level constructs). The runner re-checks the branch head, builds the burst cluster (DigitalOcean, no route to prod), and always destroys it; the Frigg reaper is the cost backstop.
      target_policy: burst-cluster
      pr_scope:
        kind: k8s
        classes: [k8s, rightsizing]
    verify:
      self: true
      expect:
        ok: true # the runner's `passed` verdict, mirrored as `ok` in the stored result
    rollback: Nothing to roll back; the burst cluster is destroyed at the end of every run (if teardown ever fails, `scripts/burst/burst-down --yes` on Frigg, and the TTL reaper).

  flux-reconcile:
    description: Nudge Flux to reconcile one HelmRelease now (`flux reconcile hr <hr_name> -n <hr_namespace>`); applies only what Git already declares.
    tier: T1
    max_autonomy: approval
    idempotent: true
    idempotency: A reconcile re-evaluates desired state from Git; replaying with no new commit is a no-op. It never edits the release, only triggers the controller.
    semaphore:
      template: aiops-flux-reconcile
      playbook: ansible/playbooks/aiops-flux-reconcile.yml
      applied: true
    extra_vars:
      hr_name:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      hr_namespace:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
    fixed_vars:
      reset: false
    guard:
      summary: HelmRelease must not be on the stateful deny-list. The template runs on Frigg (flux CLI + kubeconfig live there; the Semaphore pod has neither the flux CLI nor RBAC on HelmReleases).
      target_policy: n/a
      denied_releases: [vault, immich, netbox, authentik, victoriametrics, victorialogs, synology-csi, csi-driver-nfs, local-path-provisioner, sealed-secrets]
      needs: flux CLI + kubeconfig for the operator user on Frigg (roles/control-node). Open question for 10e - run it with a scoped ServiceAccount, not the operator kubeconfig.
    verify:
      self: true
      expect:
        ok: true
        ready: 'True'
    rollback: None needed; if the release goes unhealthy, follow RB-FLUX-HR-STALLED / the Helm rollback steps in known-issues/flux-helm-kustomize.md.

  flux-reconcile-reset:
    description: Reset the retry budget of a Stalled HelmRelease and reconcile it (`flux reconcile hr <hr_name> -n <hr_namespace> --reset`).
    tier: T1
    max_autonomy: approval
    idempotent: true
    idempotency: --reset zeroes the failure counters and re-attempts what Git declares; replay after a success is a no-op. NOT proof against a repeated failed upgrade, hence the allow-list below.
    semaphore:
      template: aiops-flux-reconcile
      playbook: ansible/playbooks/aiops-flux-reconcile.yml
      applied: true
    extra_vars:
      hr_name:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      hr_namespace:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
    fixed_vars:
      reset: true
    guard:
      summary: STRICT allow-list of stateless releases; a retried upgrade can re-run a DB migration and a failed one can roll back into a poisoned DB (Immich, 2026-09-30). The playbook also refuses while any node is NotReady (a Stalled release on a dead host is RB-FLUX-HR-NODE-OUTAGE, not a chart fault).
      target_policy: n/a
      allowed_releases: [kube-state-metrics, victoria-logs-collector, vmagent]
      needs: flux CLI + kubeconfig for the operator user on Frigg.
    verify:
      self: true
      expect:
        ok: true
        ready: 'True'
    rollback: --reset has no inverse. If the release fails again it stays Stalled and the alert stays open; do not loop (the 10f1 circuit breaker caps attempts per target).

  # === Phase 10g: fleet rebuild loop (planned; policy data only, nothing is built) ============================
  # `semaphore.planned: true` = the template and playbook are NOT written yet (10g2), so lint does not require them
  # to exist; `applied: false` keeps the engine from running them regardless. Classes, targets and guards live in the
  # `rebuild:` section above; every target is re-checked against it by the Toolbelt AND the (future) runner.

  rebuild-plan:
    description: Plan the replace (or create) of ONE rebuild-class guest on the Frigg rebuild runner and machine-check that the plan is exactly one in-scope change; changes nothing.
    tier: T0
    max_autonomy: auto
    scope: rebuild
    steps:
      - {name: plan, backend: runner}
    idempotent: true
    idempotency: Read-only (`terraform plan -replace -target -out`); the saved plan is a file, no state is written.
    semaphore:
      applied: true # the runner is deployed (2026-10-03); runner_only: no Semaphore template or playbook exists or is needed
      runner_only: true
    extra_vars:
      target:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
        description: One name from a rebuild.classes host list (never a group or pattern).
    guard:
      summary: Target must be in a rebuild class and not on rebuild.deny; the plan must pass the shape rules (one replace or create, identity unchanged, nothing else).
      target_policy: n/a
      needs: the Frigg rebuild runner (10g1 slice 1); not built.
    verify:
      self: true
      expect:
        ok: true
        plan_ok: true
    rollback: Nothing changed.

  start-guest:
    description: Rung 0 of the rebuild ladder - start (or reboot) ONE stopped rebuild-class guest through the PVE API; never creates or destroys.
    tier: T1
    max_autonomy: auto # only through a rebuild.policies entry (start-dead-*), classes canary and adguard-replica; all disabled today
    scope: rebuild
    idempotent: true
    idempotency: Starting a running guest is a no-op; the action never creates or destroys.
    semaphore:
      template: aiops-start-guest
      playbook: ansible/playbooks/aiops-start-guest.yml
      applied: true
    extra_vars:
      target:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
    guard:
      summary: Target must be in a rebuild class, not on rebuild.deny, on a healthy node; start only.
      target_policy: n/a
    verify:
      self: true
      expect:
        ok: true
        running: true
    rollback: None needed (a started guest can be stopped again by the operator).

  rebuild-guest:
    description: Destroy and recreate ONE rebuild-class LXC or droplet from the repo in place (steps plan, apply the saved plan, converge, verify); same node, VMID, name and IP.
    tier: T1
    max_autonomy: approval # auto only through a rebuild.policies entry per class, under the separate autonomy_rebuild switch; none enabled today
    scope: rebuild
    steps: # run by toolbelt/rebuild_exec.py; `plan` happens when the proposal is created (the proposal is bound to that plan)
      - {name: plan, backend: runner}
      - {name: apply, backend: runner}
      - {name: converge, backend: semaphore}
      - {name: verify, backend: semaphore, action: rebuild-verify}
    idempotent: true
    idempotency: Resumable from state, not blind replay. Re-proposing after a mid-way failure re-plans from what Terraform and the guest report, and the apply is bound to the plan hash.
    semaphore:
      template: aiops-rebuild-converge
      playbook: ansible/playbooks/aiops-rebuild-converge.yml
      applied: true
      task_fields:
        arguments: ['--limit', '{target}']
    extra_vars:
      target:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
      plan_hash:
        type: string
        required: false
        pattern: '[0-9a-f]{64}'
        description: Optional. The plan_id of a rebuild-plan that succeeded for this target; when absent the Toolbelt plans on the runner itself when the proposal is created. The proposal is bound to that plan, and the apply refuses any other.
    guard:
      summary: rebuild.classes allow-list (not worker), not on rebuild.deny, healthy node, peers healthy, leader-aware, rate limits and breaker closed, one in flight; requires a rebuild-plan with the same hash.
      target_policy: n/a
      requires_prior: rebuild-plan
    verify:
      action: rebuild-verify
      vars:
        target: '{target}'
      expect:
        ok: true
    rollback: Restore the last-chance PBS backup to the same VMID (`pct restore`); for canaries nothing to restore, rebuild again.

  rebuild-worker:
    description: Replace ONE asgard K3s worker VM (cordon and drain, backup gate, plan and apply, delete the node object, converge, uncordon); approval only, behind the data-loss manifest.
    tier: T2
    max_autonomy: approval # always, until the 10g3 gate (three consecutive approved rebuilds, a restore drill, a clean manifest)
    scope: rebuild
    steps: # the drain runs BEFORE the apply and the converge (delete the node object, join, uncordon) AFTER it; the `phase` var tells the playbook which
      - {name: plan, backend: runner}
      - {name: drain, backend: semaphore, vars: {phase: drain}}
      - {name: apply, backend: runner}
      - {name: converge, backend: semaphore, vars: {phase: converge}}
      - {name: verify, backend: semaphore, action: rebuild-verify}
    idempotent: true
    idempotency: Resumable from state (Terraform and the cluster say where it stopped); the apply is bound to the plan hash.
    semaphore:
      template: aiops-rebuild-worker
      playbook: ansible/playbooks/aiops-rebuild-worker.yml
      applied: false
      planned: true
      task_fields:
        arguments: ['--limit', '{target}']
    extra_vars:
      target:
        type: string
        required: true
        pattern: 'einherjar-(urd|verd|skuld)'
      plan_hash:
        type: string
        required: false
        pattern: '[0-9a-f]{64}'
    guard:
      summary: Worker allow-list only (never a control-plane VM), all other nodes Ready and etcd 3/3, Vault unsealed with 3 peers, the data manifest does not block (single-instance data needs a PBS backup of /data within 24 h), a rebuild-plan with the same hash.
      target_policy: n/a
      requires_prior: rebuild-plan
    verify:
      action: rebuild-verify
      vars:
        target: '{target}'
      expect:
        ok: true
    rollback: The node is replaceable. Data restore is the worker /data PBS backup (single-instance PVs) or Raft resync (Vault).

  rebuild-verify:
    description: Class-specific post-conditions for a rebuilt guest (rebuild.classes post_conditions, plus the originating alert cleared); read-only.
    tier: T0
    max_autonomy: auto
    scope: rebuild
    idempotent: true
    idempotency: Read-only checks.
    semaphore:
      template: aiops-rebuild-verify
      playbook: ansible/playbooks/aiops-rebuild-verify.yml
      applied: true
    extra_vars:
      target:
        type: string
        required: true
        pattern: '[a-z0-9][a-z0-9-]*'
    guard:
      summary: Any rebuild-class target; read-only.
      target_policy: n/a
    verify:
      self: true
      expect:
        ok: true
    rollback: Nothing to roll back (read-only).
