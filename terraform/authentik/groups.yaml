# terraform/authentik/groups.yaml
#
# Authentik groups, identity-as-data. Each top-level key is a group name.
#
# Group membership is NOT defined here — see users.yaml. Each user lists
# the groups they belong to; this file only defines group existence and
# group-level attributes (is_superuser, attributes, roles).
#
# Adding a group:
#   1. Add an entry below
#   2. terraform apply
#   3. Reference the group name in users.yaml `groups:` lists

authentik-admins:
  is_superuser: true
  # Full Authentik-administrator group. Members can manage users, providers,
  # applications, policies — everything.

tailscale-users:
  is_superuser: false
  # Members can authenticate via the Tailscale OIDC application. Gates
  # Tailscale tailnet access through Authentik (see tailscale.tf).

ssh-users:
  is_superuser: false
  # Future-fit for SSSD-on-Linux-hosts integration. Members will be able
  # to SSH into homelab nodes once SSSD + Authentik LDAP outpost are
  # deployed. No effect today (no consumer yet) — defining now so user
  # membership is in place when SSSD lands.

netbox-admins:
  is_superuser: false
  # Members can authenticate to NetBox via the OIDC Application (see
  # netbox.tf for the policy binding). NetBox-side permissions
  # (admin/staff/specific object permissions) are assigned manually in
  # the NetBox UI on first OIDC login — automatic group→permission sync
  # requires a custom SOCIAL_AUTH_PIPELINE override and is deferred.
  # is_superuser=false because the group grants no Authentik-side
  # privileges; gating is via the per-app policy binding only.

netbox-viewers:
  is_superuser: false
  # Same OIDC-access gate as netbox-admins, but for users who should
  # only get read-only NetBox permissions. Manual assignment in NetBox
  # UI on first login (same caveat re: automatic sync).

monitoring-admins:
  is_superuser: false
  # Members can authenticate to the Phase-8 observability stack —
  # VictoriaMetrics (metric.niflheim.xiiisins.com) + VictoriaLogs
  # (logs.niflheim.xiiisins.com) — gated by Authentik ForwardAuth
  # through Traefik. The apps themselves don't have an internal
  # permission model; access = full read+write to the UI/API. Treat
  # this group as operator-only. is_superuser=false (no Authentik-
  # side privileges); gating is the per-app policy binding.

outline-users:
  is_superuser: false
  # Members can authenticate to the Outline wiki
  # (wiki.xiiisins.com / wiki.midgard / wiki.niflheim) via the OIDC
  # Application (see outline.tf for the policy binding). Outline-side
  # roles (admin/member/viewer) are assigned in the Outline UI by
  # workspace admins after first OIDC login. is_superuser=false
  # (group grants no Authentik-side privileges); gating is the per-app
  # policy binding only.

zabbix-admins:
  is_superuser: false
  # Members can authenticate to Zabbix (hugin.xiiisins.com /
  # hugin.midgard.xiiisins.com) via the native SAML Application (see
  # zabbix.tf for the policy binding). Zabbix-side JIT provisioning
  # reads the SAML Groups attribute and dispatches into the built-in
  # `Zabbix administrators` usergroup on first login — no manual
  # post-login permission assignment needed (different from netbox-
  # admins, which requires manual NetBox-side elevation).
  # is_superuser=false (no Authentik-side privileges); gating is the
  # per-app policy binding only. Day-1 mapping is single-group only;
  # extend with zabbix-viewers when read-only dashboard access for
  # non-operator users becomes a real need.

semaphore-admins:
  is_superuser: false
  # Members can authenticate to Semaphore — the Ansible orchestrator
  # (semaphore.niflheim.xiiisins.com, Phase 5h.3). Semaphore has its
  # own RBAC model (Admin / User / per-project roles); group claim
  # from Authentik OIDC is mapped via Semaphore's `role_claim` config
  # to the admin role on first login. Operator-only today; expand if
  # a second human operator joins. is_superuser=false (no Authentik-
  # side privileges); gating is the per-app policy binding only.

paste-janitors:
  is_superuser: false
  # Members can reach MicroBin's gated routes (/pastalist + /admin at
  # paste.xiiisins.com) via Authentik ForwardAuth through Traefik — the
  # trusted "janitor" crew who browse the paste list and prune crap.
  # Anonymous create/view/upload is NOT gated by this group (those paths
  # bypass the Middleware). MicroBin has no internal user model, so this
  # group == "can browse + delete any paste"; treat as trusted-only.
  # is_superuser=false (no Authentik-side privileges); gating is the
  # per-app policy binding only (see microbin.tf).

vault-admins:
  is_superuser: false
  # Members can authenticate to the HashiCorp Vault UI
  # (vault.niflheim.xiiisins.com, Phase 6 Stage 1) via the native OIDC
  # Application (see terraform/authentik/vault.tf for the policy binding)
  # and receive the Vault `homelab-admin` policy (read+list on secret/*).
  # This per-app binding IS the authoritative access gate — Vault's role
  # grants its policy to anyone who completes the flow, so membership here
  # == Vault human-lookup access. is_superuser=false (no Authentik-side
  # privileges). Single-tier day-1; add vault-readers when a read-narrower
  # tier is needed.

n8n-admins:
  is_superuser: false
  # Members can reach the n8n editor UI (n8n.niflheim.xiiisins.com) via
  # Authentik ForwardAuth through Traefik (terraform/authentik/n8n.tf).
  # This gates the INTERNAL editor only — the external webhook host
  # (n8n.xiiisins.com) is deliberately ungated so third-party services can
  # POST to /webhook/* (n8n authenticates webhooks per-workflow). Behind
  # this gate, n8n keeps its OWN owner/email-password login as defence-in-
  # depth — so membership here == "can reach the n8n login screen", not
  # automatic n8n access. is_superuser=false (no Authentik-side privileges);
  # gating is the per-app policy binding only.
