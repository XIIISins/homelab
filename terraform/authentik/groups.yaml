# terraform/authentik/groups.yaml
#
# Authentik groups, identity-as-data. Each top-level key is a group name.
#
# Group membership is NOT defined here — see users.yaml. Each user lists
# the groups they belong to; this file only defines group existence and
# group-level attributes (is_superuser, attributes, roles).
#
# Adding a group:
#   1. Add an entry below
#   2. terraform apply
#   3. Reference the group name in users.yaml `groups:` lists

authentik-admins:
  is_superuser: true
  # Full Authentik-administrator group. Members can manage users, providers,
  # applications, policies — everything.

tailscale-users:
  is_superuser: false
  # Members can authenticate via the Tailscale OIDC application. Gates
  # Tailscale tailnet access through Authentik (see tailscale.tf).

ssh-users:
  is_superuser: false
  # Future-fit for SSSD-on-Linux-hosts integration. Members will be able
  # to SSH into homelab nodes once SSSD + Authentik LDAP outpost are
  # deployed. No effect today (no consumer yet) — defining now so user
  # membership is in place when SSSD lands.

netbox-admins:
  is_superuser: false
  # Members can authenticate to NetBox via the OIDC Application (see
  # netbox.tf for the policy binding). NetBox-side permissions
  # (admin/staff/specific object permissions) are assigned manually in
  # the NetBox UI on first OIDC login — automatic group→permission sync
  # requires a custom SOCIAL_AUTH_PIPELINE override and is deferred.
  # is_superuser=false because the group grants no Authentik-side
  # privileges; gating is via the per-app policy binding only.

netbox-viewers:
  is_superuser: false
  # Same OIDC-access gate as netbox-admins, but for users who should
  # only get read-only NetBox permissions. Manual assignment in NetBox
  # UI on first login (same caveat re: automatic sync).

monitoring-admins:
  is_superuser: false
  # Members can authenticate to the Phase-7 observability stack —
  # VictoriaMetrics (metric.niflheim.xiiisins.com) + VictoriaLogs
  # (logs.niflheim.xiiisins.com) — gated by Authentik ForwardAuth
  # through Traefik. The apps themselves don't have an internal
  # permission model; access = full read+write to the UI/API. Treat
  # this group as operator-only. is_superuser=false (no Authentik-
  # side privileges); gating is the per-app policy binding.
